suite: crdkit diagnostic helpers
templates:
  - test.yaml
tests:
  - it: diag.error and diag.warning append in call order to their own lists
    set:
      diagOps:
        - {level: error, message: "first error"}
        - {level: warning, message: "first warning"}
        - {level: error, message: "second error"}
        - {level: warning, message: "second warning"}
    asserts:
      - equal:
          path: diag.errors
          value: ["first error", "second error"]
      - equal:
          path: diag.warnings
          value: ["first warning", "second warning"]

  - it: diag.info appends in call order to diag.infos, created when missing
    set:
      diagOps:
        - {level: info, message: "first info"}
        - {level: warning, message: "a warning"}
        - {level: info, message: "second info"}
    asserts:
      - equal:
          path: diag.infos
          value: ["first info", "second info"]
      - equal:
          path: diag.warnings
          value: ["a warning"]
      - equal:
          path: diag.errors
          value: []
