suite: crdkit token interpolation
templates:
  - test.yaml
tests:

  # --- basic scalar / chained @ref@ resolution (target-agnostic) ---

  - it: resolves a simple scalar token
    set:
      target: prod-01
      tokens.GREETING: "hello"
      structure.message: "@GREETING@"
    asserts:
      - equal:
          path: structure.message
          value: "hello"

  - it: "a bare scalar declaration is normalized into a dict under the literal 'default' key, so ctx.tokens[NAME] is always a dict"
    set:
      target: prod-01
      tokens.GREETING: "hello"
    asserts:
      # raw declaration, post-merge, pre-resolution — no structure/
      # crossTargets reference, so this is purely what
      # crdkit.tokens.merge.internal normalized "hello" into.
      - equal:
          path: tokens.GREETING
          value:
            default: "hello"

  - it: "'default' is a hardcoded crdkit-level fallback, resolving unconditionally for ANY target — no taxonomy needed"
    set:
      target: some-unrecognized-target-with-no-taxonomy-hop-at-all
      tokens.DB_HOST.default: "db.internal"
      crossTargets:
        - "some-unrecognized-target-with-no-taxonomy-hop-at-all"
      crossTargetNames:
        - "DB_HOST"
    asserts:
      - equal:
          path: crossResolved.some-unrecognized-target-with-no-taxonomy-hop-at-all.DB_HOST.value
          value: "db.internal"
      - lengthEqual:
          path: diag.errors
          count: 0

  - it: "'default' is checked AFTER the parentTarget walk, not before — a more specific taxonomy-reached value always wins over it"
    set:
      target: prod-01
      parentTargetMap:
        prod-01: "PROD"
      tokens.REGION:
        default: "generic-region"
        PROD: "prod-specific-region"
      structure.region: "@REGION@"
    asserts:
      - equal:
          path: structure.region
          value: "prod-specific-region"

  - it: a token referencing another token (one level) resolves correctly
    set:
      target: prod-01
      tokens.A: "foo"
      tokens.B: "@A@-bar"
      structure.message: "@B@"
    asserts:
      - equal:
          path: structure.message
          value: "foo-bar"

  - it: a token referencing a chain of 3+ tokens resolves via the iterative resolver
    set:
      target: prod-01
      tokens.T1: "one"
      tokens.T2: "@T1@-two"
      tokens.T3: "@T2@-three"
      structure.message: "@T3@"
    asserts:
      - equal:
          path: structure.message
          value: "one-two-three"

  - it: a direct two-token @ref@ cycle records an ERROR mentioning a cycle, and does not hang
    set:
      target: prod-01
      tokens.A: "@B@"
      tokens.B: "@A@"
      structure.x: "@A@"
    asserts:
      - matchRegex:
          path: diag.errors[0]
          pattern: "cycle"

  - it: "@AT@ resolves to a literal @ character, applied only on the final substitution pass"
    set:
      target: prod-01
      structure.email: "user@AT@example.com"
    asserts:
      - equal:
          path: structure.email
          value: "user@example.com"

  - it: "@AT@ escapes text the marker pattern would otherwise read as a marker"
    set:
      target: prod-01
      structure.email: "@AT@example.com@AT@"
    asserts:
      - equal:
          path: structure.email
          value: "@example.com@"
      - lengthEqual:
          path: diag.warnings
          count: 0

  - it: "a dotted token name resolves through its '@A.b@' marker"
    set:
      target: prod-01
      tokens:
        A.b: "hello"
      structure:
        message: "@A.b@ world"
    asserts:
      - equal:
          path: structure.message
          value: "hello world"
      - lengthEqual:
          path: diag.errors
          count: 0

  - it: "dotted token names chain like any other name, per target"
    set:
      target: prod-01
      tokens:
        SVC.host: "h1"
        SVC.port: {default: "80", prod-01: "8080"}
        SVC.url: "http://@SVC.host@:@SVC.port@"
      structure:
        url: "@SVC.url@"
    asserts:
      - equal:
          path: structure.url
          value: "http://h1:8080"

  - it: "a dotted marker naming no token is left untouched"
    set:
      target: prod-01
      structure:
        email: "@example.com@"
    asserts:
      - equal:
          path: structure.email
          value: "@example.com@"

  - it: a declared-but-never-used token produces no diagnostic at all, even if it would error if resolved
    set:
      target: prod-01
      tokens.BROKEN: {}
    asserts:
      - lengthEqual:
          path: diag.errors
          count: 0
      - lengthEqual:
          path: diag.warnings
          count: 0

  - it: an entirely unset target produces NO diagnostic when nothing is ever resolved against it — no proactive check anymore
    set:
      target: ""
      tokens: {}
    asserts:
      - lengthEqual:
          path: diag.errors
          count: 0

  - it: resolving a name that was never declared at all (e.g. via crossTargets/crdkit.token.value directly) records an ERROR, not a fail()
    set:
      target: prod-01
      crossTargets:
        - "prod-01"
      crossTargetNames:
        - "NEVER_DECLARED"
    asserts:
      - equal:
          path: diag.errors[0]
          value: "unknown token 'NEVER_DECLARED' referenced"
      - equal:
          path: crossResolved.prod-01.NEVER_DECLARED.value
          value: ""

  # --- dedicated attribute: a literal key equal to the exact target ---

  - it: a dedicated attribute (literal key equal to the exact target) resolves directly, at any granularity
    set:
      target: prod-01
      tokens.COLOR:
        prod-01: "red"
        blue-thing: "blue"
      structure.color: "@COLOR@"
    asserts:
      - equal:
          path: structure.color
          value: "red"

  - it: a dedicated attribute works for a bare, unsequenced target too — crdkit doesn't care about shape
    set:
      target: staging
      tokens.COLOR:
        staging: "teal"
      structure.color: "@COLOR@"
    asserts:
      - equal:
          path: structure.color
          value: "teal"

  - it: no dedicated attribute, no match, no parentTargetMap configured — an honest ERROR, not a silent wrong answer
    set:
      target: prod-01
      tokens.BROKEN:
        qa-01: "wrong-target-entirely"
      structure.x: "@BROKEN@"
    asserts:
      - equal:
          path: diag.errors[0]
          value: "no value found for 'BROKEN' — target chain exhausted at 'prod-01' starting from 'prod-01'"

  # --- match: (regex, tried once, unconditionally, before any escalation) ---

  - it: "match: resolves against the full target string — no shape requirement, works for any target"
    set:
      target: canary-thing
      tokens.SUBENV:
        match:
          - "canary-.*": "is-canary"
      structure.subenv: "@SUBENV@"
    asserts:
      - equal:
          path: structure.subenv
          value: "is-canary"

  - it: "match: rule values can reference capture groups from the pattern"
    set:
      target: qam1-05
      tokens.PREFIX:
        match:
          - "(.+)-[0-9]{2}": "$1"
      structure.prefix: "@PREFIX@"
    asserts:
      - equal:
          path: structure.prefix
          value: "qam1"

  - it: "match: first matching rule wins even when a later rule would also match"
    set:
      target: prod-01
      tokens.MULTI:
        match:
          - "prod-01": "first-match"
          - "prod-[0-9]{2}": "second-match-would-also-fit"
      structure.multi: "@MULTI@"
    asserts:
      - equal:
          path: structure.multi
          value: "first-match"

  - it: a dedicated attribute wins over a match rule that would also fire — most specific always beats pattern-based
    set:
      target: prod-01
      tokens.HOST:
        prod-01: "dedicated-wins"
        match:
          - "prod-[0-9]{2}": "pattern-would-fire-too"
      structure.host: "@HOST@"
    asserts:
      - equal:
          path: structure.host
          value: "dedicated-wins"

  # --- the parent-chain walk (crdkit.render's "parentTargetTemplate", client-supplied) ---

  - it: walks a single escalation hop when the exact target has no dedicated attribute
    set:
      target: prod-01
      tokens.REGION:
        prod: "us-east-1"
      structure.region: "@REGION@"
      parentTargetMap:
        prod-01: prod
    asserts:
      - equal:
          path: structure.region
          value: "us-east-1"

  - it: walks multiple escalation hops, caching every rung visited along the way, not just the one where the value was found
    set:
      target: qam1-01
      tokens.REGION2:
        NONPROD: "region-nonprod"
      parentTargetMap:
        qam1-01: qam1
        qam1: QA
        QA: NONPROD
      crossTargets:
        - "qam1-01"
      crossTargetNames:
        - "REGION2"
    asserts:
      - equal:
          path: crossResolved.qam1-01.REGION2.value
          value: "region-nonprod"
      - equal:
          path: tokens.REGION2._value.qam1-01
          value: "region-nonprod"
      - equal:
          path: tokens.REGION2._value.qam1
          value: "region-nonprod"
      - equal:
          path: tokens.REGION2._value.QA
          value: "region-nonprod"
      - equal:
          path: tokens.REGION2._value.NONPROD
          value: "region-nonprod"

  - it: with no parentTargetMap configured, there is NO escalation at all — same as crdkit.noParentTarget
    set:
      target: prod-01
      tokens.REGION:
        prod: "us-east-1"
      structure.region: "@REGION@"
    asserts:
      - equal:
          path: diag.errors[0]
          value: "no value found for 'REGION' — target chain exhausted at 'prod-01' starting from 'prod-01'"

  - it: a malformed client escalation map that cycles back on itself is caught as an ERROR, not a hang
    set:
      target: a
      tokens.X:
        unused: "never-reached"
      structure.x: "@X@"
      parentTargetMap:
        a: b
        b: a
    asserts:
      - equal:
          path: diag.errors[0]
          value: "target escalation chain for 'X' cycles back to 'a' while resolving from 'a'"
      - lengthEqual:
          path: diag.errors
          count: 1

  - it: "match: is evaluated fresh for the exact target even when a broader rung's cache is already populated from a DIFFERENT target's walk"
    set:
      target: prod-01
      tokens.SPECIAL:
        NONPROD: "generic-nonprod"
        match:
          - "qap1-[0-9]{2}": "special-value"
      parentTargetMap:
        qam1-01: qam1
        qam1: QA
        QA: NONPROD
        qap1-02: qap1
        qap1: QA
      crossTargets:
        - "qam1-01"
        - "qap1-02"
      crossTargetNames:
        - "SPECIAL"
    asserts:
      - equal:
          path: crossResolved.qam1-01.SPECIAL.value
          value: "generic-nonprod"
      - equal:
          path: crossResolved.qap1-02.SPECIAL.value
          value: "special-value"
      - equal:
          path: tokens.SPECIAL._value.QA
          value: "generic-nonprod"

  - it: the walk supports an arbitrary number of named rungs, not a fixed "family/tier" depth — some branches shorter than others
    set:
      target: prod-01
      tokens.REGION3:
        PROD: "us-east-1"
      parentTargetMap:
        prod-01: prod
        prod: PROD
      structure.region: "@REGION3@"
    asserts:
      - equal:
          path: structure.region
          value: "us-east-1"

  - it: "a value found via the walk still gets @ref@-chained normally, same as a dedicated attribute or match result"
    set:
      target: qa-01
      tokens.HOST_NAME: "db1"
      tokens.DB_HOST:
        QA: "@HOST_NAME@.internal"
      parentTargetMap:
        qa-01: qa
        qa: QA
      structure.dbHost: "@DB_HOST@"
    asserts:
      - equal:
          path: structure.dbHost
          value: "db1.internal"

  # --- structural values: a resolved entry can be a dict/list, not just a scalar ---

  - it: "a dict-shaped resolved value comes back as a dict, with every string leaf's @ref@ markers substituted"
    set:
      target: prod
      tokens.DB_HOST: "db.internal"
      tokens.CONFIG.default:
        host: "@DB_HOST@"
        port: 5432
      crossTargets:
        - "prod"
      crossTargetNames:
        - "CONFIG"
    asserts:
      - equal:
          path: crossResolved.prod.CONFIG.value
          value:
            host: "db.internal"
            port: 5432

  - it: "a list-shaped resolved value comes back as a list, with every string element's @ref@ markers substituted"
    set:
      target: prod
      tokens.DB_HOST: "db.internal"
      tokens.HOSTS.default:
        - "@DB_HOST@"
        - "static-host"
      crossTargets:
        - "prod"
      crossTargetNames:
        - "HOSTS"
    asserts:
      - equal:
          path: crossResolved.prod.HOSTS.value
          value:
            - "db.internal"
            - "static-host"

  - it: "a non-string scalar value (bool/int/float) resolves to its NATIVE type, not a stringified copy"
    set:
      target: prod
      tokens.ENABLED: true
      tokens.PORT: 5432
      crossTargets:
        - "prod"
      crossTargetNames:
        - "ENABLED"
        - "PORT"
    asserts:
      - equal:
          path: crossResolved.prod.ENABLED.value
          value: true
      - equal:
          path: crossResolved.prod.PORT.value
          value: 5432

  - it: "a structured value can still reference a token added later via crdkit.token.add — same lazy-resolution guarantee as a scalar"
    set:
      target: prod
      tokens.CONFIG.default:
        host: "@DERIVED_HOST@"
      tokenOps:
        - name: DERIVED_HOST
          value: "computed.internal"
      crossTargets:
        - "prod"
      crossTargetNames:
        - "CONFIG"
    asserts:
      - equal:
          path: crossResolved.prod.CONFIG.value
          value:
            host: "computed.internal"

  # --- crdkit.token.string / crdkit.tokenDef.string ---

  - it: "crdkit.token.string stringifies a non-string scalar for text embedding"
    set:
      target: prod
      tokens.ENABLED: true
      stringOps:
        - name: ENABLED
          target: "prod"
    asserts:
      - equal:
          path: stringResolved[0]
          value: "true"

  - it: "crdkit.token.string on a structural value records an ERROR and returns an empty string"
    set:
      target: prod
      tokens.CONFIG.default:
        host: "x"
      stringOps:
        - name: CONFIG
          target: "prod"
    asserts:
      - equal:
          path: stringResolved[0]
          value: ""
      - equal:
          path: diag.errors[0]
          value: "'CONFIG' resolves to a structured value and cannot be used as text"

  - it: "a @NAME@ marker referencing a token that resolves to a structure is left unexpanded, with an ERROR recorded"
    set:
      target: prod
      tokens.CONFIG.default:
        host: "x"
      structure.x: "prefix-@CONFIG@-suffix"
    asserts:
      - equal:
          path: structure.x
          value: "prefix-@CONFIG@-suffix"
      - equal:
          path: diag.errors[0]
          value: "'CONFIG' resolves to a structured value and cannot be used as text"

  # --- crdkit.tokenDef.value / crdkit.tokenDef.string: resolving an arbitrary structure, not registered in ctx.tokens ---

  - it: "crdkit.tokenDef.value resolves an ad-hoc structure using the same escalation rules as a real token, without registering it"
    set:
      target: prod
      tokens.DB_HOST: "db.internal"
      tokenDefOps:
        - fieldId: "myField"
          def:
            default: "generic-@DB_HOST@"
            prod: "special-@DB_HOST@"
    asserts:
      - equal:
          path: tokenDefResolved[0].value
          value: "special-db.internal"
      - equal:
          path: tokenDefResolved[0].string
          value: "special-db.internal"
      # never registered under its own name — it isn't a real token
      - exists:
          path: tokens.myField
        not: true

  - it: "crdkit.tokenDef.value falls back to the ad-hoc structure's own 'default' entry when the target doesn't match"
    set:
      target: qa
      tokenDefOps:
        - fieldId: "myField"
          def:
            default: "fallback-value"
            prod: "prod-only-value"
    asserts:
      - equal:
          path: tokenDefResolved[0].value
          value: "fallback-value"

  - it: "crdkit.tokenDef.value returns a structural result unchanged, same recursive substitution as a real token"
    set:
      target: prod
      tokens.DB_HOST: "db.internal"
      tokenDefOps:
        - fieldId: "myField"
          def:
            default:
              host: "@DB_HOST@"
              port: 5432
    asserts:
      - equal:
          path: tokenDefResolved[0].value
          value:
            host: "db.internal"
            port: 5432
      - equal:
          path: tokenDefResolved[0].string
          value: ""

  - it: "crdkit.tokenDef.value records a 'no value found' error using the caller-supplied fieldId, same diagnostic shape as a real token"
    set:
      target: unrecognized
      tokenDefOps:
        - fieldId: "myField"
          def:
            prod: "only-for-prod"
    asserts:
      - equal:
          path: diag.errors[0]
          value: "no value found for 'myField' — target chain exhausted at 'unrecognized' starting from 'unrecognized'"

  # --- annotations: generic metadata attached to declarations ---

  - it: an annotation is written literally alongside target entries, no "value" wrapper
    set:
      target: prod-01
      tokens:
        DB_HOST:
          default: "db.internal"
          exposure: "main"
      annotations:
        - "exposure"
    asserts:
      - equal:
          path: tokens.DB_HOST.default
          value: "db.internal"
      - equal:
          path: tokens.DB_HOST.exposure
          value: "main"

  - it: an annotation value is never validated — arbitrary values are allowed
    set:
      target: prod
      tokens:
        EXPOSED:
          default: "x"
          exposure: "bogus-value"
      annotations:
        - "exposure"
    asserts:
      - equal:
          path: tokens.EXPOSED.exposure
          value: "bogus-value"
      - lengthEqual:
          path: diag.errors
          count: 0
      - lengthEqual:
          path: diag.warnings
          count: 0

  - it: an annotation on a system (locked) token is preserved after merge
    set:
      target: prod
      system.LOCKED_VAR:
        default: "x"
        exposure: "lib-value"
      annotations:
        - "exposure"
    asserts:
      - equal:
          path: tokens.LOCKED_VAR.default
          value: "x"
      - equal:
          path: tokens.LOCKED_VAR.exposure
          value: "lib-value"

  - it: a token declaring ONLY an annotation, no target entries at all, produces the ordinary "no value found" error
    set:
      target: prod
      tokens:
        BROKEN:
          exposure: "main"
      annotations:
        - "exposure"
      crossTargets:
        - "prod"
      crossTargetNames:
        - "BROKEN"
    asserts:
      - equal:
          path: diag.errors[0]
          value: "no value found for 'BROKEN' — target chain exhausted at 'prod' starting from 'prod'"
      - equal:
          path: crossResolved.prod.BROKEN.value
          value: ""
      - equal:
          path: tokens.BROKEN.exposure
          value: "main"

  - it: an annotation token can still chain off another token's value normally
    set:
      target: prod
      tokens.HOST_NAME: "db1"
      tokens:
        DB_HOST:
          prod: "@HOST_NAME@.internal"
          exposure: "main"
      annotations:
        - "exposure"
      crossTargets:
        - "prod"
      crossTargetNames:
        - "DB_HOST"
    asserts:
      - equal:
          path: crossResolved.prod.DB_HOST.value
          value: "db1.internal"
      - equal:
          path: tokens.DB_HOST.exposure
          value: "main"

  # --- merge / naming-convention / collision diagnostics ---

  - it: a locked (system) token collision discards the user value and records a WARNING
    set:
      target: prod-01
      system.API_GROUP: "locked.example.com"
      tokens.API_GROUP: "hijacked.example.com"
      structure.group: "@API_GROUP@"
    asserts:
      - equal:
          path: structure.group
          value: "locked.example.com"
      - equal:
          path: diag.warnings[0]
          value: "token 'API_GROUP' is reserved by the library and was overridden back to the library value"

  - it: "a system (locked) token can declare a structural value — same recursive substitution as any token, and it still can't be overridden by the user"
    set:
      target: prod
      tokens.DB_HOST: "db.internal"
      system.CONFIG:
        default:
          host: "@DB_HOST@"
          locked: true
      tokens.CONFIG:
        default:
          host: "hijacked"
      crossTargets:
        - "prod"
      crossTargetNames:
        - "CONFIG"
    asserts:
      - equal:
          path: crossResolved.prod.CONFIG.value
          value:
            host: "db.internal"
            locked: true
      - equal:
          path: diag.warnings[0]
          value: "token 'CONFIG' is reserved by the library and was overridden back to the library value"

  - it: a default token can be overridden by the user with no diagnostic
    set:
      target: prod-01
      defaults.LOG_LEVEL: "info"
      tokens.LOG_LEVEL: "debug"
      structure.level: "@LOG_LEVEL@"
    asserts:
      - equal:
          path: structure.level
          value: "debug"
      - lengthEqual:
          path: diag.warnings
          count: 0
      - lengthEqual:
          path: diag.errors
          count: 0

  - it: "a default token's structural value can be overridden by the user's own structural value, with no diagnostic"
    set:
      target: prod
      defaults.CONFIG:
        default:
          host: "default-host"
      tokens.CONFIG:
        default:
          host: "user-host"
      crossTargets:
        - "prod"
      crossTargetNames:
        - "CONFIG"
    asserts:
      - equal:
          path: crossResolved.prod.CONFIG.value
          value:
            host: "user-host"
      - lengthEqual:
          path: diag.warnings
          count: 0
      - lengthEqual:
          path: diag.errors
          count: 0

  - it: "'AT' is crdkit's one reserved built-in name — user-supplied tokens.AT is discarded with a WARNING"
    set:
      target: prod-01
      tokens.AT: "hijacked"
    asserts:
      - equal:
          path: diag.warnings[0]
          value: "token 'AT' is a reserved built-in and cannot be redefined; the user-supplied value was ignored"

  - it: token names are not checked by crdkit (naming policy belongs to the library)
    set:
      target: prod-01
      tokens.myToken: "hello"
      tokens.1BAD: "x"
      tokens._BAD: "y"
      structure.message: "@myToken@"
    asserts:
      - equal:
          path: structure.message
          value: "hello"
      - equal:
          path: diag.warnings
          value: []

  - it: "GOTCHA: a differently-cased near-miss of a locked name is NOT blocked as a collision"
    set:
      target: prod-01
      system.API_GROUP: "locked.example.com"
      tokens.apiGroup: "not-actually-blocked"
      structure.group: "@apiGroup@"
    asserts:
      # the user's "apiGroup" (different casing, different dict key) is a
      # DISTINCT token from the locked "API_GROUP" — no collision is
      # detected because the keys don't match, so it resolves normally.
      # A library closes the gap with a name pattern in its values schema.
      - equal:
          path: structure.group
          value: "not-actually-blocked"
      - equal:
          path: diag.warnings
          value: []

  # --- crdkit.token.add ---

  - it: "crdkit.token.add against an existing scalar-normalized token ('default') MERGES a new dedicated attribute in, preserving 'default' as the fallback for every other target"
    set:
      target: prod-01
      tokens.EXISTING: "was-a-plain-scalar"
      tokenOps:
        - name: EXISTING
          value: "now-dedicated-for-prod-01"
    asserts:
      # "default" (what "was-a-plain-scalar" got normalized into) is an
      # ORDINARY target entry, not a reserved key — token.add preserves
      # it exactly like it would any other existing target entry, no
      # special-casing needed.
      - equal:
          path: tokens.EXISTING
          value:
            default: "was-a-plain-scalar"
            prod-01: "now-dedicated-for-prod-01"

  - it: "crdkit.token.add stores 'value' as a DEDICATED ATTRIBUTE (a literal key equal to the exact target) — not resolved at add-time"
    set:
      target: prod-01
      tokens.GREETING: "hello"
      tokenOps:
        - name: DERIVED_VAR
          value: "prefix-@GREETING@"
    asserts:
      # raw declaration right after token.add runs — no structure/crossTargets
      # reference anywhere in this test, so this is purely what token.add
      # itself wrote, still carrying the unresolved "@GREETING@" marker.
      - equal:
          path: tokens.DERIVED_VAR
          value:
            prod-01: "prefix-@GREETING@"

  - it: a token.add-added token resolves lazily via its dedicated attribute, exactly like any hand-declared token, once actually referenced
    set:
      target: prod-01
      tokens.GREETING: "hello"
      tokenOps:
        - name: DERIVED_VAR
          value: "prefix-@GREETING@"
      structure.x: "@DERIVED_VAR@"
    asserts:
      - equal:
          path: structure.x
          value: "prefix-hello"

  - it: a token.add-added token has no fallback for a target it was never given a value for, and no parentTargetMap configured
    set:
      target: prod-01
      tokenOps:
        - name: DERIVED_VAR
          value: "prefix-value"
      crossTargets:
        - "qa"
      crossTargetNames:
        - "DERIVED_VAR"
    asserts:
      - equal:
          path: diag.errors[0]
          value: "no value found for 'DERIVED_VAR' — target chain exhausted at 'qa' starting from 'qa'"

  - it: "a second crdkit.token.add call for the SAME name but a DIFFERENT target adds another dedicated attribute, preserving the first"
    set:
      target: prod-01
      tokenOps:
        - name: DERIVED_VAR
          value: "prod-value"
          target: "prod-01"
        - name: DERIVED_VAR
          value: "qa-value"
          target: "qa"
    asserts:
      - equal:
          path: tokens.DERIVED_VAR
          value:
            prod-01: "prod-value"
            qa: "qa-value"

  - it: "a second crdkit.token.add call for the SAME (name, target) pair overwrites in place"
    set:
      target: prod-01
      tokenOps:
        - name: DERIVED_VAR
          value: "first-value"
          target: "prod-01"
        - name: DERIVED_VAR
          value: "second-value"
          target: "prod-01"
    asserts:
      - equal:
          path: tokens.DERIVED_VAR
          value:
            prod-01: "second-value"

  - it: "a second crdkit.token.add call with annotations overwrites existing annotation keys and adds new ones"
    set:
      target: prod-01
      tokenOps:
        - name: DERIVED_VAR
          value: "prod-value"
          annotations:
            exposure: "main"
          target: "prod-01"
        - name: DERIVED_VAR
          value: "qa-value"
          annotations:
            owner: "team-b"
          target: "qa"
        - name: DERIVED_VAR
          value: "prod-value-2"
          annotations:
            exposure: "side-car"
          target: "prod-01"
    asserts:
      - equal:
          path: tokens.DERIVED_VAR
          value:
            prod-01: "prod-value-2"
            exposure: "side-car"
            qa: "qa-value"
            owner: "team-b"

  - it: "crdkit.token.add's value chain-resolves against the FINAL state of ctx.tokens — a value referencing a token added by a LATER token.add call still resolves"
    set:
      target: prod-01
      tokenOps:
        - name: FIRST_VAR
          value: "uses-@SECOND_VAR@"
        - name: SECOND_VAR
          value: "computed-later"
      structure.x: "@FIRST_VAR@"
    asserts:
      # this is the whole reason token.add defers resolution instead of
      # resolving eagerly at its own call site — FIRST_VAR references a
      # token that's only added by a SECOND, later token.add call. Both
      # calls insert raw declarations before anything is resolved, so by
      # the time "structure.x" actually triggers resolution, both exist.
      - equal:
          path: structure.x
          value: "uses-computed-later"

  - it: "crdkit.token.add can silently overwrite an existing token, including a locked one — no protection, by design"
    set:
      target: prod-01
      system.API_GROUP: "locked.example.com"
      tokenOps:
        - name: API_GROUP
          value: "overwritten-by-integration"
    asserts:
      # token.add deliberately skips the reserved-name collision check
      # (see crdkit's CLAUDE.md: integrations are trusted, unlike
      # consumer input) — crdkit.render's OWN post-chain reassertion is
      # what actually protects "system" tokens end-to-end in the real
      # pipeline; this harness calls token.add directly, without that
      # reassertion step, so the overwrite is visible here. API_GROUP's
      # existing bare-scalar declaration was already normalized into
      # {default: "locked.example.com"} by crdkit.tokens.merge.internal
      # before token.add ever runs — "default" is an ORDINARY target
      # entry (not reserved), so token.add merges the new dedicated
      # attribute in alongside it rather than replacing it outright; a
      # target OTHER than "prod-01" would still fall back to the
      # "overwritten" library's original value via "default".
      - equal:
          path: tokens.API_GROUP
          value:
            default: "locked.example.com"
            prod-01: "overwritten-by-integration"

  - it: "crdkit.token.add warns on a non-conforming name and errors if annotations is not a dict"
    set:
      target: prod-01
      tokenOps:
        - name: derivedVar
          value: "computed"
          annotations: "main"
    asserts:
      # token.add validates that annotations (if provided) is a dict;
      # a string is rejected with an ERROR, but the value is still stored.
      - equal:
          path: tokens.derivedVar.prod-01
          value: "computed"
      - matchRegex:
          path: diag.errors[0]
          pattern: "annotations must be a dict"
      - lengthEqual:
          path: diag.errors
          count: 1

  # --- C3: system declaration replaces consumer declaration ---

  - it: "system token replaces consumer token wholesale; collision warning still fires"
    set:
      target: prod
      system:
        X:
          default: "locked"
      tokens:
        X:
          prod: "hijack"
      structure.v: "@X@"
    asserts:
      - equal:
          path: structure.v
          value: "locked"
      - matchRegex:
          path: diag.warnings[0]
          pattern: "token 'X' is reserved by the library"

  - it: "system token declaration replaces consumer completely, not a deep merge"
    set:
      target: prod
      system:
        X:
          default: "locked"
          PROD: "p"
      tokens:
        X:
          default: "u"
    asserts:
      - equal:
          path: tokens.X
          value:
            default: "locked"
            PROD: "p"

  - it: "defaults deep-merge with user tokens; both keys preserved"
    set:
      target: prod
      defaults:
        Y:
          default: "d"
      tokens:
        Y:
          prod: "u"
    asserts:
      - equal:
          path: tokens.Y
          value:
            default: "d"
            prod: "u"

  # --- C5: annotations on defaults and generic behavior ---

  - it: "token with only default value renders correctly via fallback"
    set:
      target: prod-01
      parentTargetMap:
        prod-01: "PROD"
        PROD: default
      tokens:
        DEFAULT:
          default: "default value"
      structure:
        value_of_default: "@DEFAULT@"
    asserts:
      - equal:
          path: structure.value_of_default
          value: "default value"

  - it: "annotation on a defaults token is preserved after merge"
    set:
      target: prod
      annotations:
        - "exposure"
      defaults:
        Y:
          default: "d"
          exposure: "x"
    asserts:
      - equal:
          path: tokens.Y.exposure
          value: "x"

  - it: "tokenOps 'resolve' records the value resolved at that point in the op sequence"
    set:
      target: prod-01
      tokens:
        GREETING: "hello"
      tokenOps:
        - op: resolve
          name: GREETING
    asserts:
      - equal:
          path: opsResolved[0].name
          value: "GREETING"
      - equal:
          path: opsResolved[0].target
          value: "prod-01"
      - equal:
          path: opsResolved[0].value
          value: "hello"

  # --- reserved keys: annotation names are never target entries ---

  - it: "a target equal to an annotation name does not hit the annotation key — default resolves"
    set:
      target: owner
      annotations:
        - "owner"
      tokens:
        X:
          default: "d"
          owner: "o"
      structure:
        v: "@X@"
    asserts:
      - equal:
          path: structure.v
          value: "d"
      - lengthEqual:
          path: diag.errors
          count: 0

  - it: "without the annotation declared, the same target hits the 'owner' entry"
    set:
      target: owner
      tokens:
        X:
          default: "d"
          owner: "o"
      structure:
        v: "@X@"
    asserts:
      - equal:
          path: structure.v
          value: "o"

  - it: "reserved annotation names are honored on a chained @ref@ resolution (reservedKeys threaded to nested lookups)"
    set:
      target: owner
      annotations:
        - "owner"
      tokens:
        A: "pre-@X@"
        X:
          default: "d"
          owner: "o"
      structure:
        v: "@A@"
    asserts:
      - equal:
          path: structure.v
          value: "pre-d"

  - it: "reserved annotation names are honored in crdkit.token.value for a cross target and in tokenDef"
    set:
      target: prod
      annotations:
        - "owner"
      tokens:
        X:
          default: "d"
          owner: "o"
      crossTargets:
        - "owner"
      crossTargetNames:
        - "X"
      tokenDefOps:
        - fieldId: "myDef"
          target: "owner"
          def:
            default: "dd"
            owner: "oo"
    asserts:
      - equal:
          path: crossResolved.owner.X.value
          value: "d"
      - equal:
          path: tokenDefResolved[0].value
          value: "dd"

  - it: "an annotation named 'match' is rejected with an ERROR and 'match' rules keep working"
    set:
      target: prod-07
      annotations:
        - "match"
      tokens:
        X:
          default: "d"
          match:
            - "prod-.*": "matched"
      structure:
        v: "@X@"
    asserts:
      - equal:
          path: structure.v
          value: "matched"
      - contains:
          path: diag.errors
          content: "annotation name 'match' collides with a crdkit-reserved key and was ignored"

  - it: "an annotation named 'default' is rejected with an ERROR and 'default' keeps working as a fallback"
    set:
      target: anything
      annotations:
        - "default"
      tokens:
        X:
          default: "d"
      structure:
        v: "@X@"
    asserts:
      - equal:
          path: structure.v
          value: "d"
      - contains:
          path: diag.errors
          content: "annotation name 'default' collides with a crdkit-reserved key and was ignored"

  # --- cache generations: a token mutation invalidates stale caches ---

  - it: "a dependent token is re-resolved after crdkit.token.add changes the token it references"
    set:
      target: prod-01
      tokens:
        A: "pre-@B@"
        B: "old"
      tokenOps:
        - op: resolve
          name: A
        - op: add
          name: B
          value: "new"
        - op: resolve
          name: A
    asserts:
      - equal:
          path: opsResolved[0].value
          value: "pre-old"
      - equal:
          path: opsResolved[1].value
          value: "pre-new"
      - equal:
          path: tokens.A._value.prod-01
          value: "pre-new"
      - equal:
          path: tokens.A._gen
          value: 1

  - it: "without a mutation, a second resolve is served from the cache (no repeated diagnostics)"
    set:
      target: qa
      tokens:
        X:
          prod: "p"
      tokenOps:
        - op: resolve
          name: X
        - op: resolve
          name: X
    asserts:
      - exists:
          path: tokens.X._value.qa
      - equal:
          path: tokens.X._gen
          value: 0
      - lengthEqual:
          path: diag.errors
          count: 1

  - it: "a cache hit requires the exact target key — a cache holding only other targets does not short-circuit"
    set:
      target: prod-01
      tokens:
        X:
          prod-01: "one"
          prod-02: "two"
      tokenOps:
        - op: resolve
          name: X
          target: prod-01
        - op: resolve
          name: X
          target: prod-02
    asserts:
      - equal:
          path: opsResolved[0].value
          value: "one"
      - equal:
          path: opsResolved[1].value
          value: "two"
      - exists:
          path: tokens.X._value.prod-02

  - it: "an error-producing resolution is recomputed (and re-diagnosed) after a generation bump"
    set:
      target: qa
      tokens:
        X:
          prod: "p"
      tokenOps:
        - op: resolve
          name: X
        - op: add
          name: Y
          value: "unrelated"
        - op: resolve
          name: X
    asserts:
      - lengthEqual:
          path: diag.errors
          count: 2

  - it: "a tokenDef structure is re-resolved after crdkit.token.add changes a token it references"
    set:
      target: prod-01
      tokens:
        B: "old"
      tokenDefs:
        D:
          default: "d-@B@"
      tokenOps:
        - op: resolveDef
          defName: D
        - op: add
          name: B
          value: "new"
        - op: resolveDef
          defName: D
    asserts:
      - equal:
          path: opsResolved[0].value
          value: "d-old"
      - equal:
          path: opsResolved[1].value
          value: "d-new"
      - equal:
          path: tokenDefs.D._gen
          value: 1
      - equal:
          path: tokenDefs.D._value.prod-01
          value: "d-new"

  # --- crdkit-internal keys in declarations are stripped at merge ---

  - it: "a user declaration with '_generated' loses the key, warns, and still resolves"
    set:
      target: prod-01
      tokens:
        X:
          default: "d"
          _generated:
            prod-01: "injected"
      structure:
        v: "@X@"
    asserts:
      - notExists:
          path: tokens.X._generated
      - contains:
          path: diag.warnings
          content: "token 'X' declares crdkit-internal key '_generated'; it was removed"
      - equal:
          path: structure.v
          value: "d"

  - it: "a defaults declaration with '_value' loses the key, warns, and the poisoned cache is never served"
    set:
      target: prod-01
      defaults:
        X:
          default: "d"
          _value:
            prod-01: "poisoned"
      structure:
        v: "@X@"
    asserts:
      - contains:
          path: diag.warnings
          content: "token 'X' declares crdkit-internal key '_value'; it was removed"
      - equal:
          path: structure.v
          value: "d"

  - it: "a system declaration with '_gen' loses the key, warns, and still resolves"
    set:
      target: prod-01
      system:
        X:
          default: "locked"
          _gen: 99
      structure:
        v: "@X@"
    asserts:
      - contains:
          path: diag.warnings
          content: "token 'X' declares crdkit-internal key '_gen'; it was removed"
      - equal:
          path: structure.v
          value: "locked"
      - equal:
          path: tokens.X._gen
          value: 0

  - it: "every internal key present is reported separately, and the declaration keeps its other keys"
    set:
      target: prod-01
      tokens:
        X:
          default: "d"
          _value: {}
          _gen: 5
          _generated: {}
          exposure: "e"
      annotations:
        - "exposure"
    asserts:
      - lengthEqual:
          path: diag.warnings
          count: 3
      - equal:
          path: tokens.X
          value:
            default: "d"
            exposure: "e"

  # --- crdkit.token.underlay: generated values, lowest priority ---

  - it: "underlay on a missing token creates it with '_generated' for the target plus the annotations, and it resolves"
    set:
      target: prod-01
      annotations:
        - "owner"
      tokenOps:
        - op: underlay
          name: X
          value: "v"
          annotations:
            owner: "svc"
      structure:
        v: "@X@"
    asserts:
      - equal:
          path: tokens.X._generated
          value:
            prod-01: "v"
      - equal:
          path: tokens.X.owner
          value: "svc"
      - equal:
          path: structure.v
          value: "v"
      - lengthEqual:
          path: diag.errors
          count: 0

  - it: "a consumer 'default' wins over a generated value"
    set:
      target: prod-01
      tokens:
        X:
          default: "d"
      tokenOps:
        - op: underlay
          name: X
          value: "g"
      structure:
        v: "@X@"
    asserts:
      - equal:
          path: structure.v
          value: "d"

  - it: "a consumer entry reached through the parent walk wins over a generated value"
    set:
      target: prod-01
      parentTargetMap:
        prod-01: "prod"
      tokens:
        X:
          prod: "p"
      tokenOps:
        - op: underlay
          name: X
          value: "g"
      structure:
        v: "@X@"
    asserts:
      - equal:
          path: structure.v
          value: "p"

  - it: "a generated value is used when the consumer declaration has no entry reachable from the target"
    set:
      target: dev-01
      tokens:
        X:
          prod: "p"
      tokenOps:
        - op: underlay
          name: X
          value: "g"
      structure:
        v: "@X@"
    asserts:
      - equal:
          path: structure.v
          value: "g"
      - lengthEqual:
          path: diag.errors
          count: 0

  - it: "a generated value for one target is not visible to another target"
    set:
      target: prod-01
      tokenOps:
        - op: underlay
          name: X
          value: "g"
          target: prod-01
        - op: resolve
          name: X
          target: qa
    asserts:
      - lengthEqual:
          path: diag.errors
          count: 1
      - matchRegex:
          path: diag.errors[0]
          pattern: "no value found for 'X'"

  - it: "a value resolved from '_generated' is cached under the exact target only, never under walked rungs"
    set:
      target: prod-01
      parentTargetMap:
        prod-01: "prod"
        prod: "PROD"
      tokenOps:
        - op: underlay
          name: X
          value: "g"
        - op: resolve
          name: X
    asserts:
      - equal:
          path: opsResolved[0].value
          value: "g"
      - exists:
          path: tokens.X._value.prod-01
      - notExists:
          path: tokens.X._value.prod
      - notExists:
          path: tokens.X._value.PROD

  - it: "a generated value does not leak through a shared rung to a sibling target"
    set:
      target: prod-01
      parentTargetMap:
        prod-01: "prod"
        prod-02: "prod"
      tokenOps:
        - op: underlay
          name: X
          value: "g"
          target: prod-01
        - op: resolve
          name: X
          target: prod-01
        - op: resolve
          name: X
          target: prod-02
    asserts:
      - equal:
          path: opsResolved[0].value
          value: "g"
      - lengthEqual:
          path: diag.errors
          count: 1

  - it: "underlay annotations never overwrite existing ones and fill missing ones"
    set:
      target: prod-01
      annotations:
        - "owner"
        - "exposure"
      tokens:
        X:
          default: "d"
          owner: "consumer"
      tokenOps:
        - op: underlay
          name: X
          value: "g"
          annotations:
            owner: "generated"
            exposure: "main"
    asserts:
      - equal:
          path: tokens.X.owner
          value: "consumer"
      - equal:
          path: tokens.X.exposure
          value: "main"

  - it: "a second underlay for the same target overwrites the first generated value"
    set:
      target: prod-01
      tokenOps:
        - op: underlay
          name: X
          value: "first"
        - op: underlay
          name: X
          value: "second"
      structure:
        v: "@X@"
    asserts:
      - equal:
          path: structure.v
          value: "second"
      - equal:
          path: tokens.X._generated
          value:
            prod-01: "second"

  - it: "underlays for different targets accumulate"
    set:
      target: prod-01
      tokenOps:
        - op: underlay
          name: X
          value: "a"
        - op: underlay
          name: X
          value: "b"
          target: prod-02
    asserts:
      - equal:
          path: tokens.X._generated
          value:
            prod-01: "a"
            prod-02: "b"

  - it: "underlay bumps the generation — a dependent token resolved earlier is re-resolved"
    set:
      target: prod-01
      tokens:
        A: "pre-@B@"
        B:
          dev-01: "x"
      tokenOps:
        - op: resolve
          name: A
        - op: underlay
          name: B
          value: "g"
        - op: resolve
          name: A
    asserts:
      - equal:
          path: opsResolved[1].value
          value: "pre-g"
      - equal:
          path: tokens.A._gen
          value: 1
      - lengthEqual:
          path: diag.errors
          count: 1

  - it: "underlay accepts any token name without a diagnostic"
    set:
      target: prod-01
      tokenOps:
        - op: underlay
          name: lowerName
          value: "v"
    asserts:
      - equal:
          path: diag.warnings
          value: []

  - it: "underlay with non-dict annotations records an ERROR and still stores the generated value"
    set:
      target: prod-01
      tokenOps:
        - op: underlay
          name: X
          value: "v"
          annotations: "main"
    asserts:
      - contains:
          path: diag.errors
          content: "crdkit.token.underlay for 'X': annotations must be a dict — ignored"
      - equal:
          path: tokens.X._generated
          value:
            prod-01: "v"

  - it: "crdkit.token.add on a token with generated values keeps '_generated'; an added entry beats it"
    set:
      target: prod-01
      tokenOps:
        - op: underlay
          name: X
          value: "g"
        - op: add
          name: X
          value: "added"
          target: prod-02
        - op: resolve
          name: X
          target: prod-01
        - op: resolve
          name: X
          target: prod-02
    asserts:
      - equal:
          path: tokens.X._generated
          value:
            prod-01: "g"
      - equal:
          path: opsResolved[0].value
          value: "g"
      - equal:
          path: opsResolved[1].value
          value: "added"

  - it: "a generated value may itself reference other tokens"
    set:
      target: prod-01
      tokens:
        B: "bee"
      tokenOps:
        - op: underlay
          name: X
          value: "x-@B@"
      structure:
        v: "@X@"
    asserts:
      - equal:
          path: structure.v
          value: "x-bee"
