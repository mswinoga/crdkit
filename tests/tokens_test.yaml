suite: crdkit token interpolation
templates:
  - test.yaml
tests:
  - it: resolves a simple scalar token
    set:
      target: prod-01
      tokens.GREETING: "hello"
      structure.message: "@GREETING@"
    asserts:
      - equal:
          path: structure.message
          value: "hello"

  - it: dict resolves the exact env value when present
    set:
      target: prod-01
      tokens.COLOR.default: "blue"
      tokens.COLOR.prod: "red"
      structure.color: "@COLOR@"
    asserts:
      - equal:
          path: structure.color
          value: "red"

  - it: dict falls back to the family tier when the exact env is unlisted
    set:
      target: qap1-01
      tokens.REGION.QA: "region-qa"
      tokens.REGION.default: "region-default"
      structure.region: "@REGION@"
    asserts:
      - equal:
          path: structure.region
          value: "region-qa"

  - it: dict falls back to the super-tier when neither exact env nor family tier is listed
    set:
      target: qap1-01
      tokens.REGION.NONPROD: "region-nonprod"
      tokens.REGION.default: "region-default"
      structure.region: "@REGION@"
    asserts:
      - equal:
          path: structure.region
          value: "region-nonprod"

  - it: dict falls back to default when nothing more specific matches
    set:
      target: staging-01
      tokens.REGION.default: "region-default"
      structure.region: "@REGION@"
    asserts:
      - equal:
          path: structure.region
          value: "region-default"

  - it: dict with no matching env and no default records an ERROR, not a fail
    set:
      target: prod-01
      tokens.BROKEN.dev: "only-dev"
      # a declared-but-unused token is never resolved/diagnosed under the
      # lazy model — referencing it via "structure" is what makes it "used".
      structure.x: "@BROKEN@"
    asserts:
      - equal:
          path: diag.errors[0]
          value: "no value for env 'prod' and no 'default' defined for 'BROKEN'"

  - it: match tier wins over env/tier/default, evaluated against the full target string
    set:
      target: qam1-05
      # dotted set: paths can't reliably express array indices (modelOps[0]-
      # style) or keys containing regex metacharacters, so "tokens" and
      # "structure" are set as whole nested YAML values here instead of
      # dotted sub-paths — see crdkit's CLAUDE.md testing notes.
      tokens:
        SUBENV:
          default: "generic"
          NONPROD: "nonprod-generic"
          match:
            - "qa[pm]1-0[0-9]": "canary"
      structure:
        subenv: "@SUBENV@"
    asserts:
      - equal:
          path: structure.subenv
          value: "canary"

  - it: match rule values can reference capture groups from the pattern
    set:
      target: qam1-05
      tokens:
        PREFIX:
          match:
            - "(.+)-[0-9]{2}": "$1"
      structure:
        prefix: "@PREFIX@"
    asserts:
      - equal:
          path: structure.prefix
          value: "qam1"

  - it: a token referencing a chain of 3+ tokens resolves via the iterative fixed-point resolver
    set:
      target: prod-01
      tokens.T1: "one"
      tokens.T2: "@T1@-two"
      tokens.T3: "@T2@-three"
      structure.message: "@T3@"
    asserts:
      - equal:
          path: structure.message
          value: "one-two-three"

  - it: a direct two-token cycle records an ERROR mentioning a cycle, and does not hang
    set:
      target: prod-01
      tokens.A: "@B@"
      tokens.B: "@A@"
      # again, needs a use site to trigger lazy resolution in the first place
      structure.x: "@A@"
    asserts:
      - matchRegex:
          path: diag.errors[0]
          pattern: "cycle"

  - it: "@AT@ resolves to a literal @ character, applied only on the final substitution pass"
    set:
      target: prod-01
      structure.email: "user@AT@example.com"
    asserts:
      - equal:
          path: structure.email
          value: "user@example.com"

  - it: a locked (system) token collision discards the user value and records a WARNING
    set:
      target: prod-01
      system.API_GROUP: "locked.example.com"
      tokens.API_GROUP: "hijacked.example.com"
      structure.group: "@API_GROUP@"
    asserts:
      - equal:
          path: structure.group
          value: "locked.example.com"
      - equal:
          path: diag.warnings[0]
          value: "token 'API_GROUP' is reserved by the library and was overridden back to the library value"

  - it: a default token can be overridden by the user with no diagnostic
    set:
      target: prod-01
      defaults.LOG_LEVEL: "info"
      tokens.LOG_LEVEL: "debug"
      structure.level: "@LOG_LEVEL@"
    asserts:
      - equal:
          path: structure.level
          value: "debug"
      - lengthEqual:
          path: diag.warnings
          count: 0
      - lengthEqual:
          path: diag.errors
          count: 0

  - it: "'ENV' is a reserved built-in token — user-supplied tokens.ENV is discarded with a WARNING"
    set:
      target: prod-01
      tokens.ENV: "hijacked"
      structure.env: "@ENV@"
    asserts:
      - equal:
          path: structure.env
          value: "prod"
      - equal:
          path: diag.warnings[0]
          value: "token 'ENV' is a reserved built-in and cannot be redefined; the user-supplied value was ignored"

  - it: "'AT' is a reserved built-in token name — user-supplied tokens.AT is discarded with a WARNING"
    set:
      target: prod-01
      tokens.AT: "hijacked"
    asserts:
      - equal:
          path: diag.warnings[0]
          value: "token 'AT' is a reserved built-in and cannot be redefined; the user-supplied value was ignored"

  - it: missing target records an ERROR and env resolves to empty rather than failing
    set:
      target: ""
    asserts:
      - equal:
          path: env
          value: ""
      - equal:
          path: diag.errors[0]
          value: "'target' is required (e.g. 'prod', or 'prod-01' for a sequenced target) but was not set"

  - it: "a plain target with no sequence suffix IS the env directly, no diagnostic (the common case for most CRDs)"
    set:
      target: "staging"
    asserts:
      - equal:
          path: env
          value: "staging"
      - lengthEqual:
          path: diag.errors
          count: 0

  - it: "a target that merely LOOKS unusual but doesn't match <env>-<seq> is still accepted as a literal env, not an error"
    set:
      target: "not-a-valid-target"
    asserts:
      - equal:
          path: env
          value: "not-a-valid-target"
      - lengthEqual:
          path: diag.errors
          count: 0

  - it: a target WITH the sequence suffix still extracts just the env portion
    set:
      target: "prod-01"
    asserts:
      - equal:
          path: env
          value: "prod"
      - lengthEqual:
          path: diag.errors
          count: 0

  - it: a lowercase (or otherwise non-UPPER_SNAKE_CASE) token name records a WARNING but still resolves
    set:
      target: prod-01
      tokens.myToken: "hello"
      structure.message: "@myToken@"
    asserts:
      - equal:
          path: structure.message
          value: "hello"
      - equal:
          path: diag.warnings[0]
          value: "token name 'myToken' should be UPPER_SNAKE_CASE for readability"

  - it: a token with no targetContainer declared resolves with targetContainer "none"
    set:
      target: prod
      tokens.GREETING: "hello"
      # a bare-scalar declaration has no targetContainer key to auto-trigger
      # resolveTargetContainerTokens, and isn't referenced via "structure"
      # either — crossTargets forces a direct crdkit.resolveValue call so
      # the resolved {value, targetContainer} struct is observable at all.
      crossTargets:
        - "prod"
      crossTargetNames:
        - "GREETING"
    asserts:
      - equal:
          path: crossResolved.prod.GREETING.value
          value: "hello"
      - equal:
          path: crossResolved.prod.GREETING.targetContainer
          value: "none"

  - it: a token can declare an explicit valid targetContainer
    set:
      target: prod-01
      tokens.DB_HOST.value: "db.internal"
      tokens.DB_HOST.targetContainer: "main"
    asserts:
      - equal:
          path: tokens.DB_HOST.value
          value: "db.internal"
      - equal:
          path: tokens.DB_HOST.targetContainer
          value: "main"

  - it: a token can target the side-car or both containers
    set:
      target: prod-01
      tokens.SIDECAR_VAR.value: "x"
      tokens.SIDECAR_VAR.targetContainer: "side-car"
      tokens.SHARED_VAR.value: "y"
      tokens.SHARED_VAR.targetContainer: "both"
    asserts:
      - equal:
          path: tokens.SIDECAR_VAR.targetContainer
          value: "side-car"
      - equal:
          path: tokens.SHARED_VAR.targetContainer
          value: "both"

  - it: an invalid targetContainer records an ERROR and falls back to "none", value still resolves
    set:
      target: prod
      tokens.BAD_VAR.value: "still-here"
      # an unrecognized targetContainer is NOT one of main/side-car/both, so
      # resolveTargetContainerTokens' filter doesn't auto-trigger it either
      # — crossTargets is needed here too.
      tokens.BAD_VAR.targetContainer: "sidecar-typo"
      crossTargets:
        - "prod"
      crossTargetNames:
        - "BAD_VAR"
    asserts:
      - equal:
          path: crossResolved.prod.BAD_VAR.value
          value: "still-here"
      - equal:
          path: crossResolved.prod.BAD_VAR.targetContainer
          value: "none"
      - equal:
          path: diag.errors[0]
          value: "invalid targetContainer 'sidecar-typo' for 'BAD_VAR' — must be one of main/side-car/both (or omitted)"

  - it: crdkit.addToken lets an integration contribute a derived token with a targetContainer
    set:
      target: prod-01
      tokenOps:
        - name: DERIVED_VAR
          value: "computed"
          targetContainer: "main"
    asserts:
      # "value" is stored as a match: rule keyed by the exact target, not
      # a bare scalar — see crdkit's CLAUDE.md on why (lazy resolution,
      # not eager, so a value referencing a token added later in the
      # chain still resolves correctly).
      - equal:
          path: tokens.DERIVED_VAR.value
          value:
            match:
              - prod-01: "computed"
      - equal:
          path: tokens.DERIVED_VAR.targetContainer
          value: "main"

  - it: crdkit.addToken defaults targetContainer to "none" when omitted
    set:
      target: prod-01
      tokenOps:
        - name: DERIVED_VAR
          value: "computed"
    asserts:
      - equal:
          path: tokens.DERIVED_VAR.targetContainer
          value: "none"

  - it: crdkit.addToken warns on a non-conforming name and validates targetContainer the same as any other token
    set:
      target: prod-01
      tokenOps:
        - name: derivedVar
          value: "computed"
          targetContainer: "bogus"
    asserts:
      - equal:
          path: tokens.derivedVar.targetContainer
          value: "none"
      - matchRegex:
          path: diag.warnings[0]
          pattern: "UPPER_SNAKE_CASE"
      - matchRegex:
          path: diag.errors[0]
          pattern: "invalid targetContainer 'bogus'"

  # --- edge cases ---

  - it: "value can itself be the full env-varying dict, combined with targetContainer"
    set:
      target: prod
      tokens:
        DB_HOST:
          value:
            default: "db-nonprod.internal"
            prod: "db-prod.internal"
          targetContainer: "main"
      # targetContainer: "main" IS valid, so this token auto-resolves via
      # resolveTargetContainerTokens — but the RESOLVED scalar only lands
      # in the "_value" cache, never overwriting the raw "value" dict at
      # tokens.DB_HOST.value, so crossResolved is still needed to observe it.
      crossTargets:
        - "prod"
      crossTargetNames:
        - "DB_HOST"
    asserts:
      - equal:
          path: crossResolved.prod.DB_HOST.value
          value: "db-prod.internal"
      - equal:
          path: crossResolved.prod.DB_HOST.targetContainer
          value: "main"

  - it: "value alongside other (now-ignored) keys still resolves to 'value', with a WARNING naming what was ignored"
    set:
      target: prod-01
      tokens:
        WEIRD:
          value: "explicit"
          default: "ignored-default"
          prod: "ignored-prod"
      # no targetContainer here, so a "structure" reference is what triggers
      # resolution (and thus the extra-keys warning check) under the lazy model.
      structure:
        weird: "@WEIRD@"
    asserts:
      - equal:
          path: structure.weird
          value: "explicit"
      - matchRegex:
          path: diag.warnings[0]
          pattern: "declares 'value' alongside other keys"

  - it: "targetContainer declared WITHOUT 'value' records a clear ERROR, not the unrelated 'no value for env' one"
    set:
      target: prod
      tokens:
        BROKEN:
          targetContainer: "main"
      # targetContainer: "main" is a valid enum value, so this auto-triggers
      # via resolveTargetContainerTokens; crossTargets reads back the result.
      crossTargets:
        - "prod"
      crossTargetNames:
        - "BROKEN"
    asserts:
      - equal:
          path: diag.errors[0]
          value: "'BROKEN' declares targetContainer without a 'value' key — wrap the actual value as {value: ..., targetContainer: ...}"
      - equal:
          path: crossResolved.prod.BROKEN.value
          value: ""
      - equal:
          path: crossResolved.prod.BROKEN.targetContainer
          value: "main"

  - it: an empty-string targetContainer is invalid, same as any other unrecognized value
    set:
      target: prod
      tokens.EMPTY_VAR.value: "x"
      # an empty string is falsy under Sprig's `default`, so
      # resolveTargetContainerTokens' `| default "none"` filter treats it
      # the same as an absent targetContainer — never auto-triggered either.
      tokens.EMPTY_VAR.targetContainer: ""
      crossTargets:
        - "prod"
      crossTargetNames:
        - "EMPTY_VAR"
    asserts:
      - equal:
          path: crossResolved.prod.EMPTY_VAR.targetContainer
          value: "none"
      - matchRegex:
          path: diag.errors[0]
          pattern: "invalid targetContainer ''"

  - it: a token name starting with a digit is non-conforming, same WARNING as any other bad casing
    set:
      target: prod-01
      tokens.1BAD: "x"
    asserts:
      - equal:
          path: diag.warnings[0]
          value: "token name '1BAD' should be UPPER_SNAKE_CASE for readability"

  - it: a token name starting with an underscore is non-conforming too
    set:
      target: prod-01
      tokens._BAD: "x"
    asserts:
      - equal:
          path: diag.warnings[0]
          value: "token name '_BAD' should be UPPER_SNAKE_CASE for readability"

  - it: "GOTCHA: a differently-cased near-miss of a locked name is NOT blocked as a collision, only flagged for casing"
    set:
      target: prod-01
      system.API_GROUP: "locked.example.com"
      tokens.apiGroup: "not-actually-blocked"
      structure.group: "@apiGroup@"
    asserts:
      # the user's "apiGroup" (different casing, different dict key) is a
      # DISTINCT token from the locked "API_GROUP" — no collision is
      # detected because the keys don't match, so it resolves normally.
      # This documents a real, narrow gap in the reserved-name protection:
      # it's case-sensitive, and the naming-convention check is only ever
      # a WARNING, so this isn't actually prevented, just flagged.
      - equal:
          path: structure.group
          value: "not-actually-blocked"
      - matchRegex:
          path: diag.warnings[0]
          pattern: "'apiGroup' should be UPPER_SNAKE_CASE"

  - it: a token with targetContainer can still chain off another token's value normally
    set:
      target: prod
      tokens.HOST_NAME: "db1"
      tokens.DB_HOST.value: "@HOST_NAME@.internal"
      # targetContainer: "main" auto-triggers resolution, but the raw
      # declaration still holds the unresolved "@HOST_NAME@.internal" marker
      # — crossResolved is needed to see the chained-and-substituted result.
      tokens.DB_HOST.targetContainer: "main"
      crossTargets:
        - "prod"
      crossTargetNames:
        - "DB_HOST"
    asserts:
      - equal:
          path: crossResolved.prod.DB_HOST.value
          value: "db1.internal"
      - equal:
          path: crossResolved.prod.DB_HOST.targetContainer
          value: "main"

  - it: "match: first matching rule wins even when a later rule would also match"
    set:
      target: prod-01
      tokens:
        MULTI:
          match:
            - "prod-01": "first-match"
            - "prod-[0-9]{2}": "second-match-would-also-fit"
      structure.multi: "@MULTI@"
    asserts:
      - equal:
          path: structure.multi
          value: "first-match"

  - it: the PROD family tier is used when the exact "prod" env key is absent but "PROD" is present
    set:
      target: prod-01
      tokens.REGION.PROD: "us-east-1"
      structure.region: "@REGION@"
    asserts:
      - equal:
          path: structure.region
          value: "us-east-1"

  - it: "crdkit.addToken stores 'value' as an unresolved match: rule for the exact target — NOT resolved at add-time"
    set:
      target: prod-01
      tokens.GREETING: "hello"
      tokenOps:
        - name: DERIVED_VAR
          value: "prefix-@GREETING@"
    asserts:
      # no structure/crossTargets reference anywhere in this test — this
      # is purely the RAW declaration right after addToken runs, still
      # carrying the unresolved "@GREETING@" marker. Resolution (eager,
      # at addToken's own call site) was tried and deliberately rejected:
      # an integration's addToken call may reference a token that ANOTHER
      # integration only adds later in the same chain, and resolving
      # eagerly against ctx.tokens as it stood at THIS call site would
      # wrongly error on that (see crdkit's CLAUDE.md).
      - equal:
          path: tokens.DERIVED_VAR.value
          value:
            match:
              - prod-01: "prefix-@GREETING@"

  - it: "an addToken-added token resolves lazily via its match: rule, exactly like any hand-declared token, once actually referenced"
    set:
      target: prod-01
      tokens.GREETING: "hello"
      tokenOps:
        - name: DERIVED_VAR
          value: "prefix-@GREETING@"
      structure.x: "@DERIVED_VAR@"
    asserts:
      - equal:
          path: structure.x
          value: "prefix-hello"

  - it: "an addToken-added token has NO fallback for a target it was never given a value for — same honesty as any match-only declaration"
    set:
      target: prod-01
      tokens.GREETING: "hello"
      tokenOps:
        - name: DERIVED_VAR
          value: "prefix-@GREETING@"
      # DERIVED_VAR only has a match: rule for "prod-01" — no "default",
      # no env tiers. Asking for a completely different target ("qa") is
      # a legitimate "no value for env and no default" ERROR, same as any
      # other token that was only ever declared for specific targets.
      crossTargets:
        - "qa"
      crossTargetNames:
        - "DERIVED_VAR"
    asserts:
      - matchRegex:
          path: diag.errors[0]
          pattern: "no value for env 'qa' and no 'default' defined for 'DERIVED_VAR'"

  - it: "a second crdkit.addToken call for the SAME name but a DIFFERENT target adds another match: rule, preserving the first"
    set:
      target: prod-01
      tokenOps:
        - name: DERIVED_VAR
          value: "prod-value"
          target: "prod-01"
        - name: DERIVED_VAR
          value: "qa-value"
          target: "qa"
    asserts:
      - equal:
          path: tokens.DERIVED_VAR.value.match
          value:
            - qa: "qa-value"
            - prod-01: "prod-value"

  - it: "a second crdkit.addToken call for the SAME (name, target) pair overwrites in place — no duplicate/shadowed rule left behind"
    set:
      target: prod-01
      tokenOps:
        - name: DERIVED_VAR
          value: "first-value"
          target: "prod-01"
        - name: DERIVED_VAR
          value: "second-value"
          target: "prod-01"
    asserts:
      - equal:
          path: tokens.DERIVED_VAR.value.match
          value:
            - prod-01: "second-value"
      - lengthEqual:
          path: tokens.DERIVED_VAR.value.match
          count: 1

  - it: "a second crdkit.addToken call that omits targetContainer INHERITS the one set by an earlier call, rather than resetting it to 'none'"
    set:
      target: prod-01
      tokenOps:
        - name: DERIVED_VAR
          value: "prod-value"
          targetContainer: "main"
          target: "prod-01"
        - name: DERIVED_VAR
          value: "qa-value"
          target: "qa"
    asserts:
      - equal:
          path: tokens.DERIVED_VAR.targetContainer
          value: "main"

  - it: "crdkit.addToken can silently overwrite an existing token, including a locked one — no protection, by design"
    set:
      target: prod-01
      system.API_GROUP: "locked.example.com"
      tokenOps:
        - name: API_GROUP
          value: "overwritten-by-integration"
    asserts:
      # addToken deliberately skips the reserved-name collision check
      # (see crdkit's CLAUDE.md: integrations are trusted, unlike
      # consumer input) — crdkit.render's OWN post-chain reassertion is
      # what actually protects "system" tokens end-to-end in the real
      # pipeline; this harness calls addToken directly, without that
      # reassertion step, so the overwrite is visible here.
      - equal:
          path: tokens.API_GROUP.value
          value:
            match:
              - prod-01: "overwritten-by-integration"

  # --- caching / multi-target semantics (the redesign's whole point) ---

  - it: "resolving via a super-tier fallback caches every intermediate tier walked through, not just the exact target"
    set:
      target: prod-01
      tokens:
        REGION2:
          NONPROD: "region-nonprod"
          default: "region-default"
      # target "qam1-01" -> derived env "qam1" -> family "QA" -> super-tier
      # "NONPROD"; only "NONPROD" is actually declared, so resolution walks
      # target -> qam1 -> QA -> NONPROD before finding a value — every one
      # of those tiers should get cached (each a DISTINCT key from the
      # exact target here, since target "qam1-01" != derived env "qam1").
      crossTargets:
        - "qam1-01"
      crossTargetNames:
        - "REGION2"
    asserts:
      - equal:
          path: crossResolved.qam1-01.REGION2.value
          value: "region-nonprod"
      - equal:
          path: tokens.REGION2._value.qam1-01
          value: "region-nonprod"
      - equal:
          path: tokens.REGION2._value.qam1
          value: "region-nonprod"
      - equal:
          path: tokens.REGION2._value.QA
          value: "region-nonprod"
      - equal:
          path: tokens.REGION2._value.NONPROD
          value: "region-nonprod"

  - it: "a target-specific 'match:' rule is evaluated fresh even when a broader family-tier cache entry already exists from a different target"
    set:
      target: prod-01
      tokens:
        SPECIAL:
          NONPROD: "generic-nonprod"
          match:
            - "qap1-[0-9]{2}": "special-value"
      # "qam1-01" (env "qam1") and "qap1-02" (env "qap1") share family "QA"
      # — resolving "qam1-01" first populates the "QA" family-tier cache
      # with "generic-nonprod". Resolving "qap1-02" second must NOT be
      # short-circuited by that cache hit: its own "match:" rule fires
      # fresh (matching the full target string) and must win instead.
      crossTargets:
        - "qam1-01"
        - "qap1-02"
      crossTargetNames:
        - "SPECIAL"
    asserts:
      - equal:
          path: crossResolved.qam1-01.SPECIAL.value
          value: "generic-nonprod"
      - equal:
          path: crossResolved.qap1-02.SPECIAL.value
          value: "special-value"
      - equal:
          path: tokens.SPECIAL._value.QA
          value: "generic-nonprod"

  - it: "cycle detection is scoped to the target being resolved — a token cyclic under one target can resolve cleanly under another"
    set:
      target: prod-01
      tokens:
        X:
          default: "x-default"
          match:
            - "special": "@Y@"
        Y:
          default: "y-default"
          match:
            - "special": "@X@"
      # X and Y only reference each other via a "match:" rule that fires
      # exclusively for target "special" — under target "normal", neither
      # match rule fires and X falls straight through to its default, no
      # cycle at all. Same token, same declarations, different outcome per
      # target — this is the property the whole redesign exists to enable.
      crossTargets:
        - "special"
        - "normal"
      crossTargetNames:
        - "X"
    asserts:
      - matchRegex:
          path: diag.errors[0]
          pattern: "cycle"
      - lengthEqual:
          path: diag.errors
          count: 1
      - equal:
          path: crossResolved.normal.X.value
          value: "x-default"
