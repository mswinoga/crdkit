suite: crdkit token interpolation
templates:
  - test.yaml
tests:

  # --- basic scalar / chained @ref@ resolution (target-agnostic) ---

  - it: resolves a simple scalar token
    set:
      target: prod-01
      tokens.GREETING: "hello"
      structure.message: "@GREETING@"
    asserts:
      - equal:
          path: structure.message
          value: "hello"

  - it: "a bare scalar declaration is normalized into a dict under the literal 'default' key, so ctx.tokens[NAME] is always a dict"
    set:
      target: prod-01
      tokens.GREETING: "hello"
    asserts:
      # raw declaration, post-merge, pre-resolution — no structure/
      # crossTargets reference, so this is purely what
      # crdkit.mergeTokens.internal normalized "hello" into.
      - equal:
          path: tokens.GREETING
          value:
            default: "hello"

  - it: "'default' is a hardcoded crdkit-level fallback, combined with targetContainer, resolving unconditionally for ANY target — no taxonomy needed"
    set:
      target: some-unrecognized-target-with-no-taxonomy-hop-at-all
      tokens.DB_HOST.default: "db.internal"
      tokens.DB_HOST.targetContainer: "main"
      crossTargets:
        - "some-unrecognized-target-with-no-taxonomy-hop-at-all"
      crossTargetNames:
        - "DB_HOST"
    asserts:
      - equal:
          path: crossResolved.some-unrecognized-target-with-no-taxonomy-hop-at-all.DB_HOST.value
          value: "db.internal"
      - equal:
          path: crossResolved.some-unrecognized-target-with-no-taxonomy-hop-at-all.DB_HOST.targetContainer
          value: "main"
      - lengthEqual:
          path: diag.errors
          count: 0

  - it: "'default' is checked AFTER the parentTarget walk, not before — a more specific taxonomy-reached value always wins over it"
    set:
      target: prod-01
      parentTargetMap:
        prod-01: "PROD"
      tokens.REGION:
        default: "generic-region"
        PROD: "prod-specific-region"
      structure.region: "@REGION@"
    asserts:
      - equal:
          path: structure.region
          value: "prod-specific-region"

  - it: a token referencing another token (one level) resolves correctly
    set:
      target: prod-01
      tokens.A: "foo"
      tokens.B: "@A@-bar"
      structure.message: "@B@"
    asserts:
      - equal:
          path: structure.message
          value: "foo-bar"

  - it: a token referencing a chain of 3+ tokens resolves via the iterative resolver
    set:
      target: prod-01
      tokens.T1: "one"
      tokens.T2: "@T1@-two"
      tokens.T3: "@T2@-three"
      structure.message: "@T3@"
    asserts:
      - equal:
          path: structure.message
          value: "one-two-three"

  - it: a direct two-token @ref@ cycle records an ERROR mentioning a cycle, and does not hang
    set:
      target: prod-01
      tokens.A: "@B@"
      tokens.B: "@A@"
      structure.x: "@A@"
    asserts:
      - matchRegex:
          path: diag.errors[0]
          pattern: "cycle"

  - it: "@AT@ resolves to a literal @ character, applied only on the final substitution pass"
    set:
      target: prod-01
      structure.email: "user@AT@example.com"
    asserts:
      - equal:
          path: structure.email
          value: "user@example.com"

  - it: a declared-but-never-used token produces no diagnostic at all, even if it would error if resolved
    set:
      target: prod-01
      tokens.BROKEN: {}
    asserts:
      - lengthEqual:
          path: diag.errors
          count: 0
      - lengthEqual:
          path: diag.warnings
          count: 0

  - it: an entirely unset target produces NO diagnostic when nothing is ever resolved against it — no proactive check anymore
    set:
      target: ""
      tokens: {}
    asserts:
      - lengthEqual:
          path: diag.errors
          count: 0

  - it: resolving a name that was never declared at all (e.g. via crossTargets/resolveValue directly) records an ERROR, not a fail()
    set:
      target: prod-01
      crossTargets:
        - "prod-01"
      crossTargetNames:
        - "NEVER_DECLARED"
    asserts:
      - equal:
          path: diag.errors[0]
          value: "unknown token 'NEVER_DECLARED' referenced"
      - equal:
          path: crossResolved.prod-01.NEVER_DECLARED.value
          value: ""

  # --- dedicated attribute: a literal key equal to the exact target ---

  - it: a dedicated attribute (literal key equal to the exact target) resolves directly, at any granularity
    set:
      target: prod-01
      tokens.COLOR:
        prod-01: "red"
        blue-thing: "blue"
      structure.color: "@COLOR@"
    asserts:
      - equal:
          path: structure.color
          value: "red"

  - it: a dedicated attribute works for a bare, unsequenced target too — crdkit doesn't care about shape
    set:
      target: staging
      tokens.COLOR:
        staging: "teal"
      structure.color: "@COLOR@"
    asserts:
      - equal:
          path: structure.color
          value: "teal"

  - it: no dedicated attribute, no match, no parentTargetMap configured — an honest ERROR, not a silent wrong answer
    set:
      target: prod-01
      tokens.BROKEN:
        qa-01: "wrong-target-entirely"
      structure.x: "@BROKEN@"
    asserts:
      - equal:
          path: diag.errors[0]
          value: "no value found for 'BROKEN' — target chain exhausted at 'prod-01' starting from 'prod-01'"

  # --- match: (regex, tried once, unconditionally, before any escalation) ---

  - it: "match: resolves against the full target string — no shape requirement, works for any target"
    set:
      target: canary-thing
      tokens.SUBENV:
        match:
          - "canary-.*": "is-canary"
      structure.subenv: "@SUBENV@"
    asserts:
      - equal:
          path: structure.subenv
          value: "is-canary"

  - it: "match: rule values can reference capture groups from the pattern"
    set:
      target: qam1-05
      tokens.PREFIX:
        match:
          - "(.+)-[0-9]{2}": "$1"
      structure.prefix: "@PREFIX@"
    asserts:
      - equal:
          path: structure.prefix
          value: "qam1"

  - it: "match: first matching rule wins even when a later rule would also match"
    set:
      target: prod-01
      tokens.MULTI:
        match:
          - "prod-01": "first-match"
          - "prod-[0-9]{2}": "second-match-would-also-fit"
      structure.multi: "@MULTI@"
    asserts:
      - equal:
          path: structure.multi
          value: "first-match"

  - it: a dedicated attribute wins over a match rule that would also fire — most specific always beats pattern-based
    set:
      target: prod-01
      tokens.HOST:
        prod-01: "dedicated-wins"
        match:
          - "prod-[0-9]{2}": "pattern-would-fire-too"
      structure.host: "@HOST@"
    asserts:
      - equal:
          path: structure.host
          value: "dedicated-wins"

  # --- the parent-chain walk (crdkit.render's "parentTargetTemplate", client-supplied) ---

  - it: walks a single escalation hop when the exact target has no dedicated attribute
    set:
      target: prod-01
      tokens.REGION:
        prod: "us-east-1"
      structure.region: "@REGION@"
      parentTargetMap:
        prod-01: prod
    asserts:
      - equal:
          path: structure.region
          value: "us-east-1"

  - it: walks multiple escalation hops, caching every rung visited along the way, not just the one where the value was found
    set:
      target: qam1-01
      tokens.REGION2:
        NONPROD: "region-nonprod"
      parentTargetMap:
        qam1-01: qam1
        qam1: QA
        QA: NONPROD
      crossTargets:
        - "qam1-01"
      crossTargetNames:
        - "REGION2"
    asserts:
      - equal:
          path: crossResolved.qam1-01.REGION2.value
          value: "region-nonprod"
      - equal:
          path: tokens.REGION2._value.qam1-01
          value: "region-nonprod"
      - equal:
          path: tokens.REGION2._value.qam1
          value: "region-nonprod"
      - equal:
          path: tokens.REGION2._value.QA
          value: "region-nonprod"
      - equal:
          path: tokens.REGION2._value.NONPROD
          value: "region-nonprod"

  - it: with no parentTargetMap configured, there is NO escalation at all — same as crdkit.noParentTarget
    set:
      target: prod-01
      tokens.REGION:
        prod: "us-east-1"
      structure.region: "@REGION@"
    asserts:
      - equal:
          path: diag.errors[0]
          value: "no value found for 'REGION' — target chain exhausted at 'prod-01' starting from 'prod-01'"

  - it: a malformed client escalation map that cycles back on itself is caught as an ERROR, not a hang
    set:
      target: a
      tokens.X:
        unused: "never-reached"
      structure.x: "@X@"
      parentTargetMap:
        a: b
        b: a
    asserts:
      - equal:
          path: diag.errors[0]
          value: "target escalation chain for 'X' cycles back to 'a' while resolving from 'a'"
      - lengthEqual:
          path: diag.errors
          count: 1

  - it: "match: is evaluated fresh for the exact target even when a broader rung's cache is already populated from a DIFFERENT target's walk"
    set:
      target: prod-01
      tokens.SPECIAL:
        NONPROD: "generic-nonprod"
        match:
          - "qap1-[0-9]{2}": "special-value"
      parentTargetMap:
        qam1-01: qam1
        qam1: QA
        QA: NONPROD
        qap1-02: qap1
        qap1: QA
      crossTargets:
        - "qam1-01"
        - "qap1-02"
      crossTargetNames:
        - "SPECIAL"
    asserts:
      - equal:
          path: crossResolved.qam1-01.SPECIAL.value
          value: "generic-nonprod"
      - equal:
          path: crossResolved.qap1-02.SPECIAL.value
          value: "special-value"
      - equal:
          path: tokens.SPECIAL._value.QA
          value: "generic-nonprod"

  - it: the walk supports an arbitrary number of named rungs, not a fixed "family/tier" depth — some branches shorter than others
    set:
      target: prod-01
      tokens.REGION3:
        PROD: "us-east-1"
      parentTargetMap:
        prod-01: prod
        prod: PROD
      structure.region: "@REGION3@"
    asserts:
      - equal:
          path: structure.region
          value: "us-east-1"

  - it: "a value found via the walk still gets @ref@-chained normally, same as a dedicated attribute or match result"
    set:
      target: qa-01
      tokens.HOST_NAME: "db1"
      tokens.DB_HOST:
        QA: "@HOST_NAME@.internal"
      parentTargetMap:
        qa-01: qa
        qa: QA
      structure.dbHost: "@DB_HOST@"
    asserts:
      - equal:
          path: structure.dbHost
          value: "db1.internal"

  # --- targetContainer ---

  - it: a token with no targetContainer declared resolves with targetContainer "none"
    set:
      target: prod
      tokens.GREETING: "hello"
      crossTargets:
        - "prod"
      crossTargetNames:
        - "GREETING"
    asserts:
      - equal:
          path: crossResolved.prod.GREETING.value
          value: "hello"
      - equal:
          path: crossResolved.prod.GREETING.targetContainer
          value: "none"

  - it: a token can declare an explicit valid targetContainer, flat alongside a target entry — no "value" wrapper
    set:
      target: prod-01
      tokens.DB_HOST.default: "db.internal"
      tokens.DB_HOST.targetContainer: "main"
    asserts:
      - equal:
          path: tokens.DB_HOST.default
          value: "db.internal"
      - equal:
          path: tokens.DB_HOST.targetContainer
          value: "main"

  - it: a token can target the side-car or both containers
    set:
      target: prod-01
      tokens.SIDECAR_VAR.default: "x"
      tokens.SIDECAR_VAR.targetContainer: "side-car"
      tokens.SHARED_VAR.default: "y"
      tokens.SHARED_VAR.targetContainer: "both"
    asserts:
      - equal:
          path: tokens.SIDECAR_VAR.targetContainer
          value: "side-car"
      - equal:
          path: tokens.SHARED_VAR.targetContainer
          value: "both"

  - it: an invalid targetContainer records an ERROR and falls back to "none", value still resolves
    set:
      target: prod
      tokens.BAD_VAR.prod: "still-here"
      tokens.BAD_VAR.targetContainer: "sidecar-typo"
      crossTargets:
        - "prod"
      crossTargetNames:
        - "BAD_VAR"
    asserts:
      - equal:
          path: crossResolved.prod.BAD_VAR.value
          value: "still-here"
      - equal:
          path: crossResolved.prod.BAD_VAR.targetContainer
          value: "none"
      - equal:
          path: diag.errors[0]
          value: "invalid targetContainer 'sidecar-typo' for 'BAD_VAR' — must be one of main/side-car/both (or omitted)"

  - it: "multiple target entries coexist flat alongside targetContainer, each resolving independently"
    set:
      target: prod
      tokens:
        DB_HOST:
          targetContainer: "main"
          prod: "db-prod.internal"
          other: "db-other.internal"
      crossTargets:
        - "prod"
      crossTargetNames:
        - "DB_HOST"
    asserts:
      - equal:
          path: crossResolved.prod.DB_HOST.value
          value: "db-prod.internal"
      - equal:
          path: crossResolved.prod.DB_HOST.targetContainer
          value: "main"

  - it: "token with only default value renders correctly"
    set:
      target: prod-01
      parentTargetMap:
        prod-01: "PROD"
        PROD: default
      tokens:
        DEFAULT:
          default: "default value"
      structure:
        value_of_default: "@DEFAULT@"
    asserts:
      - equal:
          path: structure.value_of_default
          value: "default value"

  - it: "a token declaring ONLY targetContainer, no target entries at all, produces the ordinary 'no value found' error like any other unresolvable token — no dedicated 'declares targetContainer without value' special case anymore"
    set:
      target: prod
      tokens:
        BROKEN:
          targetContainer: "main"
      crossTargets:
        - "prod"
      crossTargetNames:
        - "BROKEN"
    asserts:
      - equal:
          path: diag.errors[0]
          value: "no value found for 'BROKEN' — target chain exhausted at 'prod' starting from 'prod'"
      - equal:
          path: crossResolved.prod.BROKEN.value
          value: ""
      - equal:
          path: crossResolved.prod.BROKEN.targetContainer
          value: "main"

  - it: an empty-string targetContainer is invalid, same as any other unrecognized value
    set:
      target: prod
      tokens.EMPTY_VAR.default: "x"
      tokens.EMPTY_VAR.targetContainer: ""
      crossTargets:
        - "prod"
      crossTargetNames:
        - "EMPTY_VAR"
    asserts:
      - equal:
          path: crossResolved.prod.EMPTY_VAR.targetContainer
          value: "none"
      - matchRegex:
          path: diag.errors[0]
          pattern: "invalid targetContainer ''"

  - it: a token with targetContainer can still chain off another token's value normally
    set:
      target: prod
      tokens.HOST_NAME: "db1"
      tokens.DB_HOST.prod: "@HOST_NAME@.internal"
      tokens.DB_HOST.targetContainer: "main"
      crossTargets:
        - "prod"
      crossTargetNames:
        - "DB_HOST"
    asserts:
      - equal:
          path: crossResolved.prod.DB_HOST.value
          value: "db1.internal"
      - equal:
          path: crossResolved.prod.DB_HOST.targetContainer
          value: "main"

  # --- merge / naming-convention / collision diagnostics ---

  - it: a locked (system) token collision discards the user value and records a WARNING
    set:
      target: prod-01
      system.API_GROUP: "locked.example.com"
      tokens.API_GROUP: "hijacked.example.com"
      structure.group: "@API_GROUP@"
    asserts:
      - equal:
          path: structure.group
          value: "locked.example.com"
      - equal:
          path: diag.warnings[0]
          value: "token 'API_GROUP' is reserved by the library and was overridden back to the library value"

  - it: a default token can be overridden by the user with no diagnostic
    set:
      target: prod-01
      defaults.LOG_LEVEL: "info"
      tokens.LOG_LEVEL: "debug"
      structure.level: "@LOG_LEVEL@"
    asserts:
      - equal:
          path: structure.level
          value: "debug"
      - lengthEqual:
          path: diag.warnings
          count: 0
      - lengthEqual:
          path: diag.errors
          count: 0

  - it: "'AT' is crdkit's one reserved built-in name — user-supplied tokens.AT is discarded with a WARNING"
    set:
      target: prod-01
      tokens.AT: "hijacked"
    asserts:
      - equal:
          path: diag.warnings[0]
          value: "token 'AT' is a reserved built-in and cannot be redefined; the user-supplied value was ignored"

  - it: a lowercase (or otherwise non-UPPER_SNAKE_CASE) token name records a WARNING but still resolves
    set:
      target: prod-01
      tokens.myToken: "hello"
      structure.message: "@myToken@"
    asserts:
      - equal:
          path: structure.message
          value: "hello"
      - equal:
          path: diag.warnings[0]
          value: "token name 'myToken' should be UPPER_SNAKE_CASE for readability"

  - it: a token name starting with a digit is non-conforming, same WARNING as any other bad casing
    set:
      target: prod-01
      tokens.1BAD: "x"
    asserts:
      - equal:
          path: diag.warnings[0]
          value: "token name '1BAD' should be UPPER_SNAKE_CASE for readability"

  - it: a token name starting with an underscore is non-conforming too
    set:
      target: prod-01
      tokens._BAD: "x"
    asserts:
      - equal:
          path: diag.warnings[0]
          value: "token name '_BAD' should be UPPER_SNAKE_CASE for readability"

  - it: "GOTCHA: a differently-cased near-miss of a locked name is NOT blocked as a collision, only flagged for casing"
    set:
      target: prod-01
      system.API_GROUP: "locked.example.com"
      tokens.apiGroup: "not-actually-blocked"
      structure.group: "@apiGroup@"
    asserts:
      # the user's "apiGroup" (different casing, different dict key) is a
      # DISTINCT token from the locked "API_GROUP" — no collision is
      # detected because the keys don't match, so it resolves normally.
      # This documents a real, narrow gap in the reserved-name protection:
      # it's case-sensitive, and the naming-convention check is only ever
      # a WARNING, so this isn't actually prevented, just flagged.
      - equal:
          path: structure.group
          value: "not-actually-blocked"
      - matchRegex:
          path: diag.warnings[0]
          pattern: "'apiGroup' should be UPPER_SNAKE_CASE"

  # --- crdkit.addToken ---

  - it: "crdkit.addToken against an existing scalar-normalized token ('default') MERGES a new dedicated attribute in, preserving 'default' as the fallback for every other target"
    set:
      target: prod-01
      tokens.EXISTING: "was-a-plain-scalar"
      tokenOps:
        - name: EXISTING
          value: "now-dedicated-for-prod-01"
    asserts:
      # "default" (what "was-a-plain-scalar" got normalized into) is an
      # ORDINARY target entry, not a reserved key — addToken preserves
      # it exactly like it would any other existing target entry, no
      # special-casing needed.
      - equal:
          path: tokens.EXISTING
          value:
            default: "was-a-plain-scalar"
            prod-01: "now-dedicated-for-prod-01"
            targetContainer: "none"

  - it: "crdkit.addToken stores 'value' as a DEDICATED ATTRIBUTE (a literal key equal to the exact target) — not resolved at add-time"
    set:
      target: prod-01
      tokens.GREETING: "hello"
      tokenOps:
        - name: DERIVED_VAR
          value: "prefix-@GREETING@"
    asserts:
      # raw declaration right after addToken runs — no structure/crossTargets
      # reference anywhere in this test, so this is purely what addToken
      # itself wrote, still carrying the unresolved "@GREETING@" marker.
      # targetContainer is always set (defaulting to "none"), flat
      # alongside the target entry — no "value" wrapper anymore.
      - equal:
          path: tokens.DERIVED_VAR
          value:
            prod-01: "prefix-@GREETING@"
            targetContainer: "none"

  - it: an addToken-added token resolves lazily via its dedicated attribute, exactly like any hand-declared token, once actually referenced
    set:
      target: prod-01
      tokens.GREETING: "hello"
      tokenOps:
        - name: DERIVED_VAR
          value: "prefix-@GREETING@"
      structure.x: "@DERIVED_VAR@"
    asserts:
      - equal:
          path: structure.x
          value: "prefix-hello"

  - it: an addToken-added token has no fallback for a target it was never given a value for, and no parentTargetMap configured
    set:
      target: prod-01
      tokenOps:
        - name: DERIVED_VAR
          value: "prefix-value"
      crossTargets:
        - "qa"
      crossTargetNames:
        - "DERIVED_VAR"
    asserts:
      - equal:
          path: diag.errors[0]
          value: "no value found for 'DERIVED_VAR' — target chain exhausted at 'qa' starting from 'qa'"

  - it: "a second crdkit.addToken call for the SAME name but a DIFFERENT target adds another dedicated attribute, preserving the first"
    set:
      target: prod-01
      tokenOps:
        - name: DERIVED_VAR
          value: "prod-value"
          target: "prod-01"
        - name: DERIVED_VAR
          value: "qa-value"
          target: "qa"
    asserts:
      - equal:
          path: tokens.DERIVED_VAR
          value:
            prod-01: "prod-value"
            qa: "qa-value"
            targetContainer: "none"

  - it: "a second crdkit.addToken call for the SAME (name, target) pair overwrites in place"
    set:
      target: prod-01
      tokenOps:
        - name: DERIVED_VAR
          value: "first-value"
          target: "prod-01"
        - name: DERIVED_VAR
          value: "second-value"
          target: "prod-01"
    asserts:
      - equal:
          path: tokens.DERIVED_VAR
          value:
            prod-01: "second-value"
            targetContainer: "none"

  - it: "a second crdkit.addToken call that omits targetContainer INHERITS the one set by an earlier call, rather than resetting it to 'none'"
    set:
      target: prod-01
      tokenOps:
        - name: DERIVED_VAR
          value: "prod-value"
          targetContainer: "main"
          target: "prod-01"
        - name: DERIVED_VAR
          value: "qa-value"
          target: "qa"
    asserts:
      - equal:
          path: tokens.DERIVED_VAR.targetContainer
          value: "main"

  - it: "crdkit.addToken's value chain-resolves against the FINAL state of ctx.tokens — a value referencing a token added by a LATER addToken call still resolves"
    set:
      target: prod-01
      tokenOps:
        - name: FIRST_VAR
          value: "uses-@SECOND_VAR@"
        - name: SECOND_VAR
          value: "computed-later"
      structure.x: "@FIRST_VAR@"
    asserts:
      # this is the whole reason addToken defers resolution instead of
      # resolving eagerly at its own call site — FIRST_VAR references a
      # token that's only added by a SECOND, later addToken call. Both
      # calls insert raw declarations before anything is resolved, so by
      # the time "structure.x" actually triggers resolution, both exist.
      - equal:
          path: structure.x
          value: "uses-computed-later"

  - it: "crdkit.addToken can silently overwrite an existing token, including a locked one — no protection, by design"
    set:
      target: prod-01
      system.API_GROUP: "locked.example.com"
      tokenOps:
        - name: API_GROUP
          value: "overwritten-by-integration"
    asserts:
      # addToken deliberately skips the reserved-name collision check
      # (see crdkit's CLAUDE.md: integrations are trusted, unlike
      # consumer input) — crdkit.render's OWN post-chain reassertion is
      # what actually protects "system" tokens end-to-end in the real
      # pipeline; this harness calls addToken directly, without that
      # reassertion step, so the overwrite is visible here. API_GROUP's
      # existing bare-scalar declaration was already normalized into
      # {default: "locked.example.com"} by crdkit.mergeTokens.internal
      # before addToken ever runs — "default" is an ORDINARY target
      # entry (not reserved), so addToken merges the new dedicated
      # attribute in alongside it rather than replacing it outright; a
      # target OTHER than "prod-01" would still fall back to the
      # "overwritten" library's original value via "default".
      - equal:
          path: tokens.API_GROUP
          value:
            default: "locked.example.com"
            prod-01: "overwritten-by-integration"
            targetContainer: "none"

  - it: crdkit.addToken warns on a non-conforming name and validates targetContainer the same as any other token
    set:
      target: prod-01
      tokenOps:
        - name: derivedVar
          value: "computed"
          targetContainer: "bogus"
    asserts:
      - equal:
          path: tokens.derivedVar.targetContainer
