suite: crdkit values schema
templates:
  - schema_test.yaml
tests:

  # --- self-check ---

  - it: a valid schema passes the self-check
    set:
      schemaOps:
        - op: check
          schema:
            type: map
            properties:
              name: {type: string, required: true, doc: "Name."}
              tags: {type: list, items: {type: scalar}}
              extra: {type: map, values: {type: any}, keys: {pattern: "^[a-z]+$"}}
              host: {type: scalar, tokens: true}
    asserts:
      - equal:
          path: results[0].ok
          value: "true"
      - lengthEqual:
          path: diag.errors
          count: 0

  - it: every self-check rule records its own ERROR and the check fails
    set:
      schemaOps:
        - op: check
          schema:
            type: map
            properties:
              a: {type: thing}
              b: {type: map, enum: [a]}
              c: {type: date}
              d: {type: map, tokens: true}
              e: {type: list, tokens: true, items: {type: scalar, tokens: true}}
              f: {type: scalar, tokens: true, markers: false}
              g: {type: scalar, default: x, required: true}
              h: {type: scalar, requried: true}
              i: {type: scalar, enum: a}
              j: {type: map, keys: {}}
              o: {type: map, values: {type: any}, keys: {pattern: "^[A-Z]+$", label: 5}}
              p: {type: map, values: {type: any}, keys: {pattern: "^[A-Z]+$", label: "<ID>"}}
              k: "not-a-node"
              l: {type: scalar, required: "yes"}
              m: {kind: scalar}
              n: {type: int, items: {type: any}}
    asserts:
      - equal:
          path: results[0].ok
          value: ""
      - equal:
          path: diag.errors
          value:
            - "schema invalid: properties.a: unknown type 'thing'"
            - "schema invalid: properties.b: 'enum' does not apply to type 'map'"
            - "schema invalid: properties.c: unknown type 'date'"
            - "schema invalid: properties.d: 'tokens' does not apply to type 'map'"
            - "schema invalid: properties.e.items: 'tokens: true' below another 'tokens: true'"
            - "schema invalid: properties.f: 'tokens: true' and 'markers: false' exclude each other"
            - "schema invalid: properties.g: 'default' and 'required: true' exclude each other"
            - "schema invalid: properties.h: unknown schema key 'requried'"
            - "schema invalid: properties.i: 'enum' must be a list"
            - "schema invalid: properties.j: 'keys' must be {pattern: <regex>}"
            - "schema invalid: properties.k: node must be a map"
            - "schema invalid: properties.l: 'required' must be a bool"
            - "schema invalid: properties.m: unknown schema key 'kind'"
            - "schema invalid: properties.m: unknown type ''"
            - "schema invalid: properties.n: 'items' does not apply to type 'int'"
            - "schema invalid: properties.o: 'keys.label' must be a string"

  - it: a switch case must declare the switch key as a static scalar
    set:
      schemaOps:
        - op: check
          schema:
            type: map
            values:
              switch:
                by: type
                cases:
                  good:
                    type: map
                    properties:
                      type: {type: scalar, markers: false}
                  bad:
                    type: map
                    properties:
                      type: {type: scalar}
                  missing:
                    type: map
    asserts:
      - equal:
          path: diag.errors
          value:
            - "schema invalid: values: case 'bad' must declare 'type' as a scalar type with 'markers: false'"
            - "schema invalid: values: case 'missing' must declare 'type' as a scalar type with 'markers: false'"

  - it: a schema that failed to parse is reported once, however often it is checked
    set:
      schemaOps:
        - op: check
          schema: {Error: "error converting YAML to JSON: yaml: line 2"}
        - op: check
          schema: {Error: "error converting YAML to JSON: yaml: line 2"}
    asserts:
      - equal:
          path: diag.errors
          value:
            - "schema invalid: (root): does not parse: error converting YAML to JSON: yaml: line 2"

  - it: an invalid schema skips validation and returns the values unchanged
    set:
      schemaOps:
        - op: validate
          schema: {type: map, properties: {a: {type: bogus}}, values: {type: scalar}}
          values: {a: 1, b: [x]}
    asserts:
      - equal:
          path: results[0].value
          value: {a: 1, b: [x]}
      - lengthEqual:
          path: diag.warnings
          count: 0

  # --- types ---

  - it: values matching every type pass through unchanged, with no diagnostics
    set:
      schemaOps:
        - op: validate
          schema:
            type: map
            properties:
              name: {type: string}
              count: {type: int}
              ratio: {type: number}
              flag: {type: bool}
              tags: {type: list, items: {type: string}}
              labels: {type: map, values: {type: any}}
              blob: {type: any}
          values:
            name: app
            count: 3
            ratio: 0.5
            flag: true
            tags: [a, b]
            labels: {x: {y: [1]}}
            blob: [1, {z: 2}]
    asserts:
      - equal:
          path: results[0].value
          value:
            name: app
            count: 3
            ratio: 0.5
            flag: true
            tags: [a, b]
            labels: {x: {y: [1]}}
            blob: [1, {z: 2}]
      - lengthEqual:
          path: diag.errors
          count: 0
      - lengthEqual:
          path: diag.warnings
          count: 0

  - it: type scalar accepts a string, an int and a bool
    set:
      schemaOps:
        - op: validate
          schema:
            type: map
            properties:
              s: {type: scalar}
              i: {type: scalar}
              b: {type: scalar}
          values: {s: text, i: 3, b: false}
    asserts:
      - equal:
          path: results[0].value
          value: {s: text, i: 3, b: false}
      - lengthEqual:
          path: diag.errors
          count: 0
      - lengthEqual:
          path: diag.warnings
          count: 0

  - it: a shape mismatch is a WARNING and the node is dropped
    set:
      schemaOps:
        - op: validate
          schema:
            type: map
            properties:
              m: {type: map}
              l: {type: list, tokens: false}
              s: {type: scalar}
              keep: {type: scalar}
          values: {m: "x", l: {a: 1}, s: [1], keep: ok}
    asserts:
      - equal:
          path: results[0].value
          value: {keep: ok}
      - equal:
          path: diag.warnings
          value:
            - "'l' must be a list — ignored"
            - "'m' must be a map — ignored"
            - "'s' must be a scalar — ignored"
      - lengthEqual:
          path: diag.errors
          count: 0

  - it: a root value of the wrong shape comes back as an empty map
    set:
      schemaOps:
        - op: validate
          schema: {type: map}
          values: "not-a-map"
          path: application
    asserts:
      - equal:
          path: results[0].value
          value: {}
      - equal:
          path: diag.warnings
          value:
            - "'application' must be a map — ignored"

  - it: an unknown key is a WARNING with its full path and is dropped; a map with "values" accepts every other key
    set:
      schemaOps:
        - op: validate
          schema:
            type: map
            properties:
              application:
                type: map
                properties:
                  services:
                    type: map
                    values:
                      type: map
                      properties:
                        greeting: {type: scalar}
            values: {type: any}
          values:
            global: {x: 1}
            application:
              services:
                APP: {greting: hi, greeting: hello}
                "a.b": {other: 1}
              extra: true
    asserts:
      - equal:
          path: results[0].value
          value:
            global: {x: 1}
            application:
              services:
                APP: {greeting: hello}
                "a.b": {}
      - equal:
          path: diag.warnings
          value:
            - "'application.extra' is not a known key — ignored"
            - "'application.services.APP.greting' is not a known key — ignored"
            - "'application.services[\"a.b\"].other' is not a known key — ignored"

  - it: a key failing "keys.pattern" is an ERROR and is dropped with its value
    set:
      schemaOps:
        - op: validate
          schema:
            type: map
            keys: {pattern: "^[A-Z][A-Z0-9_]*$"}
            values: {type: scalar}
          values: {GOOD: 1, bad: 2}
          path: environment
    asserts:
      - equal:
          path: results[0].value
          value: {GOOD: 1}
      - equal:
          path: diag.errors
          value:
            - "key 'environment.bad' must match '^[A-Z][A-Z0-9_]*$' — ignored"
      - equal:
          path: diag.warnings
          value: []

  - it: list elements are validated with indexed paths; a failing element is dropped
    set:
      schemaOps:
        - op: validate
          schema:
            type: map
            properties:
              ports: {type: list, items: {type: int}}
          values: {ports: [80, "http", 443]}
    asserts:
      - equal:
          path: results[0].value
          value: {ports: [80, 443]}
      - equal:
          path: diag.errors
          value:
            - "'ports[1]' must be of type 'int' — ignored"

  # --- scalar rules ---

  - it: type, enum, pattern and markers violations are ERRORs and the value is dropped
    set:
      schemaOps:
        - op: validate
          schema:
            type: map
            properties:
              enabled: {type: bool}
              count: {type: int}
              ratio: {type: number}
              name: {type: string}
              mode: {type: scalar, enum: [validate, deploy]}
              id: {type: scalar, pattern: "^[a-z]+$"}
              type: {type: scalar, markers: false}
          values:
            enabled: "false"
            count: 1.5
            ratio: "0.5"
            name: 5
            mode: deploi
            id: ABC
            type: "@KIND@"
    asserts:
      - equal:
          path: results[0].value
          value: {}
      - equal:
          path: diag.errors
          value:
            - "'count' must be of type 'int' — ignored"
            - "'enabled' must be of type 'bool' — ignored"
            - "'id' must match '^[a-z]+$' — ignored"
            - "'mode' must be one of 'validate', 'deploy' — ignored"
            - "'name' must be of type 'string' — ignored"
            - "'ratio' must be of type 'number' — ignored"
            - "'type' must not contain '@NAME@' markers — ignored"

  - it: a string holding markers skips type/enum/pattern (the value pass checks it)
    set:
      schemaOps:
        - op: validate
          schema:
            type: map
            properties:
              count: {type: int, enum: [1, 2]}
          values: {count: "@COUNT@"}
    asserts:
      - equal:
          path: results[0].value
          value: {count: "@COUNT@"}
      - lengthEqual:
          path: diag.errors
          count: 0

  - it: "dotted and relative markers count as markers: rejected in a markers: false field, type check skipped elsewhere"
    set:
      schemaOps:
        - op: validate
          schema:
            type: map
            properties:
              type: {type: scalar, markers: false}
              port: {type: int}
              host: {type: string, markers: false}
          values: {type: "@.kind@", port: "@SVC.port@", host: "me@example.com"}
    asserts:
      - equal:
          path: results[0].value
          value: {port: "@SVC.port@", host: "me@example.com"}
      - equal:
          path: diag.errors
          value:
            - "'type' must not contain '@NAME@' markers — ignored"

  - it: 'a token declaration in a "tokens: true" field is kept as written; a plain value is checked as usual'
    set:
      schemaOps:
        - op: validate
          schema:
            type: map
            properties:
              greeting: {type: string, tokens: true}
              hosts: {type: list, tokens: true, items: {type: scalar}}
              plain: {type: int, tokens: true}
          values:
            greeting: {default: hi, prod: hello}
            hosts: {default: [a], prod: [a, b]}
            plain: "x"
    asserts:
      - equal:
          path: results[0].value
          value:
            greeting: {default: hi, prod: hello}
            hosts: {default: [a], prod: [a, b]}
      - equal:
          path: diag.errors
          value:
            - "'plain' must be of type 'int' — ignored"

  # --- required / defaults ---

  - it: a missing required key is an ERROR; a present but dropped one is not reported twice
    set:
      schemaOps:
        - op: validate
          schema:
            type: map
            properties:
              target: {type: scalar, required: true}
              name: {type: string, required: true}
          values: {name: 5}
    asserts:
      - equal:
          path: diag.errors
          value:
            - "'name' must be of type 'string' — ignored"
            - "'target' is required"

  - it: a default is applied when the key is absent, never over a present key, and also after a dropped value
    set:
      schemaOps:
        - op: validate
          schema:
            type: map
            properties:
              enabled: {type: bool, default: true}
              mode: {type: scalar, default: deploy}
              level: {type: int, default: 1}
              greeting: {type: scalar, tokens: true, default: {default: hi, prod: hello}}
          values: {mode: validate, enabled: "no"}
    asserts:
      - equal:
          path: results[0].value
          value:
            enabled: true
            mode: validate
            level: 1
            greeting: {default: hi, prod: hello}
      - equal:
          path: diag.errors
          value:
            - "'enabled' must be of type 'bool' — ignored"

  - it: a null value counts as absent
    set:
      schemaOps:
        - op: validate
          schema:
            type: map
            properties:
              mode: {type: scalar, default: deploy}
              target: {type: scalar, required: true}
          values: {mode: null, target: null}
    asserts:
      - equal:
          path: results[0].value
          value: {mode: deploy}
      - equal:
          path: diag.errors
          value:
            - "'target' is required"

  # --- switch ---

  - it: a switch validates a map against the case its key selects; unknown or missing values are WARNINGs and the node is dropped
    set:
      schemaOps:
        - op: validate
          path: services
          schema:
            type: map
            values:
              switch:
                by: type
                cases:
                  greeter:
                    type: map
                    properties:
                      type: {type: scalar, markers: false, required: true}
                      greeting: {type: scalar}
                  leader:
                    type: map
                    properties:
                      type: {type: scalar, markers: false, required: true}
                      greeter: {type: scalar}
          values:
            A: {type: greeter, greeting: hi, greeter: B}
            B: {type: leader, greeter: A}
            C: {type: other}
            D: {greeting: hi}
            E: "x"
    asserts:
      - equal:
          path: results[0].value
          value:
            A: {type: greeter, greeting: hi}
            B: {type: leader, greeter: A}
      - equal:
          path: diag.warnings
          value:
            - "'services.A.greeter' is not a known key — ignored"
            - "'services.C.type' has unknown value 'other' — ignored"
            - "'services.D' has no 'type' — ignored"
            - "'services.E' must be a map — ignored"

  # --- value pass (per-target values) ---

  - it: 'a per-target value valid for the target records nothing'
    set:
      target: prod
      schemaOps:
        - op: validateValues
          schema:
            type: map
            properties:
              greeting: {type: string, tokens: true}
              count: {type: int, tokens: true}
          values:
            greeting: {default: hi, prod: hello}
            count: {default: 1, prod: 2}
    asserts:
      - lengthEqual:
          path: diag.errors
          count: 0
      - equal:
          path: seen
          value: {"count|prod": true, "greeting|prod": true}

  - it: 'a per-target value of the wrong type or outside the enum is an ERROR naming the target'
    set:
      target: prod
      schemaOps:
        - op: validateValues
          schema:
            type: map
            properties:
              count: {type: int, tokens: true}
              mode: {type: scalar, enum: [a, b], tokens: true}
              id: {type: scalar, pattern: "^[a-z]+$", tokens: true}
          values:
            count: {default: 1, prod: many}
            mode: {default: a, prod: c}
            id: {prod: X1}
    asserts:
      - equal:
          path: diag.errors
          value:
            - "'count' for target 'prod' must be of type 'int' — got 'many'"
            - "'id' for target 'prod' must match '^[a-z]+$' — got 'X1'"
            - "'mode' for target 'prod' must be one of 'a', 'b' — got 'c'"

  - it: 'type checks use "parses as": a numeric string and a marker-built number pass type int, a non-bool string fails bool'
    set:
      target: prod
      tokens:
        BASE: "4"
      schemaOps:
        - op: validateValues
          schema:
            type: map
            properties:
              a: {type: int, tokens: true}
              b: {type: int, tokens: true}
              c: {type: bool, tokens: true}
              d: {type: bool, tokens: true}
              e: {type: number, tokens: true}
          values:
            a: {default: "5"}
            b: {default: "@BASE@0"}
            c: {default: "true"}
            d: {default: "yes"}
            e: {default: "1.5e3"}
    asserts:
      - equal:
          path: diag.errors
          value:
            - "'d' for target 'prod' must be of type 'bool' — got 'yes'"

  - it: 'a plain string with markers is substituted for the target and checked'
    set:
      target: prod
      tokens:
        GOOD: "3"
        BAD: "x"
      schemaOps:
        - op: validateValues
          schema:
            type: map
            properties:
              good: {type: int}
              bad: {type: int}
              ports: {type: list, items: {type: int}}
          values: {good: "@GOOD@", bad: "@BAD@", ports: [80, "@BAD@"]}
    asserts:
      - equal:
          path: diag.errors
          value:
            - "'bad' for target 'prod' must be of type 'int' — got 'x'"
            - "'ports[1]' for target 'prod' must be of type 'int' — got 'x'"

  - it: 'a per-target list is checked as a list, element by element'
    set:
      target: prod
      schemaOps:
        - op: validateValues
          schema:
            type: map
            properties:
              hosts: {type: list, tokens: true, items: {type: int}}
              other: {type: list, tokens: true}
          values:
            hosts: {default: [1], prod: [1, b]}
            other: {prod: "x"}
    asserts:
      - equal:
          path: diag.errors
          value:
            - "'hosts[1]' for target 'prod' must be of type 'int' — got 'b'"
            - "'other' for target 'prod' must be a list"

  - it: 'a failed resolution reports only its own ERROR, no schema ERROR on top'
    set:
      target: prod
      schemaOps:
        - op: validateValues
          schema:
            type: map
            properties:
              count: {type: int, tokens: true}
              typo: {type: int}
          values:
            count: {qa: 1}
            typo: "@MISSING@"
    asserts:
      - equal:
          path: diag.errors
          value:
            - "no value found for 'count' — target chain exhausted at 'prod' starting from 'prod'"

  - it: 'the value pass follows a switch into the selected case'
    set:
      target: prod
      schemaOps:
        - op: validateValues
          path: services
          schema:
            type: map
            values:
              switch:
                by: type
                cases:
                  greeter:
                    type: map
                    properties:
                      type: {type: scalar, markers: false}
                      greeting: {type: int, tokens: true}
          values:
            A: {type: greeter, greeting: {prod: hi}}
            B: {type: unknown, greeting: {prod: hi}}
    asserts:
      - equal:
          path: diag.errors
          value:
            - "'services.A.greeting' for target 'prod' must be of type 'int' — got 'hi'"

  - it: 'the same path and target is checked once across value-pass and single-field calls'
    set:
      target: prod
      schemaOps:
        - op: validateValues
          schema: {type: map, properties: {count: {type: int, tokens: true}}}
          values: {count: {prod: x}}
        - op: validateValues
          schema: {type: map, properties: {count: {type: int, tokens: true}}}
          values: {count: {prod: x}}
        - op: value
          node: {type: int, tokens: true}
          def: {prod: x}
          path: count
    asserts:
      - equal:
          path: diag.errors
          value:
            - "'count' for target 'prod' must be of type 'int' — got 'x'"
      - equal:
          path: results[2].value
          value: x

  - it: 'a single field resolves and is checked for an explicit target other than the render target'
    set:
      target: qa
      parentTargetMap:
        qap1: qa
      schemaOps:
        - op: value
          node: {type: int, tokens: true}
          def: {qa: 1, qap1: x}
          path: application.services.APP.count
          target: qap1
        - op: value
          node: {type: int, tokens: true}
          def: {qa: 1, qap1: x}
          path: application.services.APP.count
        - op: value
          node: {type: int}
          def: 7
          path: application.services.APP.static
    asserts:
      - equal:
          path: results[0].value
          value: x
      - equal:
          path: results[1].value
          value: 1
      - equal:
          path: results[2].value
          value: 7
      - equal:
          path: diag.errors
          value:
            - "'application.services.APP.count' for target 'qap1' must be of type 'int' — got 'x'"

  # --- locating nodes ---

  - it: 'crdkit.schema.node follows properties, values, list indices and switches'
    set:
      schemaOps:
        - op: node
          schema: &services
            type: map
            properties:
              services:
                type: map
                values:
                  switch:
                    by: type
                    cases:
                      greeter:
                        type: map
                        properties:
                          type: {type: scalar, markers: false}
                          greeting: {type: scalar, tokens: true}
                          ports: {type: list, items: {type: int}}
          values: &servicesValues
            services:
              A: {type: greeter}
              B: {type: other}
          keys: [services, A, greeting]
        - op: node
          schema: *services
          values: *servicesValues
          keys: [services, A, ports, 0]
        - op: node
          schema: *services
          values: *servicesValues
          keys: [services, A]
        - op: node
          schema: *services
          values: *servicesValues
          keys: [services, B, greeting]
        - op: node
          schema: *services
          values: *servicesValues
          keys: [services, A, unknown]
    asserts:
      - equal:
          path: results[0]
          value: {found: true, value: {type: scalar, tokens: true}}
      - equal:
          path: results[1]
          value: {found: true, value: {type: int, tokens: false}}
      - equal:
          path: results[2].value.properties.type
          value: {type: scalar, markers: false}
      - equal:
          path: results[3].found
          value: false
      - equal:
          path: results[4].found
          value: false

  # --- docs ---

  - it: 'docs: skeleton in schema order, then a table per map node and a section per case'
    set:
      schemaOps:
        - op: docs
          title: Example values
          htmlLink: VALUES.html
          schemaText: |
            type: map
            values: {type: any, doc: "The consumer chart's own keys."}
            properties:
              target: {type: string, markers: false, required: true, doc: "Render target."}
              renderMode: {type: string, markers: false, enum: [validate, deploy], default: deploy, doc: "Mode | see README."}
              services:
                type: map
                doc: "Services by ID."
                keys: {pattern: "^[A-Z]+$", label: "<ID>"}
                values:
                  switch:
                    by: type
                    cases:
                      greeter:
                        type: map
                        doc: "Writes a greeting."
                        properties:
                          type: {type: string, markers: false, required: true}
                          greeting: {type: string, tokens: true, doc: "File\ncontent."}
                          ports: {type: list, items: {type: int}}
                      environment:
                        type: map
                        properties:
                          type: {type: string, markers: false, required: true}
                          environment: {type: map, keys: {pattern: "^[A-Z]+$"}, values: {type: scalar, tokens: true}}
    asserts:
      - matchSnapshot:
          path: results[0].text
      - matchRegex:
          path: results[0].text
          pattern: "\\| `renderMode` \\| string, one of: validate, deploy \\| no \\| `\"deploy\"` \\|  \\| Mode \\\\\\| see README\\. \\|"
      - matchRegex:
          path: results[0].text
          pattern: "## `services.\\*\\[type=greeter\\]`"
      - matchRegex:
          path: results[0].text
          pattern: "\\| `greeting` \\| string \\| yes \\|  \\| File content\\. \\|"
      - matchRegex:
          path: results[0].text
          pattern: "^# Example values\\n\\n\\[HTML reference\\]\\(VALUES.html\\)\\n\\n```yaml\\ntarget:  # string, required\\nrenderMode:  # string\\nservices:  # map\\n  <ID>:  # map, by type\\n    # type: greeter\\n    # type:  # string, required\\n    # greeting:  # string, per target\\n    # ports:  # list of int, per target\\n    #   - # int\\n"

  - it: 'docs: a column with no content is omitted'
    set:
      schemaOps:
        - op: docs
          schema:
            type: map
            properties:
              a: {type: string, markers: false}
              b: {type: int, markers: false, default: 3}
    asserts:
      - matchRegex:
          path: results[0].text
          pattern: "\\| Key \\| Type \\| Per target \\| Default \\|\\n\\| --- \\| --- \\| --- \\| --- \\|\\n\\| `a` \\| string \\| no \\|  \\|\\n\\| `b` \\| int \\| no \\| `3` \\|\\n"
      - notMatchRegex:
          path: results[0].text
          pattern: "Required|Description"

  - it: 'docs: a case section has the shared marker, the matching example entries and the sections'
    set:
      schemaOps:
        - op: docs
          example:
            services:
              APP: {type: greeter, greeting: hello}
              OTHER: {type: greeter, greeting: bye}
              SHARED: {type: environment}
          sections:
            "services.*[type=greeter]":
              - title: Generated variables
                columns: [Pattern, Value]
                rows:
                  - ["<ID>_GREETER", "<ID>"]
              - title: Example output
                code: "type: greeter\n"
          schemaText: |
            type: map
            properties:
              services:
                type: map
                values:
                  switch:
                    by: type
                    cases:
                      greeter:
                        type: map
                        doc: "Writes a greeting."
                        properties:
                          type: {type: string, markers: false, required: true}
                          greeting: {type: string}
                      environment:
                        type: map
                        properties:
                          type: {type: string, markers: false, required: true}
    asserts:
      - equal:
          path: diag.errors
          value: []
      - matchRegex:
          path: results[0].text
          pattern: "## `services.\\*\\[type=greeter\\]`\\n\\nWrites a greeting\\.\\n\\n\\| Key \\| Type \\| Per target \\| Required \\|\\n\\| --- \\| --- \\| --- \\| --- \\|\\n\\| `type` \\(shared\\) \\| string \\| no \\| yes \\|\\n\\| `greeting` \\| string \\| yes \\|  \\|\\n\\n\\*\\*Example\\*\\*\\n\\n```yaml\\nservices:\\n  APP:\\n    greeting: hello\\n    type: greeter\\n  OTHER:\\n    greeting: bye\\n    type: greeter\\n```\\n\\n\\*\\*Generated variables\\*\\*\\n\\n\\| Pattern \\| Value \\|\\n\\| --- \\| --- \\|\\n\\| <ID>_GREETER \\| <ID> \\|\\n\\n\\*\\*Example output\\*\\*\\n\\n```yaml\\ntype: greeter\\n```"
      - matchRegex:
          path: results[0].text
          pattern: "## `services.\\*\\[type=environment\\]`\\n\\n\\| Key \\| Type \\| Per target \\| Required \\|\\n\\| --- \\| --- \\| --- \\| --- \\|\\n\\| `type` \\(shared\\) \\| string \\| no \\| yes \\|\\n\\n\\*\\*Example\\*\\*\\n\\n```yaml\\nservices:\\n  SHARED:"
      - notMatchRegex:
          path: results[0].text
          pattern: "\\(generated\\)"

  - it: 'docs: an unreached case gets a generated example, marked, wrapped in the key labels'
    set:
      schemaOps:
        - op: docs
          schemaText: |
            type: map
            properties:
              services:
                type: map
                keys: {pattern: "^[A-Z]+$", label: "<ID>"}
                values:
                  switch:
                    by: type
                    cases:
                      greeter:
                        type: map
                        properties:
                          type: {type: string, markers: false, required: true}
                          greeting: {type: string}
                          mode: {type: string, markers: false, enum: [fast, slow]}
                          port: {type: int, default: 80}
                          name: {type: string, markers: false, pattern: "^[a-z]+$"}
                          hosts: {type: list, tokens: false, items: {type: scalar, markers: false}}
                          flag: {type: bool, markers: false}
    asserts:
      - matchRegex:
          path: results[0].text
          pattern: "\\*\\*Example\\*\\* \\(generated\\)\\n\\n```yaml\\nservices:\\n  <ID>:\\n    flag: true\\n    greeting:\\n      default: text\\n      prod: text\\n    hosts:\\n    - text\\n    mode: fast\\n    port:\\n      default: 80\\n      prod: 80\\n    type: greeter\\n```"

  - it: 'docs: a schema with only a switch at the root renders the case sections'
    set:
      schemaOps:
        - op: docs
          schemaText: |
            switch:
              by: flavor
              cases:
                a:
                  type: map
                  properties:
                    flavor: {type: scalar, markers: false}
    asserts:
      - equal:
          path: results[0].text
          value: |
            # Values

            ```yaml
            # flavor: a
            # flavor:  # scalar
            ```

            ## `[flavor=a]`

            | Key | Type | Per target |
            | --- | --- | --- |
            | `flavor` | scalar | no |

            **Example** (generated)

            ```yaml
            flavor: a
            ```

  - it: 'docs: a section on a non-map node gets a section of its own'
    set:
      schemaOps:
        - op: docs
          sections:
            name:
              - title: Notes
                doc: "Plain."
          schemaText: |
            type: map
            properties:
              name: {type: string, doc: "The name."}
    asserts:
      - matchRegex:
          path: results[0].text
          pattern: "## `name`\\n\\nThe name\\.\\n\\n\\*\\*Notes\\*\\*\\n\\nPlain\\.\\n$"

  # --- omitted DSL keys ---

  - it: 'crdkit.schema.path spells keys dotted, keys with "." in brackets, numbers as indices'
    set:
      schemaOps:
        - op: path
          keys: [application, services, APP, greeting]
        - op: path
          keys: [a.b, c]
        - op: path
          keys: [hosts, 0, "1"]
          path: services.APP
        - op: path
          keys: []
    asserts:
      - equal:
          path: results
          value:
            - {text: application.services.APP.greeting}
            - {text: '["a.b"].c'}
            - {text: 'services.APP.hosts[0].1'}
            - {text: ""}

  - it: 'tokens omitted = per-target on scalars and lists, static on markers:false scalars, never below a per-target node'
    set:
      target: prod
      schemaOps:
        - op: validate
          schema: &defaults
            type: map
            properties:
              greeting: {type: string}
              hosts: {type: list, items: {type: int}}
              type: {type: scalar, markers: false}
              pinned: {type: scalar, tokens: false}
          values: &defaultsValues
            greeting: {default: hi, prod: hello}
            hosts: {default: [1], prod: [2, x]}
            type: {prod: a}
            pinned: {prod: a}
        - op: validateValues
          schema: *defaults
          values: *defaultsValues
    asserts:
      - equal:
          path: results[0].value
          value:
            greeting: {default: hi, prod: hello}
            hosts: {default: [1], prod: [2, x]}
      - equal:
          path: diag.warnings
          value:
            - "'pinned' must be a scalar — ignored"
            - "'type' must be a scalar — ignored"
      - equal:
          path: diag.errors
          value:
            - "'hosts[1]' for target 'prod' must be of type 'int' — got 'x'"

  - it: 'an explicit tokens:true below an implicitly per-target list is a nested-tokens ERROR'
    set:
      schemaOps:
        - op: check
          schema:
            type: map
            properties:
              hosts: {type: list, items: {type: scalar, tokens: true}}
              static: {type: list, tokens: false, items: {type: scalar, tokens: true}}
    asserts:
      - equal:
          path: diag.errors
          value:
            - "schema invalid: properties.hosts.items: 'tokens: true' below another 'tokens: true'"

  - it: 'type omitted is a self-check ERROR except on a switch node; a closed map warns'
    set:
      schemaOps:
        - op: check
          schema: {type: map, properties: {a: {doc: "no type"}}}
        - op: validate
          schema: {type: map, properties: {any: {type: scalar}}}
          values: {any: 5, other: 1}
    asserts:
      - equal:
          path: results[1].value
          value: {any: 5}
      - equal:
          path: diag.errors
          value:
            - "schema invalid: properties.a: unknown type ''"
      - equal:
          path: diag.warnings
          value:
            - "'other' is not a known key — ignored"

  # --- key order ---

  - it: 'order records nested block keys in text order'
    set:
      schemaOps:
        - op: order
          text: |
            type: map
            properties:
              zeta:
                type: string
              alpha:
                type: map
                properties:
                  inner: {type: string}
                  first:
                    type: int
            values:
              type: any
    asserts:
      - equal:
          path: results[0].order
          value:
            type: 0
            properties: 1
            properties.zeta: 2
            properties.zeta.type: 3
            properties.alpha: 4
            properties.alpha.type: 5
            properties.alpha.properties: 6
            properties.alpha.properties.inner: 7
            properties.alpha.properties.first: 8
            properties.alpha.properties.first.type: 9
            values: 10
            values.type: 11

  - it: 'order has no entry for keys inside a flow map, also across lines'
    set:
      schemaOps:
        - op: order
          text: |
            properties:
              a: {type: string, doc: x}
              b: {type: map, properties: {c: {type: string},
                  d: {type: int}}}
              e:
                type: string
    asserts:
      - equal:
          path: results[0].order
          value:
            properties: 0
            properties.a: 1
            properties.b: 2
            properties.e: 3
            properties.e.type: 4

  - it: 'order ignores key-looking lines in block scalars and list items'
    set:
      schemaOps:
        - op: order
          text: |
            properties:
              a:
                doc: |
                  fake: 1
                  properties:
                    nested: x

                  more: 2
                type: string
              b:
                doc: >-
                  other: 3
                default:
                - k: 1
                  j: 2
                - k: 3
                enum:
                - x
                type: list
    asserts:
      - equal:
          path: results[0].order
          value:
            properties: 0
            properties.a: 1
            properties.a.doc: 2
            properties.a.type: 3
            properties.b: 4
            properties.b.doc: 5
            properties.b.default: 6
            properties.b.enum: 7
            properties.b.type: 8

  - it: 'order keeps a switch cases in text order'
    set:
      schemaOps:
        - op: order
          text: |
            switch:
              by: type
              cases:
                zeta:
                  type: map
                alpha:
                  type: map
                  properties:
                    "a.b": {type: string}
    asserts:
      - equal:
          path: results[0].order
          value:
            switch: 0
            switch.by: 1
            switch.cases: 2
            switch.cases.zeta: 3
            switch.cases.zeta.type: 4
            switch.cases.alpha: 5
            switch.cases.alpha.type: 6
            switch.cases.alpha.properties: 7
            switch.cases.alpha.properties["a.b"]: 8

  # --- JSON Schema ---

  - it: 'jsonSchema emits the draft-07 root and the shared definitions'
    set:
      schemaOps:
        - op: jsonSchema
          title: Example values
          schemaText: |
            type: map
            properties:
              name: {type: string}
    asserts:
      - equal:
          path: results[0].json["$schema"]
          value: "http://json-schema.org/draft-07/schema#"
      - equal:
          path: results[0].json.title
          value: Example values
      - equal:
          path: results[0].json.definitions
          value:
            tokenDeclaration: {type: object, minProperties: 1}
            markers: {type: string, pattern: "@[A-Za-z0-9_.]+@"}
      - equal:
          path: results[0].json["x-crdkit-type"]
          value: map
      - lengthEqual:
          path: diag.errors
          count: 0

  - it: 'jsonSchema title defaults to Values and the text is pretty JSON'
    set:
      schemaOps:
        - op: jsonSchema
          schemaText: |
            type: map
    asserts:
      - equal:
          path: results[0].json.title
          value: Values
      - matchRegex:
          path: results[0].text
          pattern: '^\{\n  "\$schema": '

  - it: 'jsonSchema maps each scalar type, enum, pattern and default (markers: false)'
    set:
      schemaOps:
        - op: jsonSchema
          schemaText: |
            type: map
            properties:
              s: {type: string, markers: false, pattern: "^a", enum: [ab, ac], default: ab}
              i: {type: int, markers: false}
              num: {type: number, markers: false}
              flag: {type: bool, markers: false}
              c: {type: scalar, markers: false}
    asserts:
      - equal:
          path: results[0].json.properties.s
          value:
            type: string
            pattern: "^a"
            enum: [ab, ac]
            default: ab
            not: {pattern: "@[A-Za-z0-9_.]+@"}
            x-crdkit-type: string
            x-crdkit-perTarget: "no"
      - equal:
          path: results[0].json.properties.i
          value: {type: integer, x-crdkit-type: int, x-crdkit-perTarget: "no"}
      - equal:
          path: results[0].json.properties.num
          value: {type: number, x-crdkit-type: number, x-crdkit-perTarget: "no"}
      - equal:
          path: results[0].json.properties.flag
          value: {type: boolean, x-crdkit-type: bool, x-crdkit-perTarget: "no"}
      - equal:
          path: results[0].json.properties.c
          value:
            type: [string, number, boolean]
            not: {pattern: "@[A-Za-z0-9_.]+@"}
            x-crdkit-type: scalar
            x-crdkit-perTarget: "no"

  - it: 'jsonSchema: markers allowed on an int/number/bool wrap it in anyOf with the markers definition'
    set:
      schemaOps:
        - op: jsonSchema
          schemaText: |
            type: map
            properties:
              i: {type: int, tokens: false}
              num: {type: number, tokens: false}
              flag: {type: bool, tokens: false}
              s: {type: string, tokens: false}
    asserts:
      - equal:
          path: results[0].json.properties.i
          value:
            anyOf:
              - {type: integer}
              - {"$ref": "#/definitions/markers"}
            x-crdkit-type: int
            x-crdkit-perTarget: markers
      - equal:
          path: results[0].json.properties.num.anyOf[0]
          value: {type: number}
      - equal:
          path: results[0].json.properties.flag.anyOf[0]
          value: {type: boolean}
      - equal:
          path: results[0].json.properties.s
          value: {type: string, x-crdkit-type: string, x-crdkit-perTarget: markers}

  - it: 'jsonSchema: a marker-accepting string or scalar with enum or pattern is wrapped in anyOf, a plain one is not'
    set:
      schemaOps:
        - op: jsonSchema
          schemaText: |
            type: map
            properties:
              se: {type: string, tokens: false, enum: [a, b]}
              sp: {type: string, tokens: false, pattern: "^a"}
              ce: {type: scalar, tokens: false, enum: [a, 1]}
              plain: {type: string, tokens: false}
              locked: {type: string, markers: false, pattern: "^a"}
    asserts:
      - equal:
          path: results[0].json.properties.se
          value:
            anyOf:
              - {type: string, enum: [a, b]}
              - {"$ref": "#/definitions/markers"}
            x-crdkit-type: string
            x-crdkit-perTarget: markers
      - equal:
          path: results[0].json.properties.sp.anyOf
          value:
            - {type: string, pattern: "^a"}
            - {"$ref": "#/definitions/markers"}
      - equal:
          path: results[0].json.properties.ce.anyOf
          value:
            - {type: [string, number, boolean], enum: [a, 1]}
            - {"$ref": "#/definitions/markers"}
      - equal:
          path: results[0].json.properties.plain
          value: {type: string, x-crdkit-type: string, x-crdkit-perTarget: markers}
      - equal:
          path: results[0].json.properties.locked
          value:
            type: string
            pattern: "^a"
            not: {pattern: "@[A-Za-z0-9_.]+@"}
            x-crdkit-type: string
            x-crdkit-perTarget: "no"

  - it: 'jsonSchema: a per-target scalar or list is anyOf [type, declaration, markers]'
    set:
      schemaOps:
        - op: jsonSchema
          schemaText: |
            type: map
            properties:
              host: {type: string, tokens: true}
              ports: {type: list, items: {type: int}}
    asserts:
      - equal:
          path: results[0].json.properties.host
          value:
            anyOf:
              - {type: string}
              - {"$ref": "#/definitions/tokenDeclaration"}
              - {"$ref": "#/definitions/markers"}
            x-crdkit-type: string
            x-crdkit-perTarget: "yes"
      - equal:
          path: results[0].json.properties.ports.anyOf[0]
          value:
            type: array
            items:
              anyOf:
                - {type: integer}
                - {"$ref": "#/definitions/markers"}
              x-crdkit-type: int
              x-crdkit-perTarget: markers
      - equal:
          path: results[0].json.properties.ports.anyOf[1]
          value: {"$ref": "#/definitions/tokenDeclaration"}
      - equal:
          path: results[0].json.properties.ports["x-crdkit-perTarget"]
          value: "yes"

  - it: 'jsonSchema: a list without tokens is a plain array, items default to any'
    set:
      schemaOps:
        - op: jsonSchema
          schemaText: |
            type: map
            properties:
              plain: {type: list, tokens: false}
              free: {type: any}
    asserts:
      - equal:
          path: results[0].json.properties.plain
          value:
            type: array
            items: {x-crdkit-type: any}
            x-crdkit-type: list
            x-crdkit-perTarget: "no"
      - equal:
          path: results[0].json.properties.free
          value: {x-crdkit-type: any}

  - it: 'jsonSchema: closed map, open map, required, keys pattern and label, order'
    set:
      schemaOps:
        - op: jsonSchema
          schemaText: |
            type: map
            properties:
              closed:
                type: map
                properties:
                  zeta: {type: string, markers: false, required: true}
                  alpha: {type: string, markers: false}
              open:
                type: map
                keys: {pattern: "^[A-Z]+$", label: "<ID>"}
                values: {type: any}
              bare:
                type: map
                values: {type: any}
    asserts:
      - equal:
          path: results[0].json.properties.closed.additionalProperties
          value: false
      - equal:
          path: results[0].json.properties.closed.required
          value: [zeta]
      - equal:
          path: results[0].json.properties.closed["x-crdkit-order"]
          value: [zeta, alpha]
      - equal:
          path: results[0].json.properties.open.additionalProperties
          value: {x-crdkit-type: any}
      - equal:
          path: results[0].json.properties.open.propertyNames
          value: {pattern: "^[A-Z]+$"}
      - equal:
          path: results[0].json.properties.open["x-crdkit-keyLabel"]
          value: "<ID>"
      - equal:
          path: results[0].json.properties.bare["x-crdkit-keyLabel"]
          value: "<key>"
      - notExists:
          path: results[0].json.properties.closed["x-crdkit-keyLabel"]
      - notExists:
          path: results[0].json.properties.bare.propertyNames
      - equal:
          path: results[0].json["x-crdkit-order"]
          value: [closed, open, bare]

  - it: 'jsonSchema: flow-map properties are ordered after the positioned ones, alphabetically'
    set:
      schemaOps:
        - op: jsonSchema
          schemaText: |
            type: map
            properties: {zz: {type: string}, aa: {type: string}}
            values: {type: any}
    asserts:
      - equal:
          path: results[0].json["x-crdkit-order"]
          value: [aa, zz]

  - it: 'jsonSchema: doc becomes a plain description and a Markdown description'
    set:
      schemaOps:
        - op: jsonSchema
          schemaText: |
            type: map
            properties:
              a: {type: string, markers: false, doc: "Use `x`, see [the docs](http://e.x/d)."}
              b: {type: string, markers: false}
    asserts:
      - equal:
          path: results[0].json.properties.a.description
          value: "Use x, see the docs."
      - equal:
          path: results[0].json.properties.a.markdownDescription
          value: "Use `x`, see [the docs](http://e.x/d)."
      - notExists:
          path: results[0].json.properties.b.description
      - notExists:
          path: results[0].json.properties.b.markdownDescription

  - it: 'jsonSchema: switch cases are complete definitions with allOf, enum and refs'
    set:
      schemaOps:
        - op: jsonSchema
          schemaText: |
            type: map
            values:
              switch:
                by: type
                cases:
                  zeta:
                    type: map
                    properties:
                      type: {type: string, markers: false, required: true}
                      z: {type: string, markers: false}
                  alpha:
                    type: map
                    properties:
                      type: {type: string, markers: false, required: true}
                      a: {type: int, markers: false}
    asserts:
      - equal:
          path: results[0].json.additionalProperties.type
          value: object
      - equal:
          path: results[0].json.additionalProperties.required
          value: [type]
      - equal:
          path: results[0].json.additionalProperties.properties
          value:
            type: {enum: [zeta, alpha]}
      - equal:
          path: results[0].json.additionalProperties.allOf
          value:
            - if: {properties: {type: {const: zeta}}, required: [type]}
              then: {"$ref": "#/definitions/*%5Btype=zeta%5D"}
            - if: {properties: {type: {const: alpha}}, required: [type]}
              then: {"$ref": "#/definitions/*%5Btype=alpha%5D"}
      - equal:
          path: results[0].json.additionalProperties["x-crdkit-switch"]
          value:
            by: type
            cases: [zeta, alpha]
            refs:
              zeta: "#/definitions/*%5Btype=zeta%5D"
              alpha: "#/definitions/*%5Btype=alpha%5D"
      - equal:
          path: results[0].json.additionalProperties["x-crdkit-type"]
          value: map
      - equal:
          path: results[0].json.definitions["*[type=alpha]"].additionalProperties
          value: false
      - equal:
          path: results[0].json.definitions["*[type=alpha]"]["x-crdkit-path"]
          value: "*[type=alpha]"
      - equal:
          path: results[0].json.definitions["*[type=alpha]"].properties.a.type
          value: integer
      - equal:
          path: results[0].json.definitions["*[type=zeta]"]["x-crdkit-order"]
          value: [type, z]

  - it: 'jsonSchema: x-crdkit-shared marks only properties identical in every case'
    set:
      schemaOps:
        - op: jsonSchema
          schemaText: |
            switch:
              by: kind
              cases:
                one:
                  type: map
                  properties:
                    kind: {type: string, markers: false, required: true}
                    same: {type: int, markers: false}
                    differs: {type: int, markers: false}
                    only: {type: int, markers: false}
                two:
                  type: map
                  properties:
                    kind: {type: string, markers: false, required: true}
                    same: {type: int, markers: false}
                    differs: {type: string, markers: false}
    asserts:
      - equal:
          path: results[0].json.definitions["[kind=one]"].properties.same["x-crdkit-shared"]
          value: true
      - equal:
          path: results[0].json.definitions["[kind=two]"].properties.kind["x-crdkit-shared"]
          value: true
      - notExists:
          path: results[0].json.definitions["[kind=one]"].properties.differs["x-crdkit-shared"]
      - notExists:
          path: results[0].json.definitions["[kind=one]"].properties.only["x-crdkit-shared"]
      - notExists:
          path: results[0].json.definitions["[kind=two]"].properties.differs["x-crdkit-shared"]

  - it: 'jsonSchema: a single case shares nothing'
    set:
      schemaOps:
        - op: jsonSchema
          schemaText: |
            switch:
              by: kind
              cases:
                only:
                  type: map
                  properties:
                    kind: {type: string, markers: false, required: true}
    asserts:
      - notExists:
          path: results[0].json.definitions["[kind=only]"].properties.kind["x-crdkit-shared"]

  - it: 'jsonSchema: examples come through a values map and a switch, unique, per node'
    set:
      schemaOps:
        - op: jsonSchema
          schemaText: |
            type: map
            properties:
              target: {type: string, markers: false}
              services:
                type: map
                values:
                  switch:
                    by: type
                    cases:
                      a:
                        type: map
                        properties:
                          type: {type: string, markers: false, required: true}
                          size: {type: int, markers: false}
                      b:
                        type: map
                        properties:
                          type: {type: string, markers: false, required: true}
                          size: {type: int, markers: false}
              untouched: {type: string, markers: false}
          example:
            target: prod
            services:
              X: {type: a, size: 1}
              Y: {type: b, size: 1}
              Z: {type: a, size: 2}
    asserts:
      - equal:
          path: results[0].json.properties.target.examples
          value: [prod]
      - notExists:
          path: results[0].json.properties.untouched.examples
      - equal:
          path: results[0].json.properties.services.additionalProperties.examples
          value:
            - {type: a, size: 1}
            - {type: b, size: 1}
            - {type: a, size: 2}
      - equal:
          path: results[0].json.definitions["services.*[type=a]"].examples
          value:
            - {type: a, size: 1}
            - {type: a, size: 2}
      - equal:
          path: results[0].json.definitions["services.*[type=a]"].properties.size.examples
          value: [1, 2]
      - equal:
          path: results[0].json.definitions["services.*[type=b]"].properties.size.examples
          value: [1]
      - equal:
          path: results[0].json.definitions["services.*[type=b]"].properties.type.examples
          value: [b]
      - equal:
          path: results[0].json.properties.services.examples[0].Y
          value: {type: b, size: 1}

  - it: 'jsonSchema: examples also reach list items and a values entry outside the properties'
    set:
      schemaOps:
        - op: jsonSchema
          schemaText: |
            type: map
            properties:
              named: {type: string, markers: false}
            values: {type: string, markers: false}
          example:
            named: n
            other: o
            more: m
    asserts:
      - equal:
          path: results[0].json.additionalProperties.examples
          value: [m, o]
      - equal:
          path: results[0].json.properties.named.examples
          value: [n]

  - it: 'jsonSchema: a list example reaches the items node'
    set:
      schemaOps:
        - op: jsonSchema
          schemaText: |
            type: map
            properties:
              ports: {type: list, items: {type: int}}
          example:
            ports: [80, 443, 80]
    asserts:
      - equal:
          path: results[0].json.properties.ports.examples
          value:
            - [80, 443, 80]
      - equal:
          path: results[0].json.properties.ports.anyOf[0].items.examples
          value: [80, 443]

  - it: 'jsonSchema: sections attach to a case and to a key, as x-crdkit-sections and Markdown'
    set:
      schemaOps:
        - op: jsonSchema
          schemaText: |
            type: map
            properties:
              target: {type: string, markers: false, doc: "Render target."}
              services:
                type: map
                values:
                  switch:
                    by: type
                    cases:
                      a:
                        type: map
                        properties:
                          type: {type: string, markers: false, required: true}
          sections:
            "services.*[type=a]":
              - title: Variables
                doc: Generated.
                columns: [Name, Value]
                rows:
                  - [A_X, "1|2"]
                code: "env:\n  A_X: 1\n"
            target:
              - {title: Note}
    asserts:
      - equal:
          path: results[0].json.definitions["services.*[type=a]"]["x-crdkit-sections"]
          value:
            - title: Variables
              doc: Generated.
              columns: [Name, Value]
              rows:
                - [A_X, "1|2"]
              code: "env:\n  A_X: 1\n"
      - equal:
          path: results[0].json.definitions["services.*[type=a]"].markdownDescription
          value: "**Variables**\n\nGenerated.\n\n| Name | Value |\n| --- | --- |\n| A_X | 1\\|2 |\n\n```yaml\nenv:\n  A_X: 1\n```"
      - equal:
          path: results[0].json.properties.target.markdownDescription
          value: "Render target.\n\n**Note**"
      - equal:
          path: results[0].json.properties.target.description
          value: Render target.
      - lengthEqual:
          path: diag.errors
          count: 0

  - it: 'jsonSchema: a malformed section or an unknown node path is an ERROR and dropped'
    set:
      schemaOps:
        - op: jsonSchema
          schemaText: |
            type: map
            properties:
              a: {type: string, markers: false}
          sections:
            a:
              - {title: ""}
              - {title: Ok}
              - {title: Cols, rows: [[x]]}
              - {title: Width, columns: [A, B], rows: [[x]]}
              - {title: Extra, color: red}
              - plain
            b: [{title: T}]
            c: not-a-list
    asserts:
      - equal:
          path: results[0].json.properties.a["x-crdkit-sections"]
          value:
            - title: Ok
      - equal:
          path: diag.errors
          value:
            - "sections: 'a'[0]: 'title' must be a non-empty string — dropped"
            - "sections: 'a'[2]: 'rows' must be a list and need 'columns' — dropped"
            - "sections: 'a'[3]: row 0 must be a list of 2 strings — dropped"
            - "sections: 'a'[4]: unknown section key 'color' — dropped"
            - "sections: 'a'[5]: a section must be a map — dropped"
            - "sections: 'c' must be a list of sections — dropped"
            - "sections: 'b' names no node — dropped"

  - it: 'jsonSchema: an invalid schema records the self-check ERRORs and returns {}'
    set:
      schemaOps:
        - op: jsonSchema
          schemaText: |
            type: thing
    asserts:
      - equal:
          path: results[0].json
          value: {}
      - equal:
          path: diag.errors
          value:
            - "schema invalid: (root): unknown type 'thing'"

  - it: 'jsonSchema: the README example schema'
    set:
      schemaOps:
        - op: jsonSchema
          title: Example values
          schemaText: |
            type: map
            values: {type: any}                       # the consumer chart's own keys
            properties:
              target:     {type: string, markers: false, required: true, doc: "Render target."}
              renderMode: {type: scalar, markers: false, enum: [validate, deploy], default: deploy}
              services:
                type: map
                keys: {pattern: "^[A-Z0-9_]+$", label: "<ID>"}
                values:
                  switch:
                    by: type
                    cases:
                      greeter:
                        type: map
                        properties:
                          type:     {type: scalar, markers: false, required: true}
                          enabled:  {type: bool, markers: false, default: true}
                          greeting: {type: string, doc: "File content."}
                          ports:    {type: list, items: {type: int}}
                      environment:
                        type: map
                        properties:
                          type:     {type: scalar, markers: false, required: true}
                          enabled:  {type: bool, markers: false, default: true}
                          environment: {type: map, keys: {pattern: "^[A-Z]+$"}, values: {type: scalar}}
          example:
            target: prod
            services:
              APP: {type: greeter, greeting: hi, ports: [80]}
              VARS: {type: environment, environment: {A: x}}
          sections:
            "services.*[type=greeter]":
              - {title: Generated variables, columns: [Variable, Value], rows: [[APP_GREETER, APP]]}
    asserts:
      - matchSnapshot:
          path: results[0].text

  - it: 'document: json returns the JSON Schema text'
    set:
      schemaOps:
        - op: document
          format: json
          title: Doc
          schemaText: "type: map\nproperties:\n  target: {type: string}\n"
          example: {target: prod}
    asserts:
      - matchRegex:
          path: results[0].text
          pattern: '^\{\n  "\$schema": "http://json-schema.org/draft-07/schema#"'
      - matchRegex:
          path: results[0].text
          pattern: '"title": "Doc"'
      - matchRegex:
          path: results[0].text
          pattern: '"prod"'
      - equal:
          path: diag.errors
          value: []

  - it: 'document: html returns the viewer page embedding the same JSON'
    set:
      schemaOps:
        - op: document
          format: html
          title: Doc
          schemaText: "type: map\nproperties:\n  target: {type: string}\n"
    asserts:
      - matchRegex:
          path: results[0].text
          pattern: '^<!doctype html>'
      - matchRegex:
          path: results[0].text
          pattern: 'id="crdkit-schema">\{\n  "\$schema"'
      - matchRegex:
          path: results[0].text
          pattern: '"title": "Doc"'

  - it: 'document: md returns the Markdown reference with the HTML link'
    set:
      schemaOps:
        - op: document
          format: md
          title: Doc
          htmlLink: "VALUES.html"
          schemaText: "type: map\nproperties:\n  target: {type: string}\n"
    asserts:
      - matchRegex:
          path: results[0].text
          pattern: '^# Doc\n'
      - matchRegex:
          path: results[0].text
          pattern: 'VALUES\.html'
      - matchRegex:
          path: results[0].text
          pattern: '\| `target` \|'

  - it: 'document: an unknown format records an ERROR and renders nothing'
    set:
      schemaOps:
        - op: document
          format: pdf
          schemaText: "type: map\n"
    asserts:
      - equal:
          path: results[0].text
          value: ""
      - equal:
          path: diag.errors
          value:
            - "crdkit.schema.document: unknown format 'pdf' (json, html or md) — nothing rendered"

  - it: 'document: an invalid schema records the self-check ERRORs in every format'
    set:
      schemaOps:
        - op: document
          format: json
          schemaText: "type: nonsense\n"
    asserts:
      - matchRegex:
          path: results[0].text
          pattern: '^\{\}\s*$'
      - matchRegex:
          path: diag.errors[0]
          pattern: '^schema invalid'

  - it: 'jsonSchema: id becomes the root $id'
    set:
      schemaOps:
        - op: jsonSchema
          id: "https://example.com/lib/v1.2.3/input.schema.json"
          schemaText: "type: map\nproperties:\n  target: {type: string}\n"
    asserts:
      - equal:
          path: results[0].json["$id"]
          value: "https://example.com/lib/v1.2.3/input.schema.json"
      - equal:
          path: diag.errors
          value: []

  - it: 'jsonSchema: no id and an empty id emit no $id'
    set:
      schemaOps:
        - op: jsonSchema
          schemaText: "type: map\n"
        - op: jsonSchema
          id: ""
          schemaText: "type: map\n"
    asserts:
      - notMatchRegex:
          path: results[0].text
          pattern: '\$id'
      - notMatchRegex:
          path: results[1].text
          pattern: '\$id'
      - equal:
          path: diag.errors
          value: []

  - it: 'jsonSchema: a non-string id records an ERROR and is ignored'
    set:
      schemaOps:
        - op: jsonSchema
          id: 5
          schemaText: "type: map\n"
    asserts:
      - notMatchRegex:
          path: results[0].text
          pattern: '\$id'
      - equal:
          path: diag.errors
          value:
            - "crdkit.schema.jsonSchema: 'id' must be a string — ignored"

  - it: 'document: id reaches the JSON, the page and the Markdown'
    set:
      schemaOps:
        - op: document
          format: json
          id: "https://example.com/v1/input.schema.json"
          schemaText: "type: map\n"
        - op: document
          format: html
          id: "https://example.com/v1/input.schema.json"
          schemaText: "type: map\n"
        - op: document
          format: md
          title: Doc
          id: "https://example.com/v1/input.schema.json"
          schemaText: "type: map\nproperties:\n  target: {type: string}\n"
    asserts:
      - matchRegex:
          path: results[0].text
          pattern: '"\$id": "https://example.com/v1/input.schema.json"'
      - matchRegex:
          path: results[1].text
          pattern: 'id="crdkit-schema">\{\n  "\$id": "https://example.com/v1/input.schema.json"'
      - matchRegex:
          path: results[2].text
          pattern: '# Doc\n\n\*\*Editor support\*\*[^\n]*\n\n```yaml\n# yaml-language-server: \$schema=https://example.com/v1/input.schema.json\n```\n\n```yaml\ntarget:'

  - it: 'docs: without an $id there is no Editor support block'
    set:
      schemaOps:
        - op: docs
          title: Doc
          schemaText: "type: map\nproperties:\n  target: {type: string}\n"
    asserts:
      - notMatchRegex:
          path: results[0].text
          pattern: 'Editor support|yaml-language-server'
