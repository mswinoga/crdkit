suite: crdkit values schema
templates:
  - schema_test.yaml
tests:

  # --- self-check ---

  - it: a valid schema passes the self-check
    set:
      schemaOps:
        - op: check
          schema:
            type: map
            properties:
              name: {type: string, required: true, doc: "Name."}
              tags: {type: list, items: {type: scalar}}
              extra: {type: map, values: {type: any}, keys: {pattern: "^[a-z]+$"}}
              host: {type: scalar, tokens: true}
    asserts:
      - equal:
          path: results[0].ok
          value: "true"
      - lengthEqual:
          path: diag.errors
          count: 0

  - it: every self-check rule records its own ERROR and the check fails
    set:
      schemaOps:
        - op: check
          schema:
            type: map
            properties:
              a: {type: thing}
              b: {type: map, enum: [a]}
              c: {type: date}
              d: {type: map, tokens: true}
              e: {type: list, tokens: true, items: {type: scalar, tokens: true}}
              f: {type: scalar, tokens: true, markers: false}
              g: {type: scalar, default: x, required: true}
              h: {type: scalar, requried: true}
              i: {type: scalar, enum: a}
              j: {type: map, keys: {}}
              o: {type: map, values: {type: any}, keys: {pattern: "^[A-Z]+$", label: 5}}
              p: {type: map, values: {type: any}, keys: {pattern: "^[A-Z]+$", label: "<ID>"}}
              k: "not-a-node"
              l: {type: scalar, required: "yes"}
              m: {kind: scalar}
              n: {type: int, items: {type: any}}
    asserts:
      - equal:
          path: results[0].ok
          value: ""
      - equal:
          path: diag.errors
          value:
            - "schema invalid: properties.a: unknown type 'thing'"
            - "schema invalid: properties.b: 'enum' does not apply to type 'map'"
            - "schema invalid: properties.c: unknown type 'date'"
            - "schema invalid: properties.d: 'tokens' does not apply to type 'map'"
            - "schema invalid: properties.e.items: 'tokens: true' below another 'tokens: true'"
            - "schema invalid: properties.f: 'tokens: true' and 'markers: false' exclude each other"
            - "schema invalid: properties.g: 'default' and 'required: true' exclude each other"
            - "schema invalid: properties.h: unknown schema key 'requried'"
            - "schema invalid: properties.i: 'enum' must be a list"
            - "schema invalid: properties.j: 'keys' must be {pattern: <regex>}"
            - "schema invalid: properties.k: node must be a map"
            - "schema invalid: properties.l: 'required' must be a bool"
            - "schema invalid: properties.m: unknown schema key 'kind'"
            - "schema invalid: properties.m: unknown type ''"
            - "schema invalid: properties.n: 'items' does not apply to type 'int'"
            - "schema invalid: properties.o: 'keys.label' must be a string"

  - it: a switch case must declare the switch key as a static scalar
    set:
      schemaOps:
        - op: check
          schema:
            type: map
            values:
              switch:
                by: type
                cases:
                  good:
                    type: map
                    properties:
                      type: {type: scalar, markers: false}
                  bad:
                    type: map
                    properties:
                      type: {type: scalar}
                  missing:
                    type: map
    asserts:
      - equal:
          path: diag.errors
          value:
            - "schema invalid: values: case 'bad' must declare 'type' as a scalar type with 'markers: false'"
            - "schema invalid: values: case 'missing' must declare 'type' as a scalar type with 'markers: false'"

  - it: a schema that failed to parse is reported once, however often it is checked
    set:
      schemaOps:
        - op: check
          schema: {Error: "error converting YAML to JSON: yaml: line 2"}
        - op: check
          schema: {Error: "error converting YAML to JSON: yaml: line 2"}
    asserts:
      - equal:
          path: diag.errors
          value:
            - "schema invalid: (root): does not parse: error converting YAML to JSON: yaml: line 2"

  - it: an invalid schema skips validation and returns the values unchanged
    set:
      schemaOps:
        - op: validate
          schema: {type: map, properties: {a: {type: bogus}}, values: {type: scalar}}
          values: {a: 1, b: [x]}
    asserts:
      - equal:
          path: results[0].value
          value: {a: 1, b: [x]}
      - lengthEqual:
          path: diag.warnings
          count: 0

  # --- types ---

  - it: values matching every type pass through unchanged, with no diagnostics
    set:
      schemaOps:
        - op: validate
          schema:
            type: map
            properties:
              name: {type: string}
              count: {type: int}
              ratio: {type: number}
              flag: {type: bool}
              tags: {type: list, items: {type: string}}
              labels: {type: map, values: {type: any}}
              blob: {type: any}
          values:
            name: app
            count: 3
            ratio: 0.5
            flag: true
            tags: [a, b]
            labels: {x: {y: [1]}}
            blob: [1, {z: 2}]
    asserts:
      - equal:
          path: results[0].value
          value:
            name: app
            count: 3
            ratio: 0.5
            flag: true
            tags: [a, b]
            labels: {x: {y: [1]}}
            blob: [1, {z: 2}]
      - lengthEqual:
          path: diag.errors
          count: 0
      - lengthEqual:
          path: diag.warnings
          count: 0

  - it: type scalar accepts a string, an int and a bool
    set:
      schemaOps:
        - op: validate
          schema:
            type: map
            properties:
              s: {type: scalar}
              i: {type: scalar}
              b: {type: scalar}
          values: {s: text, i: 3, b: false}
    asserts:
      - equal:
          path: results[0].value
          value: {s: text, i: 3, b: false}
      - lengthEqual:
          path: diag.errors
          count: 0
      - lengthEqual:
          path: diag.warnings
          count: 0

  - it: a shape mismatch is a WARNING and the node is dropped
    set:
      schemaOps:
        - op: validate
          schema:
            type: map
            properties:
              m: {type: map}
              l: {type: list, tokens: false}
              s: {type: scalar}
              keep: {type: scalar}
          values: {m: "x", l: {a: 1}, s: [1], keep: ok}
    asserts:
      - equal:
          path: results[0].value
          value: {keep: ok}
      - equal:
          path: diag.warnings
          value:
            - "'l' must be a list — ignored"
            - "'m' must be a map — ignored"
            - "'s' must be a scalar — ignored"
      - lengthEqual:
          path: diag.errors
          count: 0

  - it: a root value of the wrong shape comes back as an empty map
    set:
      schemaOps:
        - op: validate
          schema: {type: map}
          values: "not-a-map"
          path: application
    asserts:
      - equal:
          path: results[0].value
          value: {}
      - equal:
          path: diag.warnings
          value:
            - "'application' must be a map — ignored"

  - it: an unknown key is a WARNING with its full path and is dropped; a map with "values" accepts every other key
    set:
      schemaOps:
        - op: validate
          schema:
            type: map
            properties:
              application:
                type: map
                properties:
                  services:
                    type: map
                    values:
                      type: map
                      properties:
                        greeting: {type: scalar}
            values: {type: any}
          values:
            global: {x: 1}
            application:
              services:
                APP: {greting: hi, greeting: hello}
                "a.b": {other: 1}
              extra: true
    asserts:
      - equal:
          path: results[0].value
          value:
            global: {x: 1}
            application:
              services:
                APP: {greeting: hello}
                "a.b": {}
      - equal:
          path: diag.warnings
          value:
            - "'application.extra' is not a known key — ignored"
            - "'application.services.APP.greting' is not a known key — ignored"
            - "'application.services[\"a.b\"].other' is not a known key — ignored"

  - it: a key failing "keys.pattern" is an ERROR and is dropped with its value
    set:
      schemaOps:
        - op: validate
          schema:
            type: map
            keys: {pattern: "^[A-Z][A-Z0-9_]*$"}
            values: {type: scalar}
          values: {GOOD: 1, bad: 2}
          path: environment
    asserts:
      - equal:
          path: results[0].value
          value: {GOOD: 1}
      - equal:
          path: diag.errors
          value:
            - "key 'environment.bad' must match '^[A-Z][A-Z0-9_]*$' — ignored"
      - equal:
          path: diag.warnings
          value: []

  - it: list elements are validated with indexed paths; a failing element is dropped
    set:
      schemaOps:
        - op: validate
          schema:
            type: map
            properties:
              ports: {type: list, items: {type: int}}
          values: {ports: [80, "http", 443]}
    asserts:
      - equal:
          path: results[0].value
          value: {ports: [80, 443]}
      - equal:
          path: diag.errors
          value:
            - "'ports[1]' must be of type 'int' — ignored"

  # --- scalar rules ---

  - it: type, enum, pattern and markers violations are ERRORs and the value is dropped
    set:
      schemaOps:
        - op: validate
          schema:
            type: map
            properties:
              enabled: {type: bool}
              count: {type: int}
              ratio: {type: number}
              name: {type: string}
              mode: {type: scalar, enum: [validate, deploy]}
              id: {type: scalar, pattern: "^[a-z]+$"}
              type: {type: scalar, markers: false}
          values:
            enabled: "false"
            count: 1.5
            ratio: "0.5"
            name: 5
            mode: deploi
            id: ABC
            type: "@KIND@"
    asserts:
      - equal:
          path: results[0].value
          value: {}
      - equal:
          path: diag.errors
          value:
            - "'count' must be of type 'int' — ignored"
            - "'enabled' must be of type 'bool' — ignored"
            - "'id' must match '^[a-z]+$' — ignored"
            - "'mode' must be one of 'validate', 'deploy' — ignored"
            - "'name' must be of type 'string' — ignored"
            - "'ratio' must be of type 'number' — ignored"
            - "'type' must not contain '@NAME@' markers — ignored"

  - it: a string holding markers skips type/enum/pattern (the value pass checks it)
    set:
      schemaOps:
        - op: validate
          schema:
            type: map
            properties:
              count: {type: int, enum: [1, 2]}
          values: {count: "@COUNT@"}
    asserts:
      - equal:
          path: results[0].value
          value: {count: "@COUNT@"}
      - lengthEqual:
          path: diag.errors
          count: 0

  - it: 'a token declaration in a "tokens: true" field is kept as written; a plain value is checked as usual'
    set:
      schemaOps:
        - op: validate
          schema:
            type: map
            properties:
              greeting: {type: string, tokens: true}
              hosts: {type: list, tokens: true, items: {type: scalar}}
              plain: {type: int, tokens: true}
          values:
            greeting: {default: hi, prod: hello}
            hosts: {default: [a], prod: [a, b]}
            plain: "x"
    asserts:
      - equal:
          path: results[0].value
          value:
            greeting: {default: hi, prod: hello}
            hosts: {default: [a], prod: [a, b]}
      - equal:
          path: diag.errors
          value:
            - "'plain' must be of type 'int' — ignored"

  # --- required / defaults ---

  - it: a missing required key is an ERROR; a present but dropped one is not reported twice
    set:
      schemaOps:
        - op: validate
          schema:
            type: map
            properties:
              target: {type: scalar, required: true}
              name: {type: string, required: true}
          values: {name: 5}
    asserts:
      - equal:
          path: diag.errors
          value:
            - "'name' must be of type 'string' — ignored"
            - "'target' is required"

  - it: a default is applied when the key is absent, never over a present key, and also after a dropped value
    set:
      schemaOps:
        - op: validate
          schema:
            type: map
            properties:
              enabled: {type: bool, default: true}
              mode: {type: scalar, default: deploy}
              level: {type: int, default: 1}
              greeting: {type: scalar, tokens: true, default: {default: hi, prod: hello}}
          values: {mode: validate, enabled: "no"}
    asserts:
      - equal:
          path: results[0].value
          value:
            enabled: true
            mode: validate
            level: 1
            greeting: {default: hi, prod: hello}
      - equal:
          path: diag.errors
          value:
            - "'enabled' must be of type 'bool' — ignored"

  - it: a null value counts as absent
    set:
      schemaOps:
        - op: validate
          schema:
            type: map
            properties:
              mode: {type: scalar, default: deploy}
              target: {type: scalar, required: true}
          values: {mode: null, target: null}
    asserts:
      - equal:
          path: results[0].value
          value: {mode: deploy}
      - equal:
          path: diag.errors
          value:
            - "'target' is required"

  # --- switch ---

  - it: a switch validates a map against the case its key selects; unknown or missing values are WARNINGs and the node is dropped
    set:
      schemaOps:
        - op: validate
          path: services
          schema:
            type: map
            values:
              switch:
                by: type
                cases:
                  greeter:
                    type: map
                    properties:
                      type: {type: scalar, markers: false, required: true}
                      greeting: {type: scalar}
                  leader:
                    type: map
                    properties:
                      type: {type: scalar, markers: false, required: true}
                      greeter: {type: scalar}
          values:
            A: {type: greeter, greeting: hi, greeter: B}
            B: {type: leader, greeter: A}
            C: {type: other}
            D: {greeting: hi}
            E: "x"
    asserts:
      - equal:
          path: results[0].value
          value:
            A: {type: greeter, greeting: hi}
            B: {type: leader, greeter: A}
      - equal:
          path: diag.warnings
          value:
            - "'services.A.greeter' is not a known key — ignored"
            - "'services.C.type' has unknown value 'other' — ignored"
            - "'services.D' has no 'type' — ignored"
            - "'services.E' must be a map — ignored"

  # --- value pass (per-target values) ---

  - it: 'a per-target value valid for the target records nothing'
    set:
      target: prod
      schemaOps:
        - op: validateValues
          schema:
            type: map
            properties:
              greeting: {type: string, tokens: true}
              count: {type: int, tokens: true}
          values:
            greeting: {default: hi, prod: hello}
            count: {default: 1, prod: 2}
    asserts:
      - lengthEqual:
          path: diag.errors
          count: 0
      - equal:
          path: seen
          value: {"count|prod": true, "greeting|prod": true}

  - it: 'a per-target value of the wrong type or outside the enum is an ERROR naming the target'
    set:
      target: prod
      schemaOps:
        - op: validateValues
          schema:
            type: map
            properties:
              count: {type: int, tokens: true}
              mode: {type: scalar, enum: [a, b], tokens: true}
              id: {type: scalar, pattern: "^[a-z]+$", tokens: true}
          values:
            count: {default: 1, prod: many}
            mode: {default: a, prod: c}
            id: {prod: X1}
    asserts:
      - equal:
          path: diag.errors
          value:
            - "'count' for target 'prod' must be of type 'int' — got 'many'"
            - "'id' for target 'prod' must match '^[a-z]+$' — got 'X1'"
            - "'mode' for target 'prod' must be one of 'a', 'b' — got 'c'"

  - it: 'type checks use "parses as": a numeric string and a marker-built number pass type int, a non-bool string fails bool'
    set:
      target: prod
      tokens:
        BASE: "4"
      schemaOps:
        - op: validateValues
          schema:
            type: map
            properties:
              a: {type: int, tokens: true}
              b: {type: int, tokens: true}
              c: {type: bool, tokens: true}
              d: {type: bool, tokens: true}
              e: {type: number, tokens: true}
          values:
            a: {default: "5"}
            b: {default: "@BASE@0"}
            c: {default: "true"}
            d: {default: "yes"}
            e: {default: "1.5e3"}
    asserts:
      - equal:
          path: diag.errors
          value:
            - "'d' for target 'prod' must be of type 'bool' — got 'yes'"

  - it: 'a plain string with markers is substituted for the target and checked'
    set:
      target: prod
      tokens:
        GOOD: "3"
        BAD: "x"
      schemaOps:
        - op: validateValues
          schema:
            type: map
            properties:
              good: {type: int}
              bad: {type: int}
              ports: {type: list, items: {type: int}}
          values: {good: "@GOOD@", bad: "@BAD@", ports: [80, "@BAD@"]}
    asserts:
      - equal:
          path: diag.errors
          value:
            - "'bad' for target 'prod' must be of type 'int' — got 'x'"
            - "'ports[1]' for target 'prod' must be of type 'int' — got 'x'"

  - it: 'a per-target list is checked as a list, element by element'
    set:
      target: prod
      schemaOps:
        - op: validateValues
          schema:
            type: map
            properties:
              hosts: {type: list, tokens: true, items: {type: int}}
              other: {type: list, tokens: true}
          values:
            hosts: {default: [1], prod: [1, b]}
            other: {prod: "x"}
    asserts:
      - equal:
          path: diag.errors
          value:
            - "'hosts[1]' for target 'prod' must be of type 'int' — got 'b'"
            - "'other' for target 'prod' must be a list"

  - it: 'a failed resolution reports only its own ERROR, no schema ERROR on top'
    set:
      target: prod
      schemaOps:
        - op: validateValues
          schema:
            type: map
            properties:
              count: {type: int, tokens: true}
              typo: {type: int}
          values:
            count: {qa: 1}
            typo: "@MISSING@"
    asserts:
      - equal:
          path: diag.errors
          value:
            - "no value found for 'count' — target chain exhausted at 'prod' starting from 'prod'"

  - it: 'the value pass follows a switch into the selected case'
    set:
      target: prod
      schemaOps:
        - op: validateValues
          path: services
          schema:
            type: map
            values:
              switch:
                by: type
                cases:
                  greeter:
                    type: map
                    properties:
                      type: {type: scalar, markers: false}
                      greeting: {type: int, tokens: true}
          values:
            A: {type: greeter, greeting: {prod: hi}}
            B: {type: unknown, greeting: {prod: hi}}
    asserts:
      - equal:
          path: diag.errors
          value:
            - "'services.A.greeting' for target 'prod' must be of type 'int' — got 'hi'"

  - it: 'the same path and target is checked once across value-pass and single-field calls'
    set:
      target: prod
      schemaOps:
        - op: validateValues
          schema: {type: map, properties: {count: {type: int, tokens: true}}}
          values: {count: {prod: x}}
        - op: validateValues
          schema: {type: map, properties: {count: {type: int, tokens: true}}}
          values: {count: {prod: x}}
        - op: value
          node: {type: int, tokens: true}
          def: {prod: x}
          path: count
    asserts:
      - equal:
          path: diag.errors
          value:
            - "'count' for target 'prod' must be of type 'int' — got 'x'"
      - equal:
          path: results[2].value
          value: x

  - it: 'a single field resolves and is checked for an explicit target other than the render target'
    set:
      target: qa
      parentTargetMap:
        qap1: qa
      schemaOps:
        - op: value
          node: {type: int, tokens: true}
          def: {qa: 1, qap1: x}
          path: application.services.APP.count
          target: qap1
        - op: value
          node: {type: int, tokens: true}
          def: {qa: 1, qap1: x}
          path: application.services.APP.count
        - op: value
          node: {type: int}
          def: 7
          path: application.services.APP.static
    asserts:
      - equal:
          path: results[0].value
          value: x
      - equal:
          path: results[1].value
          value: 1
      - equal:
          path: results[2].value
          value: 7
      - equal:
          path: diag.errors
          value:
            - "'application.services.APP.count' for target 'qap1' must be of type 'int' — got 'x'"

  # --- locating nodes ---

  - it: 'crdkit.schema.node follows properties, values, list indices and switches'
    set:
      schemaOps:
        - op: node
          schema: &services
            type: map
            properties:
              services:
                type: map
                values:
                  switch:
                    by: type
                    cases:
                      greeter:
                        type: map
                        properties:
                          type: {type: scalar, markers: false}
                          greeting: {type: scalar, tokens: true}
                          ports: {type: list, items: {type: int}}
          values: &servicesValues
            services:
              A: {type: greeter}
              B: {type: other}
          keys: [services, A, greeting]
        - op: node
          schema: *services
          values: *servicesValues
          keys: [services, A, ports, 0]
        - op: node
          schema: *services
          values: *servicesValues
          keys: [services, A]
        - op: node
          schema: *services
          values: *servicesValues
          keys: [services, B, greeting]
        - op: node
          schema: *services
          values: *servicesValues
          keys: [services, A, unknown]
    asserts:
      - equal:
          path: results[0]
          value: {found: true, value: {type: scalar, tokens: true}}
      - equal:
          path: results[1]
          value: {found: true, value: {type: int, tokens: false}}
      - equal:
          path: results[2].value.properties.type
          value: {type: scalar, markers: false}
      - equal:
          path: results[3].found
          value: false
      - equal:
          path: results[4].found
          value: false

  # --- docs ---

  - it: 'crdkit.schema.docs renders one table for the root and one per switch case'
    set:
      schemaOps:
        - op: docs
          title: Example values
          schema:
            type: map
            values: {type: any, doc: "The consumer chart's own keys."}
            properties:
              target: {type: string, markers: false, required: true, doc: "Render target."}
              renderMode: {type: string, markers: false, enum: [validate, deploy], default: deploy, doc: "Mode | see README."}
              services:
                type: map
                doc: "Services by ID."
                values:
                  switch:
                    by: type
                    cases:
                      greeter:
                        type: map
                        properties:
                          type: {type: string, markers: false, required: true}
                          greeting: {type: string, tokens: true, doc: "File\ncontent."}
                          ports: {type: list, items: {type: int}}
                      environment:
                        type: map
                        properties:
                          type: {type: string, markers: false, required: true}
                          environment: {type: map, keys: {pattern: "^[A-Z]+$"}, values: {type: scalar, tokens: true}}
    asserts:
      - matchSnapshot:
          path: results[0].text
      - matchRegex:
          path: results[0].text
          pattern: "\\| `renderMode` \\| string, one of: validate, deploy \\| no \\| `\"deploy\"` \\|  \\| Mode \\\\\\| see README\\. \\|"
      - matchRegex:
          path: results[0].text
          pattern: "## `services.<key>` with `type: greeter`"
      - matchRegex:
          path: results[0].text
          pattern: "\\| `services.<key>.greeting` \\| string \\| yes \\|  \\|  \\| File content\\. \\|"

  - it: 'a schema with only a switch at the root renders the case tables'
    set:
      schemaOps:
        - op: docs
          schema:
            switch:
              by: flavor
              cases:
                a:
                  type: map
                  properties:
                    flavor: {type: scalar, markers: false}
    asserts:
      - equal:
          path: results[0].text
          value: |
            # Values

            ## (root) with `flavor: a`

            | Key | Type | Per target | Default | Required | Description |
            | --- | --- | --- | --- | --- | --- |
            | `flavor` | scalar | no |  |  |  |

  # --- omitted DSL keys ---

  - it: 'crdkit.schema.path spells keys dotted, keys with "." in brackets, numbers as indices'
    set:
      schemaOps:
        - op: path
          keys: [application, services, APP, greeting]
        - op: path
          keys: [a.b, c]
        - op: path
          keys: [hosts, 0, "1"]
          path: services.APP
        - op: path
          keys: []
    asserts:
      - equal:
          path: results
          value:
            - {text: application.services.APP.greeting}
            - {text: '["a.b"].c'}
            - {text: 'services.APP.hosts[0].1'}
            - {text: ""}

  - it: 'tokens omitted = per-target on scalars and lists, static on markers:false scalars, never below a per-target node'
    set:
      target: prod
      schemaOps:
        - op: validate
          schema: &defaults
            type: map
            properties:
              greeting: {type: string}
              hosts: {type: list, items: {type: int}}
              type: {type: scalar, markers: false}
              pinned: {type: scalar, tokens: false}
          values: &defaultsValues
            greeting: {default: hi, prod: hello}
            hosts: {default: [1], prod: [2, x]}
            type: {prod: a}
            pinned: {prod: a}
        - op: validateValues
          schema: *defaults
          values: *defaultsValues
    asserts:
      - equal:
          path: results[0].value
          value:
            greeting: {default: hi, prod: hello}
            hosts: {default: [1], prod: [2, x]}
      - equal:
          path: diag.warnings
          value:
            - "'pinned' must be a scalar — ignored"
            - "'type' must be a scalar — ignored"
      - equal:
          path: diag.errors
          value:
            - "'hosts[1]' for target 'prod' must be of type 'int' — got 'x'"

  - it: 'an explicit tokens:true below an implicitly per-target list is a nested-tokens ERROR'
    set:
      schemaOps:
        - op: check
          schema:
            type: map
            properties:
              hosts: {type: list, items: {type: scalar, tokens: true}}
              static: {type: list, tokens: false, items: {type: scalar, tokens: true}}
    asserts:
      - equal:
          path: diag.errors
          value:
            - "schema invalid: properties.hosts.items: 'tokens: true' below another 'tokens: true'"

  - it: 'type omitted is a self-check ERROR except on a switch node; a closed map warns'
    set:
      schemaOps:
        - op: check
          schema: {type: map, properties: {a: {doc: "no type"}}}
        - op: validate
          schema: {type: map, properties: {any: {type: scalar}}}
          values: {any: 5, other: 1}
    asserts:
      - equal:
          path: results[1].value
          value: {any: 5}
      - equal:
          path: diag.errors
          value:
            - "schema invalid: properties.a: unknown type ''"
      - equal:
          path: diag.warnings
          value:
            - "'other' is not a known key — ignored"

  - it: 'the docs Per target column shows the effective default'
    set:
      schemaOps:
        - op: docs
          schema:
            type: map
            properties:
              greeting: {type: scalar}
              hosts: {type: list, items: {type: scalar}}
              type: {type: scalar, markers: false}
              pinned: {type: scalar, tokens: false}
    asserts:
      - equal:
          path: results[0].text
          value: |
            # Values

            | Key | Type | Per target | Default | Required | Description |
            | --- | --- | --- | --- | --- | --- |
            | `greeting` | scalar | yes |  |  |  |
            | `hosts` | list | yes |  |  |  |
            | `hosts[]` | scalar | markers |  |  |  |
            | `pinned` | scalar | markers |  |  |  |
            | `type` | scalar | no |  |  |  |
