suite: crdkit tokens
templates:
  - cr.yaml
values:
  - ../fixtures/base.yaml
tests:
  - it: 'C-11: resolves a simple scalar token'
    set:
      target: prod-01
      tokens:
        GREETING: hello
      ops:
        - put:
            - structure
          value:
            message: '@GREETING@'
    asserts:
      - equal:
          path: structure.message
          value: hello
  - it: 'C-11: ''default'' is a hardcoded crdkit-level fallback, resolving unconditionally for ANY target — no taxonomy needed'
    set:
      target: some-unrecognized-target-with-no-taxonomy-hop-at-all
      tokens:
        DB_HOST:
          default: db.internal
      ops:
        - tokenValue: DB_HOST
          target: some-unrecognized-target-with-no-taxonomy-hop-at-all
          at:
            - crossResolved
            - some-unrecognized-target-with-no-taxonomy-hop-at-all
            - DB_HOST
    asserts:
      - equal:
          path: crossResolved.some-unrecognized-target-with-no-taxonomy-hop-at-all.DB_HOST
          value: db.internal
      - notExists:
          path: diagnostics.error
  - it: 'C-12: ''default'' is checked AFTER the parentTarget walk, not before — a more specific taxonomy-reached value always wins over it'
    set:
      target: prod-01
      tokens:
        REGION:
          default: generic-region
          PROD: prod-specific-region
      ladder:
        prod-01: PROD
      ops:
        - put:
            - structure
          value:
            region: '@REGION@'
    asserts:
      - equal:
          path: structure.region
          value: prod-specific-region
  - it: 'C-11: a token referencing another token (one level) resolves correctly'
    set:
      target: prod-01
      tokens:
        A: foo
        B: '@A@-bar'
      ops:
        - put:
            - structure
          value:
            message: '@B@'
    asserts:
      - equal:
          path: structure.message
          value: foo-bar
  - it: 'C-11: a token referencing a chain of 3+ tokens resolves via the iterative resolver'
    set:
      target: prod-01
      tokens:
        T1: one
        T2: '@T1@-two'
        T3: '@T2@-three'
      ops:
        - put:
            - structure
          value:
            message: '@T3@'
    asserts:
      - equal:
          path: structure.message
          value: one-two-three
  - it: 'C-12: a direct two-token @ref@ cycle records an ERROR mentioning a cycle, and does not hang'
    set:
      target: prod-01
      tokens:
        A: '@B@'
        B: '@A@'
      ops:
        - put:
            - structure
          value:
            x: '@A@'
    asserts:
      - exists:
          path: diagnostics.error[?(@ =~ /cycle/)]
  - it: 'C-17: @AT@ resolves to a literal @ character, applied only on the final substitution pass'
    set:
      target: prod-01
      ops:
        - put:
            - structure
          value:
            email: user@AT@example.com
    asserts:
      - equal:
          path: structure.email
          value: user@example.com
  - it: 'C-17: @AT@ escapes text the marker pattern would otherwise read as a marker'
    set:
      target: prod-01
      ops:
        - put:
            - structure
          value:
            email: '@AT@example.com@AT@'
    asserts:
      - equal:
          path: structure.email
          value: '@example.com@'
      - notExists:
          path: diagnostics.warning
  - it: 'C-11: a dotted token name resolves through its ''@A.b@'' marker'
    set:
      target: prod-01
      tokens:
        A.b: hello
      ops:
        - put:
            - structure
          value:
            message: '@A.b@ world'
    asserts:
      - equal:
          path: structure.message
          value: hello world
      - notExists:
          path: diagnostics.error
  - it: 'C-11: dotted token names chain like any other name, per target'
    set:
      target: prod-01
      tokens:
        SVC.host: h1
        SVC.port:
          default: "80"
          prod-01: "8080"
        SVC.url: http://@SVC.host@:@SVC.port@
      ops:
        - put:
            - structure
          value:
            url: '@SVC.url@'
    asserts:
      - equal:
          path: structure.url
          value: http://h1:8080
  - it: 'C-11: a dotted marker naming no token is left untouched'
    set:
      target: prod-01
      ops:
        - put:
            - structure
          value:
            email: '@example.com@'
    asserts:
      - equal:
          path: structure.email
          value: '@example.com@'
  - it: 'C-13: a declared-but-never-used token produces no diagnostic at all, even if it would error if resolved'
    set:
      target: prod-01
      tokens:
        BROKEN: {}
      ops: []
    asserts:
      - notExists:
          path: diagnostics.error
      - notExists:
          path: diagnostics.warning
  - it: 'C-13: an entirely unset target produces NO diagnostic when nothing is ever resolved against it — no proactive check anymore'
    set:
      target: ""
      tokens: {}
      ops: []
    asserts:
      - notExists:
          path: diagnostics.error
  - it: 'C-16: resolving a name that was never declared at all (e.g. via crossTargets/crdkit.token.value directly) records an ERROR, not a fail()'
    set:
      target: prod-01
      ops:
        - tokenValue: NEVER_DECLARED
          target: prod-01
          at:
            - crossResolved
            - prod-01
            - NEVER_DECLARED
    asserts:
      - exists:
          path: diagnostics.error[?(@ =~ /unknown\ token\ 'NEVER_DECLARED'\ referenced/)]
      - equal:
          path: crossResolved.prod-01.NEVER_DECLARED
          value: ""
  - it: 'C-33: a dedicated attribute (literal key equal to the exact target) resolves directly, at any granularity'
    set:
      target: prod-01
      tokens:
        COLOR:
          prod-01: red
          blue-thing: blue
      ops:
        - put:
            - structure
          value:
            color: '@COLOR@'
    asserts:
      - equal:
          path: structure.color
          value: red
  - it: 'C-33: a dedicated attribute works for a bare, unsequenced target too — crdkit doesn''t care about shape'
    set:
      target: staging
      tokens:
        COLOR:
          staging: teal
      ops:
        - put:
            - structure
          value:
            color: '@COLOR@'
    asserts:
      - equal:
          path: structure.color
          value: teal
  - it: 'C-12: no dedicated attribute, no match, no parentTargetMap configured — an honest ERROR, not a silent wrong answer'
    set:
      target: prod-01
      tokens:
        BROKEN:
          qa-01: wrong-target-entirely
      ops:
        - put:
            - structure
          value:
            x: '@BROKEN@'
    asserts:
      - exists:
          path: diagnostics.error[?(@ =~ /no\ value\ found\ for\ 'BROKEN'\ —\ target\ chain\ exhausted\ at\ 'prod\-01'\ starting\ from\ 'prod\-01'/)]
  - it: 'C-18: match: resolves against the full target string — no shape requirement, works for any target'
    set:
      target: canary-thing
      tokens:
        SUBENV:
          match:
            - canary-.*: is-canary
      ops:
        - put:
            - structure
          value:
            subenv: '@SUBENV@'
    asserts:
      - equal:
          path: structure.subenv
          value: is-canary
  - it: 'C-18: match: rule values can reference capture groups from the pattern'
    set:
      target: qam1-05
      tokens:
        PREFIX:
          match:
            - (.+)-[0-9]{2}: $1
      ops:
        - put:
            - structure
          value:
            prefix: '@PREFIX@'
    asserts:
      - equal:
          path: structure.prefix
          value: qam1
  - it: 'C-18: match: first matching rule wins even when a later rule would also match'
    set:
      target: prod-01
      tokens:
        MULTI:
          match:
            - prod-01: first-match
            - prod-[0-9]{2}: second-match-would-also-fit
      ops:
        - put:
            - structure
          value:
            multi: '@MULTI@'
    asserts:
      - equal:
          path: structure.multi
          value: first-match
  - it: 'C-18: match: a numeric rule value is used as its string form — no template error'
    set:
      target: prod-01
      tokens:
        COUNT:
          ALL: 2
          match:
            - prod-01: 6
      ops:
        - put:
            - structure
          value:
            count: '@COUNT@'
    asserts:
      - equal:
          path: structure.count
          value: "6"
  - it: 'C-33: a dedicated attribute wins over a match rule that would also fire — most specific always beats pattern-based'
    set:
      target: prod-01
      tokens:
        HOST:
          prod-01: dedicated-wins
          match:
            - prod-[0-9]{2}: pattern-would-fire-too
      ops:
        - put:
            - structure
          value:
            host: '@HOST@'
    asserts:
      - equal:
          path: structure.host
          value: dedicated-wins
  - it: 'C-12: walks a single escalation hop when the exact target has no dedicated attribute'
    set:
      target: prod-01
      tokens:
        REGION:
          prod: us-east-1
      ladder:
        prod-01: prod
      ops:
        - put:
            - structure
          value:
            region: '@REGION@'
    asserts:
      - equal:
          path: structure.region
          value: us-east-1
  - it: 'C-12: walks multiple escalation hops, caching every rung visited along the way, not just the one where the value was found'
    set:
      target: qam1-01
      tokens:
        REGION2:
          NONPROD: region-nonprod
      ladder:
        qam1-01: qam1
        qam1: QA
        QA: NONPROD
      ops:
        - tokenValue: REGION2
          target: qam1-01
          at:
            - crossResolved
            - qam1-01
            - REGION2
        - tokenValue: REGION2
          target: qam1-01
          at:
            - tv
            - REGION2
            - qam1-01
        - tokenValue: REGION2
          target: qam1
          at:
            - tv
            - REGION2
            - qam1
        - tokenValue: REGION2
          target: QA
          at:
            - tv
            - REGION2
            - QA
        - tokenValue: REGION2
          target: NONPROD
          at:
            - tv
            - REGION2
            - NONPROD
    asserts:
      - equal:
          path: crossResolved.qam1-01.REGION2
          value: region-nonprod
      - equal:
          path: tv["REGION2"]["qam1-01"]
          value: region-nonprod
      - equal:
          path: tv["REGION2"]["qam1"]
          value: region-nonprod
      - equal:
          path: tv["REGION2"]["QA"]
          value: region-nonprod
      - equal:
          path: tv["REGION2"]["NONPROD"]
          value: region-nonprod
  - it: 'C-12: with no parentTargetMap configured, there is NO escalation at all — same as crdkit.noParentTarget'
    set:
      target: prod-01
      tokens:
        REGION:
          prod: us-east-1
      ops:
        - put:
            - structure
          value:
            region: '@REGION@'
    asserts:
      - exists:
          path: diagnostics.error[?(@ =~ /no\ value\ found\ for\ 'REGION'\ —\ target\ chain\ exhausted\ at\ 'prod\-01'\ starting\ from\ 'prod\-01'/)]
  - it: 'C-12: a malformed client escalation map that cycles back on itself is caught as an ERROR, not a hang'
    set:
      target: a
      tokens:
        X:
          unused: never-reached
      ladder:
        a: b
        b: a
      ops:
        - put:
            - structure
          value:
            x: '@X@'
    asserts:
      - exists:
          path: diagnostics.error[?(@ =~ /target\ escalation\ chain\ for\ 'X'\ cycles\ back\ to\ 'a'\ while\ resolving\ from\ 'a'/)]
      - lengthEqual:
          path: diagnostics.error
          count: 1
  - it: 'C-18: match: is evaluated fresh for the exact target even when a broader rung''s cache is already populated from a DIFFERENT target''s walk'
    set:
      target: prod-01
      tokens:
        SPECIAL:
          NONPROD: generic-nonprod
          match:
            - qap1-[0-9]{2}: special-value
      ladder:
        qam1-01: qam1
        qam1: QA
        QA: NONPROD
        qap1-02: qap1
        qap1: QA
      ops:
        - tokenValue: SPECIAL
          target: qam1-01
          at:
            - crossResolved
            - qam1-01
            - SPECIAL
        - tokenValue: SPECIAL
          target: qap1-02
          at:
            - crossResolved
            - qap1-02
            - SPECIAL
        - tokenValue: SPECIAL
          target: QA
          at:
            - tv
            - SPECIAL
            - QA
    asserts:
      - equal:
          path: crossResolved.qam1-01.SPECIAL
          value: generic-nonprod
      - equal:
          path: crossResolved.qap1-02.SPECIAL
          value: special-value
      - equal:
          path: tv["SPECIAL"]["QA"]
          value: generic-nonprod
  - it: 'C-12: the walk supports an arbitrary number of named rungs, not a fixed "family/tier" depth — some branches shorter than others'
    set:
      target: prod-01
      tokens:
        REGION3:
          PROD: us-east-1
      ladder:
        prod-01: prod
        prod: PROD
      ops:
        - put:
            - structure
          value:
            region: '@REGION3@'
    asserts:
      - equal:
          path: structure.region
          value: us-east-1
  - it: 'C-12: a value found via the walk still gets @ref@-chained normally, same as a dedicated attribute or match result'
    set:
      target: qa-01
      tokens:
        HOST_NAME: db1
        DB_HOST:
          QA: '@HOST_NAME@.internal'
      ladder:
        qa-01: qa
        qa: QA
      ops:
        - put:
            - structure
          value:
            dbHost: '@DB_HOST@'
    asserts:
      - equal:
          path: structure.dbHost
          value: db1.internal
  - it: 'C-17: a dict-shaped resolved value comes back as a dict, with every string leaf''s @ref@ markers substituted'
    set:
      target: prod
      tokens:
        DB_HOST: db.internal
        CONFIG:
          default:
            host: '@DB_HOST@'
            port: 5432
      ops:
        - tokenValue: CONFIG
          target: prod
          at:
            - crossResolved
            - prod
            - CONFIG
    asserts:
      - equal:
          path: crossResolved.prod.CONFIG
          value:
            host: db.internal
            port: 5432
  - it: 'C-17: a list-shaped resolved value comes back as a list, with every string element''s @ref@ markers substituted'
    set:
      target: prod
      tokens:
        DB_HOST: db.internal
        HOSTS:
          default:
            - '@DB_HOST@'
            - static-host
      ops:
        - tokenValue: HOSTS
          target: prod
          at:
            - crossResolved
            - prod
            - HOSTS
    asserts:
      - equal:
          path: crossResolved.prod.HOSTS
          value:
            - db.internal
            - static-host
  - it: 'C-17: a non-string scalar value (bool/int/float) resolves to its NATIVE type, not a stringified copy'
    set:
      target: prod
      tokens:
        ENABLED: true
        PORT: 5432
      ops:
        - tokenValue: ENABLED
          target: prod
          at:
            - crossResolved
            - prod
            - ENABLED
        - tokenValue: PORT
          target: prod
          at:
            - crossResolved
            - prod
            - PORT
    asserts:
      - equal:
          path: crossResolved.prod.ENABLED
          value: true
      - equal:
          path: crossResolved.prod.PORT
          value: 5432
  - it: 'C-14: a structured value can still reference a token added later via crdkit.token.add — same lazy-resolution guarantee as a scalar'
    set:
      target: prod
      tokens:
        CONFIG:
          default:
            host: '@DERIVED_HOST@'
      ops:
        - add: DERIVED_HOST
          value: computed.internal
        - tokenValue: CONFIG
          target: prod
          at:
            - crossResolved
            - prod
            - CONFIG
    asserts:
      - equal:
          path: crossResolved.prod.CONFIG
          value:
            host: computed.internal
  - it: 'C-31: crdkit.token.string stringifies a non-string scalar for text embedding'
    set:
      target: prod
      tokens:
        ENABLED: true
      ops:
        - tokenString: ENABLED
          at:
            - stringResolved
            - "0"
          target: prod
    asserts:
      - equal:
          path: stringResolved["0"]
          value: "true"
  - it: 'C-31: crdkit.token.string on a dict returns its JSON, with no diagnostic'
    set:
      target: prod
      tokens:
        CONFIG:
          default:
            host: x
            port: 80
      ops:
        - tokenString: CONFIG
          at:
            - stringResolved
            - "0"
          target: prod
    asserts:
      - equal:
          path: stringResolved["0"]
          value: '{"host":"x","port":80}'
      - notExists:
          path: diagnostics.error
  - it: 'C-31: crdkit.token.string on a list joins its elements with '','''
    set:
      target: prod
      tokens:
        HOSTS:
          default:
            - a
            - b
            - 3
      ops:
        - tokenString: HOSTS
          at:
            - stringResolved
            - "0"
          target: prod
    asserts:
      - equal:
          path: stringResolved["0"]
          value: a,b,3
  - it: 'C-17: a marker to a list token splices its elements joined by '','' (no space)'
    set:
      target: prod
      tokens:
        L:
          default:
            - a
            - b
            - 3
      ops:
        - put:
            - structure
          value:
            x: hosts=@L@
    asserts:
      - equal:
          path: structure.x
          value: hosts=a,b,3
      - notExists:
          path: diagnostics.error
  - it: 'C-11: a structured list element is spliced as JSON'
    set:
      target: prod
      tokens:
        L:
          default:
            - a
            - k: v
            - - 1
              - 2
      ops:
        - put:
            - structure
          value:
            x: '@L@'
    asserts:
      - equal:
          path: structure.x
          value: a,{"k":"v"},[1,2]
  - it: 'C-17: a marker to a dict token splices its JSON'
    set:
      target: prod
      tokens:
        D:
          default:
            k: v
      ops:
        - put:
            - structure
          value:
            x: cfg=@D@
    asserts:
      - equal:
          path: structure.x
          value: cfg={"k":"v"}
      - notExists:
          path: diagnostics.error
  - it: 'C-17: an empty list splices as an empty string'
    set:
      target: prod
      tokens:
        L:
          default: []
      ops:
        - put:
            - structure
          value:
            x: '[@L@]'
    asserts:
      - equal:
          path: structure.x
          value: '[]'
  - it: 'C-11: a per-target list token is resolved for the target before it is spliced, markers in its elements included'
    set:
      target: prod
      tokens:
        HOST: h1
        L:
          default:
            - x
          prod:
            - '@HOST@'
            - b
        URL: hosts=@L@
      ops:
        - put:
            - structure
          value:
            x: '@URL@'
    asserts:
      - equal:
          path: structure.x
          value: hosts=h1,b
  - it: 'C-31: crdkit.tokenDef.string on a structure returns it as text'
    set:
      target: prod
      ops:
        - id: f
          tokenDef:
            default:
              - a
              - b
          at:
            - tokenDefResolved
            - "0"
            - value
          target: prod
        - id: f
          tokenDef:
            default:
              - a
              - b
          at:
            - tokenDefResolved
            - "0"
            - string
          target: prod
          string: true
    asserts:
      - equal:
          path: tokenDefResolved["0"].string
          value: a,b
      - notExists:
          path: diagnostics.error
  - it: 'C-31: crdkit.tokenDef.value resolves an ad-hoc structure using the same escalation rules as a real token, without registering it'
    set:
      target: prod
      tokens:
        DB_HOST: db.internal
      ops:
        - id: myField
          tokenDef:
            default: generic-@DB_HOST@
            prod: special-@DB_HOST@
          at:
            - tokenDefResolved
            - "0"
            - value
        - id: myField
          tokenDef:
            default: generic-@DB_HOST@
            prod: special-@DB_HOST@
          at:
            - tokenDefResolved
            - "0"
            - string
          string: true
    asserts:
      - equal:
          path: tokenDefResolved["0"].value
          value: special-db.internal
      - equal:
          path: tokenDefResolved["0"].string
          value: special-db.internal
  - it: 'C-31: crdkit.tokenDef.value falls back to the ad-hoc structure''s own ''default'' entry when the target doesn''t match'
    set:
      target: qa
      ops:
        - id: myField
          tokenDef:
            default: fallback-value
            prod: prod-only-value
          at:
            - tokenDefResolved
            - "0"
            - value
        - id: myField
          tokenDef:
            default: fallback-value
            prod: prod-only-value
          at:
            - tokenDefResolved
            - "0"
            - string
          string: true
    asserts:
      - equal:
          path: tokenDefResolved["0"].value
          value: fallback-value
  - it: 'C-31: crdkit.tokenDef.value returns a structural result unchanged, same recursive substitution as a real token'
    set:
      target: prod
      tokens:
        DB_HOST: db.internal
      ops:
        - id: myField
          tokenDef:
            default:
              host: '@DB_HOST@'
              port: 5432
          at:
            - tokenDefResolved
            - "0"
            - value
        - id: myField
          tokenDef:
            default:
              host: '@DB_HOST@'
              port: 5432
          at:
            - tokenDefResolved
            - "0"
            - string
          string: true
    asserts:
      - equal:
          path: tokenDefResolved["0"].value
          value:
            host: db.internal
            port: 5432
      - equal:
          path: tokenDefResolved["0"].string
          value: '{"host":"db.internal","port":5432}'
  - it: 'C-31: crdkit.tokenDef.value records a ''no value found'' error using the caller-supplied fieldId, same diagnostic shape as a real token'
    set:
      target: unrecognized
      ops:
        - id: myField
          tokenDef:
            prod: only-for-prod
          at:
            - tokenDefResolved
            - "0"
            - value
        - id: myField
          tokenDef:
            prod: only-for-prod
          at:
            - tokenDefResolved
            - "0"
            - string
          string: true
    asserts:
      - exists:
          path: diagnostics.error[?(@ =~ /no\ value\ found\ for\ 'myField'\ —\ target\ chain\ exhausted\ at\ 'unrecognized'\ starting\ from\ 'unrecognized'/)]
  - it: 'C-10: an annotation is written literally alongside target entries, no "value" wrapper'
    set:
      target: prod-01
      tokens:
        DB_HOST:
          default: db.internal
          exposure: main
      annotations:
        - exposure
      ops:
        - info: DB_HOST
          at:
            - info
            - DB_HOST
    asserts:
      - equal:
          path: info["DB_HOST"].annotations["exposure"]
          value: main
  - it: 'C-10: an annotation value is never validated — arbitrary values are allowed'
    set:
      target: prod
      tokens:
        EXPOSED:
          default: x
          exposure: bogus-value
      annotations:
        - exposure
      ops:
        - info: EXPOSED
          at:
            - info
            - EXPOSED
    asserts:
      - notExists:
          path: diagnostics.error
      - notExists:
          path: diagnostics.warning
      - equal:
          path: info["EXPOSED"].annotations["exposure"]
          value: bogus-value
  - it: 'C-10: an annotation on a system (locked) token is preserved after merge'
    set:
      target: prod
      system:
        LOCKED_VAR:
          default: x
          exposure: lib-value
      annotations:
        - exposure
      ops:
        - info: LOCKED_VAR
          at:
            - info
            - LOCKED_VAR
    asserts:
      - equal:
          path: info["LOCKED_VAR"].annotations["exposure"]
