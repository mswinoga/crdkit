suite: crdkit values schema
templates:
  - cr.yaml
values:
  - ../fixtures/base.yaml
tests:
  - it: 'C-19: a valid schema passes the self-check'
    set:
      ops:
        - check: {}
          at:
            - r0
          schema:
            type: map
            properties:
              name:
                type: string
                required: true
                doc: Name.
              tags:
                type: list
                items:
                  type: scalar
              extra:
                type: map
                values:
                  type: any
                keys:
                  pattern: ^[a-z]+$
              host:
                type: scalar
    asserts:
      - equal:
          path: r0
          value: "true"
      - notExists:
          path: diagnostics.error
  - it: 'C-19: every self-check rule records its own ERROR and the check fails'
    set:
      ops:
        - check: {}
          at:
            - r0
          schema:
            type: map
            properties:
              a:
                type: thing
              b:
                type: map
                enum:
                  - a
              c:
                type: date
              d:
                type: map
                static: true
              e:
                type: list
                static: true
                items:
                  type: scalar
              f:
                type: scalar
                markers: false
              q:
                type: scalar
                tokens: true
              g:
                type: scalar
                default: x
                required: true
              h:
                type: scalar
                requried: true
              i:
                type: scalar
                enum: a
              j:
                type: map
                keys: {}
              o:
                type: map
                values:
                  type: any
                keys:
                  pattern: ^[A-Z]+$
                  label: 5
              p:
                type: map
                values:
                  type: any
                keys:
                  pattern: ^[A-Z]+$
                  label: <ID>
              k: not-a-node
              l:
                type: scalar
                required: yes
              m:
                kind: scalar
              n:
                type: int
                items:
                  type: any
    asserts:
      - equal:
          path: r0
          value: ""
      - lengthEqual:
          path: diagnostics.error
          count: 17
      - exists:
          path: diagnostics.error[?(@ =~ /unknown\ type\ 'thing'/)]
      - exists:
          path: diagnostics.error[?(@ =~ /'enum'\ does\ not\ apply\ to\ type\ 'map'/)]
      - exists:
          path: diagnostics.error[?(@ =~ /unknown\ type\ 'date'/)]
      - exists:
          path: diagnostics.error[?(@ =~ /'static'\ does\ not\ apply\ to\ type\ 'map'/)]
      - exists:
          path: diagnostics.error[?(@ =~ /'static'\ does\ not\ apply\ to\ type\ 'list'/)]
      - exists:
          path: diagnostics.error[?(@ =~ /unknown\ schema\ key\ 'markers'/)]
      - exists:
          path: diagnostics.error[?(@ =~ /true'\ exclude\ each\ other/)]
      - exists:
          path: diagnostics.error[?(@ =~ /unknown\ schema\ key\ 'requried'/)]
      - exists:
          path: diagnostics.error[?(@ =~ /'enum'\ must\ be\ a\ list/)]
      - exists:
          path: diagnostics.error[?(@ =~ /<regex>\}/)]
      - exists:
          path: diagnostics.error[?(@ =~ /node\ must\ be\ a\ map/)]
      - exists:
          path: diagnostics.error[?(@ =~ /'required'\ must\ be\ a\ bool/)]
      - exists:
          path: diagnostics.error[?(@ =~ /unknown\ schema\ key\ 'kind'/)]
      - exists:
          path: diagnostics.error[?(@ =~ /unknown\ type\ ''/)]
      - exists:
          path: diagnostics.error[?(@ =~ /'items'\ does\ not\ apply\ to\ type\ 'int'/)]
      - exists:
          path: diagnostics.error[?(@ =~ /'keys\.label'\ must\ be\ a\ string/)]
      - exists:
          path: diagnostics.error[?(@ =~ /unknown\ schema\ key\ 'tokens'/)]
  - it: 'C-19: a switch case must declare the switch key as a static scalar'
    set:
      ops:
        - check: {}
          at:
            - r0
          schema:
            type: map
            values:
              switch:
                by: type
                cases:
                  good:
                    type: map
                    properties:
                      type:
                        type: scalar
                        static: true
                  bad:
                    type: map
                    properties:
                      type:
                        type: scalar
                  missing:
                    type: map
    asserts:
      - lengthEqual:
          path: diagnostics.error
          count: 2
      - exists:
          path: diagnostics.error[?(@ =~ /true'/)]
  - it: 'C-19: a schema that failed to parse is reported once, however often it is checked'
    set:
      ops:
        - check: {}
          at:
            - r0
          schema:
            Error: 'error converting YAML to JSON: yaml: line 2'
        - check: {}
          at:
            - r1
          schema:
            Error: 'error converting YAML to JSON: yaml: line 2'
    asserts:
      - lengthEqual:
          path: diagnostics.error
          count: 1
      - exists:
          path: diagnostics.error[?(@ =~ /line\ 2/)]
  - it: 'C-19: an invalid schema skips validation and returns the values unchanged'
    set:
      ops:
        - validate: {}
          at:
            - r0
          schema:
            type: map
            properties:
              a:
                type: bogus
            values:
              type: scalar
          values:
            a: 1
            b:
              - x
    asserts:
      - equal:
          path: r0
          value:
            a: 1
            b:
              - x
      - notExists:
          path: diagnostics.warning
  - it: 'C-22: values matching every type pass through unchanged, with no diagnostics'
    set:
      ops:
        - validate: {}
          at:
            - r0
          schema:
            type: map
            properties:
              name:
                type: string
              count:
                type: int
              ratio:
                type: number
              flag:
                type: bool
              tags:
                type: list
                items:
                  type: string
              labels:
                type: map
                values:
                  type: any
              blob:
                type: any
          values:
            name: app
            count: 3
            ratio: 0.5
            flag: true
            tags:
              - a
              - b
            labels:
              x:
                y:
                  - 1
            blob:
              - 1
              - z: 2
    asserts:
      - equal:
          path: r0
          value:
            name: app
            count: 3
            ratio: 0.5
            flag: true
            tags:
              - a
              - b
            labels:
              x:
                y:
                  - 1
            blob:
              - 1
              - z: 2
      - notExists:
          path: diagnostics.error
      - notExists:
          path: diagnostics.warning
  - it: 'C-22: type scalar accepts a string, an int and a bool'
    set:
      ops:
        - validate: {}
          at:
            - r0
          schema:
            type: map
            properties:
              s:
                type: scalar
              i:
                type: scalar
              b:
                type: scalar
          values:
            s: text
            i: 3
            b: false
    asserts:
      - equal:
          path: r0
          value:
            s: text
            i: 3
            b: false
      - notExists:
          path: diagnostics.error
      - notExists:
          path: diagnostics.warning
  - it: 'C-22: a shape mismatch is a WARNING and the node is dropped'
    set:
      ops:
        - validate: {}
          at:
            - r0
          schema:
            type: map
            properties:
              m:
                type: map
              l:
                type: list
              s:
                type: scalar
              keep:
                type: scalar
          values:
            m: x
            l: x
            s:
              - 1
            keep: ok
    asserts:
      - equal:
          path: r0
          value:
            keep: ok
      - lengthEqual:
          path: diagnostics.warning
          count: 3
      - exists:
          path: diagnostics.warning[?(@ =~ /'l'\ must\ be\ a\ list\ —\ ignored/)]
      - exists:
          path: diagnostics.warning[?(@ =~ /'m'\ must\ be\ a\ map\ —\ ignored/)]
      - exists:
          path: diagnostics.warning[?(@ =~ /'s'\ must\ be\ a\ scalar\ —\ ignored/)]
      - notExists:
          path: diagnostics.error
  - it: 'C-22: a shape mismatch or unmatched switch on a required node is an ERROR; optional ones stay WARNINGs'
    set:
      ops:
        - validate: {}
          at:
            - r0
          schema:
            type: map
            properties:
              m:
                type: map
                required: true
              l:
                type: list
                required: true
              s:
                type: scalar
                required: true
              opt:
                type: map
              sw:
                required: true
                switch:
                  by: kind
                  cases:
                    a:
                      type: map
                      properties:
                        kind:
                          type: string
                          static: true
          values:
            m: x
            l: x
            s:
              - 1
            opt: x
            sw:
              kind: b
    asserts:
      - equal:
          path: r0
          value: {}
      - lengthEqual:
          path: diagnostics.error
          count: 4
      - exists:
          path: diagnostics.error[?(@ =~ /'l'\ must\ be\ a\ list\ —\ ignored/)]
      - exists:
          path: diagnostics.error[?(@ =~ /'m'\ must\ be\ a\ map\ —\ ignored/)]
      - exists:
          path: diagnostics.error[?(@ =~ /'s'\ must\ be\ a\ scalar\ —\ ignored/)]
      - exists:
          path: diagnostics.error[?(@ =~ /'sw\.kind'\ has\ unknown\ value\ 'b'\ —\ ignored/)]
      - lengthEqual:
          path: diagnostics.warning
          count: 1
      - exists:
          path: diagnostics.warning[?(@ =~ /'opt'\ must\ be\ a\ map\ —\ ignored/)]
  - it: 'C-22: a map on a static scalar is an ERROR, dropped; a required one is not reported again'
    set:
      ops:
        - validate: {}
          at:
            - r0
          schema:
            type: map
            properties:
              enabled:
                type: bool
                static: true
                default: true
              kind:
                type: string
                static: true
                required: true
          values:
            enabled:
              PROD: false
            kind:
              default: a
    asserts:
      - equal:
          path: r0
          value:
            enabled: true
      - lengthEqual:
          path: diagnostics.error
          count: 2
      - exists:
          path: diagnostics.error[?(@ =~ /'enabled'\ is\ static\ —\ a\ token\ declaration\ is\ not\ allowed\ —\ ignored/)]
      - exists:
          path: diagnostics.error[?(@ =~ /'kind'\ is\ static\ —\ a\ token\ declaration\ is\ not\ allowed\ —\ ignored/)]
      - notExists:
          path: diagnostics.warning
  - it: 'C-22: a root value of the wrong shape comes back as an empty map'
    set:
      ops:
        - validate: {}
          at:
            - r0
          schema:
            type: map
          values: not-a-map
          path: application
    asserts:
      - equal:
          path: r0
          value: {}
      - lengthEqual:
          path: diagnostics.warning
          count: 1
      - exists:
          path: diagnostics.warning[?(@ =~ /'application'\ must\ be\ a\ map\ —\ ignored/)]
  - it: 'C-22: an unknown key is a WARNING with its full path and is dropped; a map with "values" accepts every other key'
    set:
      ops:
        - validate: {}
          at:
            - r0
          schema:
            type: map
            properties:
              application:
                type: map
                properties:
                  services:
                    type: map
                    values:
                      type: map
                      properties:
                        greeting:
                          type: scalar
            values:
              type: any
          values:
            global:
              x: 1
            application:
              services:
                APP:
                  greting: hi
                  greeting: hello
                a.b:
                  other: 1
              extra: true
    asserts:
      - equal:
          path: r0
          value:
            global:
              x: 1
            application:
              services:
                APP:
                  greeting: hello
                a.b: {}
      - lengthEqual:
          path: diagnostics.warning
          count: 3
      - exists:
          path: diagnostics.warning[?(@ =~ /'application\.extra'\ is\ not\ a\ known\ key\ —\ ignored/)]
      - exists:
          path: diagnostics.warning[?(@ =~ /'application\.services\.APP\.greting'\ is\ not\ a\ known\ key\ —\ ignored/)]
      - exists:
          path: diagnostics.warning[?(@ =~ /'application\.services\["a\.b"\]\.other'\ is\ not\ a\ known\ key\ —\ ignored/)]
  - it: 'C-22: a key failing "keys.pattern" is an ERROR and is dropped with its value'
    set:
      ops:
        - validate: {}
          at:
            - r0
          schema:
            type: map
            keys:
              pattern: ^[A-Z][A-Z0-9_]*$
            values:
              type: scalar
          values:
            GOOD: 1
            bad: 2
          path: environment
    asserts:
      - equal:
          path: r0
          value:
            GOOD: 1
      - lengthEqual:
          path: diagnostics.error
          count: 1
      - exists:
          path: diagnostics.error[?(@ =~ /key\ 'environment\.bad'\ must\ match\ '\^\[A\-Z\]\[A\-Z0\-9_\]\*\$'\ —\ ignored/)]
      - notExists:
          path: diagnostics.warning
  - it: 'C-22: list elements are validated with indexed paths; a failing element is dropped'
    set:
      ops:
        - validate: {}
          at:
            - r0
          schema:
            type: map
            properties:
              ports:
                type: list
                items:
                  type: int
          values:
            ports:
              - 80
              - http
              - 443
    asserts:
      - equal:
          path: r0
          value:
            ports:
              - 80
              - 443
      - lengthEqual:
          path: diagnostics.error
          count: 1
      - exists:
          path: diagnostics.error[?(@ =~ /'ports\[1\]'\ must\ be\ of\ type\ 'int'\ —\ ignored/)]
  - it: 'C-22: type, enum, pattern and markers violations are ERRORs and the value is dropped'
    set:
      ops:
        - validate: {}
          at:
            - r0
          schema:
            type: map
            properties:
              enabled:
                type: bool
              count:
                type: int
              ratio:
                type: number
              name:
                type: string
              mode:
                type: scalar
                enum:
                  - validate
                  - deploy
              id:
                type: scalar
                pattern: ^[a-z]+$
              type:
                type: scalar
                static: true
          values:
            enabled: "false"
            count: 1.5
            ratio: "0.5"
            name: 5
            mode: deploi
            id: ABC
            type: '@KIND@'
    asserts:
      - equal:
          path: r0
          value: {}
      - lengthEqual:
          path: diagnostics.error
          count: 7
      - exists:
          path: diagnostics.error[?(@ =~ /'count'\ must\ be\ of\ type\ 'int'\ —\ ignored/)]
      - exists:
          path: diagnostics.error[?(@ =~ /'enabled'\ must\ be\ of\ type\ 'bool'\ —\ ignored/)]
      - exists:
          path: diagnostics.error[?(@ =~ /'id'\ must\ match\ '\^\[a\-z\]\+\$'\ —\ ignored/)]
      - exists:
          path: diagnostics.error[?(@ =~ /'mode'\ must\ be\ one\ of\ 'validate',\ 'deploy'\ —\ ignored/)]
      - exists:
          path: diagnostics.error[?(@ =~ /'name'\ must\ be\ of\ type\ 'string'\ —\ ignored/)]
      - exists:
          path: diagnostics.error[?(@ =~ /'ratio'\ must\ be\ of\ type\ 'number'\ —\ ignored/)]
      - exists:
          path: diagnostics.error[?(@ =~ /'type'\ must\ not\ contain\ '@NAME@'\ markers\ —\ ignored/)]
  - it: 'C-22: a string holding markers skips type/enum/pattern (the value pass checks it)'
    set:
      ops:
        - validate: {}
          at:
            - r0
          schema:
            type: map
            properties:
              count:
                type: int
                enum:
                  - 1
                  - 2
          values:
            count: '@COUNT@'
    asserts:
      - equal:
          path: r0
          value:
            count: '@COUNT@'
      - notExists:
          path: diagnostics.error
  - it: 'C-22: dotted and relative markers count as markers: rejected in a static field, type check skipped elsewhere'
    set:
      ops:
        - validate: {}
          at:
            - r0
          schema:
            type: map
            properties:
              type:
                type: scalar
                static: true
              port:
                type: int
              host:
                type: string
                static: true
          values:
            type: '@.kind@'
            port: '@SVC.port@'
            host: me@example.com
    asserts:
      - equal:
          path: r0
          value:
            port: '@SVC.port@'
            host: me@example.com
      - lengthEqual:
          path: diagnostics.error
          count: 1
      - exists:
          path: diagnostics.error[?(@ =~ /'type'\ must\ not\ contain\ '@NAME@'\ markers\ —\ ignored/)]
  - it: 'C-20: a token declaration in a per-target field is kept as written; a plain value is checked as usual'
    set:
      ops:
        - validate: {}
          at:
            - r0
          schema:
            type: map
            properties:
              greeting:
                type: string
              hosts:
                type: list
                items:
                  type: scalar
              plain:
                type: int
          values:
            greeting:
              default: hi
              prod: hello
            hosts:
              default:
                - a
              prod:
                - a
                - b
            plain: x
    asserts:
      - equal:
          path: r0
          value:
            greeting:
              default: hi
              prod: hello
            hosts:
              default:
                - a
              prod:
                - a
                - b
      - lengthEqual:
          path: diagnostics.error
          count: 1
      - exists:
          path: diagnostics.error[?(@ =~ /'plain'\ must\ be\ of\ type\ 'int'\ —\ ignored/)]
  - it: 'C-22: a missing required key is an ERROR; a present but dropped one is not reported twice'
    set:
      ops:
        - validate: {}
          at:
            - r0
          schema:
            type: map
            properties:
              target:
                type: scalar
                required: true
              name:
                type: string
                required: true
          values:
            name: 5
    asserts:
      - lengthEqual:
          path: diagnostics.error
          count: 2
      - exists:
          path: diagnostics.error[?(@ =~ /'name'\ must\ be\ of\ type\ 'string'\ —\ ignored/)]
      - exists:
          path: diagnostics.error[?(@ =~ /'target'\ is\ required/)]
  - it: 'C-22: a default is applied when the key is absent, never over a present key, and also after a dropped value'
    set:
      ops:
        - validate: {}
          at:
            - r0
          schema:
            type: map
            properties:
              enabled:
                type: bool
                default: true
              mode:
                type: scalar
                default: deploy
              level:
                type: int
                default: 1
              greeting:
                type: scalar
                default:
                  default: hi
                  prod: hello
          values:
            mode: validate
            enabled: no
    asserts:
      - equal:
          path: r0
          value:
            enabled: true
            mode: validate
            level: 1
            greeting:
              default: hi
              prod: hello
      - lengthEqual:
          path: diagnostics.error
          count: 1
      - exists:
          path: diagnostics.error[?(@ =~ /'enabled'\ must\ be\ of\ type\ 'bool'\ —\ ignored/)]
  - it: 'C-22: a null value counts as absent'
    set:
      ops:
        - validate: {}
          at:
            - r0
          schema:
            type: map
            properties:
              mode:
                type: scalar
                default: deploy
              target:
                type: scalar
                required: true
          values:
            mode: null
            target: null
    asserts:
      - equal:
          path: r0
          value:
            mode: deploy
      - lengthEqual:
          path: diagnostics.error
          count: 1
      - exists:
          path: diagnostics.error[?(@ =~ /'target'\ is\ required/)]
  - it: 'C-22: a switch validates a map against the case its key selects; unknown or missing values are WARNINGs and the node is dropped'
    set:
      ops:
        - validate: {}
          at:
            - r0
          schema:
            type: map
            values:
              switch:
                by: type
                cases:
                  greeter:
                    type: map
                    properties:
                      type:
                        type: scalar
                        static: true
                        required: true
                      greeting:
                        type: scalar
                  leader:
                    type: map
                    properties:
                      type:
                        type: scalar
                        static: true
                        required: true
                      greeter:
                        type: scalar
          values:
            A:
              type: greeter
              greeting: hi
              greeter: B
            B:
              type: leader
              greeter: A
            C:
              type: other
            D:
              greeting: hi
            E: x
          path: services
    asserts:
      - equal:
          path: r0
          value:
            A:
              type: greeter
              greeting: hi
            B:
              type: leader
              greeter: A
      - lengthEqual:
          path: diagnostics.warning
          count: 4
      - exists:
          path: diagnostics.warning[?(@ =~ /'services\.A\.greeter'\ is\ not\ a\ known\ key\ —\ ignored/)]
      - exists:
          path: diagnostics.warning[?(@ =~ /'services\.C\.type'\ has\ unknown\ value\ 'other'\ —\ ignored/)]
      - exists:
          path: diagnostics.warning[?(@ =~ /'services\.D'\ has\ no\ 'type'\ —\ ignored/)]
      - exists:
          path: diagnostics.warning[?(@ =~ /'services\.E'\ must\ be\ a\ map\ —\ ignored/)]
  - it: 'C-21: a switch unless hit checks only by and unless.key; other keys are dropped silently'
    set:
      ops:
        - validate: {}
          at:
            - r0
          schema:
            type: map
            values:
              switch:
                by: type
                unless:
                  key: enabled
                  value: false
                cases:
                  greeter:
                    type: map
                    properties:
                      type:
                        type: scalar
                        static: true
                        required: true
                      enabled:
                        type: bool
                        static: true
                        default: true
                      greeting:
                        type: string
                        required: true
          values:
            A:
              type: greeter
              enabled: false
              extra: 1
            B:
              type: greeter
              enabled: "false"
            C:
              type: greeter
              greeting: hi
            D:
              type: other
              enabled: false
          path: services
    asserts:
      - equal:
          path: r0
          value:
            A:
              type: greeter
              enabled: false
            B:
              type: greeter
              enabled: true
            C:
              type: greeter
              enabled: true
              greeting: hi
      - lengthEqual:
          path: diagnostics.error
          count: 2
      - exists:
          path: diagnostics.error[?(@ =~ /'services\.B\.enabled'\ must\ be\ of\ type\ 'bool'\ —\ ignored/)]
      - exists:
          path: diagnostics.error[?(@ =~ /'services\.B\.greeting'\ is\ required/)]
      - lengthEqual:
          path: diagnostics.warning
          count: 1
      - exists:
          path: diagnostics.warning[?(@ =~ /'services\.D\.type'\ has\ unknown\ value\ 'other'\ —\ ignored/)]
  - it: 'C-21: the value pass skips every other key of a switch unless hit'
    set:
      target: prod
      ops:
        - validateValues:
            path: services
          schema:
            type: map
            values:
              switch:
                by: type
                unless:
                  key: enabled
                  value: false
                cases:
                  greeter:
                    type: map
                    properties:
                      type:
                        type: scalar
                        static: true
                      enabled:
                        type: bool
                        static: true
                      count:
                        type: int
          values:
            A:
              type: greeter
              enabled: false
              count:
                prod: x
            B:
              type: greeter
              count:
                prod: y
    asserts:
      - lengthEqual:
          path: diagnostics.error
          count: 1
      - exists:
          path: diagnostics.error[?(@ =~ /'services\.B\.count'\ for\ target\ 'prod'\ must\ be\ of\ type\ 'int'\ —\ got\ 'y'/)]
  - it: 'C-19: a malformed switch unless is a self-check ERROR'
    set:
      ops:
        - check: {}
          at:
            - r0
          schema:
            type: map
            values:
              switch:
                by: type
                unless:
                  key: type
                  value: false
                cases:
                  a:
                    type: map
                    properties:
                      type:
                        type: scalar
                        static: true
        - check: {}
          at:
            - r1
          schema:
            type: map
            values:
              switch:
                by: type
                unless:
                  key: enabled
                  value:
                    - false
                cases:
                  a:
                    type: map
                    properties:
                      type:
                        type: scalar
                        static: true
        - check: {}
          at:
            - r2
          schema:
            type: map
            values:
