suite: crdkit.render top-level behavior
templates:
  - render_test.yaml
tests:

  - it: whatever the chain puts on ctx.model is substituted once and emitted verbatim, with no crdkit-side shape opinion
    set:
      target: prod
      chainPopulatesModel: true
      tokens:
        GROUP_SUFFIX: "v2"
    asserts:
      - equal:
          path: apiVersion
          value: "harness.example.com/v2"
      - equal:
          path: kind
          value: "HarnessCR"
      - equal:
          path: metadata.labels["harness.example.com/from-model"]
          value: "v2-label"

  - it: a chain that never touches ctx.model renders an empty document, no error — crdkit no longer enforces any field's presence
    set:
      target: prod
      chainPopulatesModel: false
    asserts:
      - notExists:
          path: apiVersion
      - notExists:
          path: kind
      - notExists:
          path: metadata

  - it: a seeded diag.errors is transported and the render still produces the model
    set:
      target: prod
      chainPopulatesModel: true
      tokens:
        GROUP_SUFFIX: "v2"
      diagSeed:
        errors:
          - "seeded"
    asserts:
      - equal:
          path: kind
          value: "HarnessCR"

  - it: a state seed key is copied into ctx and visible to the chain
    set:
      target: prod
      renderState:
        libraryData:
          input: {a: 1}
    asserts:
      - equal:
          path: state.libraryData
          value:
            input: {a: 1}
      - lengthEqual:
          path: stateErrors
          count: 0

  - it: a state key colliding with a crdkit ctx key records an ERROR and leaves ctx intact
    set:
      target: prod
      chainPopulatesModel: true
      tokens:
        GROUP_SUFFIX: "v2"
      renderState:
        model: {hijacked: true}
        target: other
    asserts:
      - equal:
          path: kind
          value: "HarnessCR"
      - notExists:
          path: hijacked
      - equal:
          path: state.target
          value: prod
      - contains:
          path: stateErrors
          content: "state key 'model' collides with a crdkit ctx key and was ignored"
      - contains:
          path: stateErrors
          content: "state key 'target' collides with a crdkit ctx key and was ignored"

  - it: an absent state seed changes nothing
    set:
      target: prod
      chainPopulatesModel: true
      tokens:
        GROUP_SUFFIX: "v2"
    asserts:
      - notExists:
          path: state
      - equal:
          path: apiVersion
          value: "harness.example.com/v2"
