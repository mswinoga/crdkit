{{/*
Unlike test.yaml (which deliberately exercises crdkit's helpers
directly, never crdkit.render itself — see its own doc comment), THIS
template exists specifically to exercise crdkit.render's own top-level
behavior: it no longer knows or cares about apiVersion/kind/labels/spec
at all — whatever the chain puts on model is substituted once and
emitted VERBATIM as `{{ model | toYaml }}`, nothing more. A minimal
stand-in integration, driven by .Values.chainPopulatesModel (bool), lets
a test case toggle whether anything runs at all — crdkit has no
specific library of its own to borrow a real preamble integration from,
so this harness defines its own minimal one to prove the mechanism.
*/}}
{{- define "harness.integration.maybePopulateModel" -}}
{{- if .root.Values.chainPopulatesModel -}}
  {{- include "crdkit.dictMerge" (list .model (dict "apiVersion" "harness.example.com/@GROUP_SUFFIX@" "kind" "HarnessCR")) -}}
  {{- include "crdkit.dictMerge" (list .model "metadata" "labels" (dict "harness.example.com/from-model" "@GROUP_SUFFIX@-label")) -}}
{{- end -}}
{{- include "crdkit.integrations.chain" . -}}
{{- end -}}

{{/* Copies every .Values.renderState key back out of ctx (as the chain sees it) into model.state, plus diag.errors at that point into model.stateErrors. "model" is skipped: copying ctx.model into itself would make it cyclic. */}}
{{- define "harness.integration.exposeState" -}}
{{- $ctx := . -}}
{{- if .root.Values.renderState -}}
  {{- $seen := dict -}}
  {{- range $key, $_ := $ctx.root.Values.renderState -}}
    {{- if ne $key "model" -}}
      {{- $_ := set $seen $key (index $ctx $key) -}}
    {{- end -}}
  {{- end -}}
  {{- include "crdkit.dictMerge" (list $ctx.model (dict "state" $seen "stateErrors" $ctx.diag.errors)) -}}
{{- end -}}
{{- end -}}
{{- include "crdkit.render" (dict
      "context" $
      "tokens" (.Values.tokens | default dict)
      "target" (.Values.target | default "prod")
      "system" (.Values.system | default dict)
      "defaults" (.Values.defaults | default dict)
      "annotations" (.Values.annotations | default (list))
      "diag" ((.Values.diagSeed | default dict) | toYaml | fromYaml)
      "state" ((.Values.renderState | default dict) | toYaml | fromYaml)
      "chain" (list "harness.integration.maybePopulateModel" "harness.integration.exposeState")
    ) -}}
