{{/*
Product-agnostic exercise of crdkit's critical internals — deliberately
does NOT go through a "mycrd.render"-style wrapper. crdkit has no
specific library of its own, so "system"/"defaults" (normally supplied
by a downstream library) are set directly via .Values here, letting
tests exercise crdkit's own resolution/collision/diagnostics logic
without coupling to any product's actual token content.

Mirrors crdkit.render's own pipeline shape (minus the chain/model
output), so it exercises the SAME lazy/cached/target-scoped resolution
a real render goes through:
  - crdkit.tokens.merge.internal produces ctx.tokens (the raw declarations map —
    NOT resolved yet, see crdkit's CLAUDE.md).
  - $ctx is built the same shape crdkit.render itself builds (root/diag/
    model/tokens/target/parentTargetTemplate), since every helper below
    takes ctx rather than tokens/diag/target separately.
  - "harness.parentTarget" (defined in _helpers.tpl, this chart) is
    ALWAYS the parentTargetTemplate passed to ctx — it's a plain, fully
    data-driven lookup against .Values.parentTargetMap (a flat
    {rung: nextRung} dict), which lets a test case opt into escalation
    just by setting values, with no need to define a bespoke template
    per test. A test that doesn't set parentTargetMap gets an empty
    map, so the lookup always misses — functionally identical to
    crdkit.noParentTarget for that test.
  - .Values.tokenOps is a data-driven list of {name, value,
    targetContainer, target} applied via crdkit.token.add, mimicking an
    integration contributing a derived token mid-chain. "target" is
    optional per-op, defaulting to .Values.target — override it to
    exercise token.add's merge-not-clobber behavior across multiple
    calls for the same name under DIFFERENT targets in one test case.
  - .Values.structure is a second, separate document that gets
    crdkit.tokens.substitute applied to it — this is what makes a token
    "used" and triggers its (lazy) resolution for .Values.target.
  - .Values.crossTargets is an optional list of target STRINGS: for
    each, every name in .Values.crossTargetNames gets resolved via
    crdkit.token.value, rendered into "crossResolved.<target>.<name>"
    as `{value: <resolved thing>}` — exercises resolving a token for a
    target OTHER than the one driving this "render" (the whole point of
    the redesign), and lets a test assert on the resulting "_value"
    cache shape directly via "tokens". No more "targetContainer" here —
    it's validated eagerly at merge time instead, see
    crdkit.tokens.merge.internal; assert on "tokens.NAME.targetContainer"
    (the raw declaration) instead. Deliberately does NOT also compute
    crdkit.token.string here — that has a diagnostic side effect on a
    structural value (see crdkit.stringify.internal), which would
    silently pollute diag.errors for every OTHER test that happens to
    resolve a structural token via crossTargets for unrelated reasons.
    Use .Values.stringOps (below) to opt into exercising it instead.
  - .Values.stringOps is a data-driven list of {name, target} exercising
    crdkit.token.string specifically, rendered into "stringResolved" (a
    list of plain strings, same order) — kept separate from
    crossResolved/crossTargets on purpose (see above).
  - .Values.tokenDefOps is a data-driven list of {fieldId, def, target}
    exercising crdkit.tokenDef.value AND crdkit.tokenDef.string together
    on an arbitrary structure that is NOT registered in ctx.tokens —
    rendered into "tokenDefResolved", a list of `{value, string}` in the
    same order, one per op. Unlike crossResolved, computing both here is
    fine: crdkit.tokenDef.value has no OTHER, unrelated callers in this
    harness to accidentally pollute.
  - .Values.modelOps is a data-driven list of operations {op, path,
    value} (or {op, key, default} for ensureDictKey) applied in order
    to a fresh model, letting a test case drive an arbitrary sequence
    of crdkit.dictMerge/listExtend/ensureDictKey calls purely through
    values (rendered as "model").

"tokens" in the output is the LIVE ctx.tokens map, including whatever
"_value" caches accumulated from everything above — tests can assert
directly on cache shape (e.g. `tokens.NAME._value.qap1`) as well as on
substituted "structure" text.
*/}}
{{- $diag := dict "errors" (list) "warnings" (list) -}}
{{- $target := .Values.target | default "" -}}

{{- $tokens := include "crdkit.tokens.merge.internal" (dict
      "tokens" (.Values.tokens | default dict)
      "diag" $diag
      "system" (.Values.system | default dict)
      "defaults" (.Values.defaults | default dict)) | fromYaml -}}

{{- $model := dict -}}
{{- $ctx := dict "root" $ "diag" $diag "model" $model "tokens" $tokens "target" $target "parentTargetTemplate" "harness.parentTarget" -}}

{{- range $op := .Values.tokenOps | default (list) -}}
  {{- $_ := include "crdkit.token.add" (list $ctx $op.name $op.value $op.targetContainer ($op.target | default $target)) -}}
{{- end -}}

{{- $structureYaml := .Values.structure | default dict | toYaml -}}
{{- $substituted := include "crdkit.tokens.substitute" (list $ctx $structureYaml $target) | fromYaml -}}

{{- $crossResolved := dict -}}
{{- range $t := .Values.crossTargets | default (list) -}}
  {{- $forThisTarget := dict -}}
  {{- range $name := $.Values.crossTargetNames | default (list) -}}
    {{- $r := include "crdkit.token.value" (list $ctx $name $t) | fromYaml -}}
    {{- $forThisTarget = set $forThisTarget $name (dict "value" $r.value) -}}
  {{- end -}}
  {{- $crossResolved = set $crossResolved $t $forThisTarget -}}
{{- end -}}

{{- $stringResolved := list -}}
{{- range $op := .Values.stringOps | default (list) -}}
  {{- $opTarget := $op.target | default "" -}}
  {{- $stringResolved = append $stringResolved (include "crdkit.token.string" (list $ctx $op.name $opTarget)) -}}
{{- end -}}

{{- $tokenDefResolved := list -}}
{{- range $op := .Values.tokenDefOps | default (list) -}}
  {{- $opTarget := $op.target | default "" -}}
  {{- $r := include "crdkit.tokenDef.value" (list $ctx $op.fieldId $op.def $opTarget) | fromYaml -}}
  {{- $s := include "crdkit.tokenDef.string" (list $ctx $op.fieldId $op.def $opTarget) -}}
  {{- $tokenDefResolved = append $tokenDefResolved (dict "value" $r.value "string" $s) -}}
{{- end -}}

{{- range $op := .Values.modelOps | default (list) -}}
  {{- if eq $op.op "dictMerge" -}}
    {{- include "crdkit.dictMerge" (concat (list $model) $op.path (list $op.value)) -}}
  {{- else if eq $op.op "listExtend" -}}
    {{- include "crdkit.listExtend" (concat (list $model) $op.path (list $op.value)) -}}
  {{- else if eq $op.op "ensureDictKey" -}}
    {{- include "crdkit.ensureDictKey" (dict "model" $model "key" $op.key "default" $op.default) -}}
  {{- end -}}
{{- end -}}

tokens:
{{ $tokens | toYaml | indent 2 }}
structure:
{{ $substituted | toYaml | indent 2 }}
crossResolved:
{{ $crossResolved | toYaml | indent 2 }}
stringResolved:
{{ $stringResolved | toYaml | indent 2 }}
tokenDefResolved:
{{ $tokenDefResolved | toYaml | indent 2 }}
model:
{{ $model | toYaml | indent 2 }}
diag:
{{ $diag | toYaml | indent 2 }}
